name: Build RX Formula Workflow Once

on:
  push:
    paths:
      - ".github/workflows/build-rx-formula-once.yml"
      - ".github/scripts/build_rx_formula_once.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate RX formula workflow
        run: python .github/scripts/build_rx_formula_once.py

      - name: Commit generated workflow and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/telegram-inject-rx-formula.yml
          git rm .github/workflows/build-rx-formula-once.yml
          git rm .github/scripts/build_rx_formula_once.py
          git commit -m "Add RX formula workflow copy"
          git push
