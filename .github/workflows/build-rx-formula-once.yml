name: Build RX Formula Workflow Once

on:
  push:
    paths:
      - ".github/workflows/build-rx-formula-once.yml"
      - ".github/scripts/build_rx_formula_once.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate RX formula workflow
        run: python .github/scripts/build_rx_formula_once.py

      - name: Export generated YAML outside workflows
        run: |
          mkdir -p generated
          cp .github/workflows/telegram-inject-rx-formula.yml generated/telegram-inject-rx-formula.yml

      - name: Commit generated YAML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/telegram-inject-rx-formula.yml
          git commit -m "Generate RX formula workflow YAML"
          git push
