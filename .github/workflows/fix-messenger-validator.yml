name: Temporary Messenger Validator Fix

on:
  push:
    paths:
      - ".github/workflows/fix-messenger-validator.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Add temporary Messenger validator fixer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch Messenger validator
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/telegram-inject.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          # Confirma que as extensões não receberam os tweaks do Messenger.
          tweak_tokens = (
              "Sideload Keychain Fix.dylib",
              "MSGPlusX.dylib",
              "MessengerEnhancements.dylib",
              "zxPluginsInject.dylib",
          )
'''
          new = '''          # As extensões devem receber somente o shim do IPA Patch.
          # MSGPlusX, Keychain Fix e MessengerEnhancements continuam
          # exclusivos do executável principal.
          forbidden_extension_tokens = (
              "Sideload Keychain Fix.dylib",
              "MSGPlusX.dylib",
              "MessengerEnhancements.dylib",
          )
          required_extension_dependency = (
              "@rpath/zxPluginsInject.dylib"
          )
'''

          old2 = '''              bad = [
                  dependency
                  for dependency
                  in extension_dependencies
                  if any(
                      token in dependency
                      for token
                      in tweak_tokens
                  )
              ]

              if bad:
                  raise SystemExit(
                      "❌ Tweak do Messenger injetado indevidamente em "
                      f"{extension.name}: {bad}"
                  )

          print(
              "✅ Layout MSGPlusX do Messenger validado"
          )
'''
          new2 = '''              bad = [
                  dependency
                  for dependency
                  in extension_dependencies
                  if any(
                      token in dependency
                      for token
                      in forbidden_extension_tokens
                  )
              ]

              if bad:
                  raise SystemExit(
                      "❌ Tweak principal do Messenger injetado "
                      "indevidamente em "
                      f"{extension.name}: {bad}"
                  )

              if (
                  required_extension_dependency
                  not in extension_dependencies
              ):
                  raise SystemExit(
                      "❌ zxPluginsInject ausente em "
                      f"{extension.name}"
                  )

          zx_path = (
              frameworks
              / "zxPluginsInject.dylib"
          )

          if not zx_path.is_file():
              raise SystemExit(
                  "❌ Frameworks/zxPluginsInject.dylib ausente"
              )

          if (
              "@rpath/zxPluginsInject.dylib"
              not in dependencies
          ):
              raise SystemExit(
                  "❌ zxPluginsInject ausente do executável principal"
              )

          if (
              info.get("UIDesignRequiresCompatibility")
              is not False
          ):
              raise SystemExit(
                  "❌ UIDesignRequiresCompatibility não está false"
              )

          print(
              "✅ Layout MSGPlusX do Messenger validado"
          )
          print(
              "✅ zxPluginsInject validado no app principal"
          )
          print(
              f"✅ zxPluginsInject validado em {len(extensions)} extensão(ões)"
          )
          print(
              "✅ UIDesignRequiresCompatibility = false"
          )
'''

          old3 = '''          print(
              f"✅ {len(extensions)} extensão(ões) sem tweaks do Messenger"
          )
'''
          new3 = '''          print(
              f"✅ {len(extensions)} extensão(ões) sem MSGPlusX/Keychain/"
              "MessengerEnhancements"
          )
'''

          for label, before, after in (
              ('extension policy', old, new),
              ('extension validation', old2, new2),
              ('final status', old3, new3),
          ):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(
                      f'Expected exactly one {label} block, found {count}'
                  )
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          print('Messenger validator patched successfully')
          PY

          git diff --check
          git diff -- .github/workflows/telegram-inject.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/telegram-inject.yml
          git commit -m "Fix Messenger zxPluginsInject validation"
          git push origin HEAD:main
