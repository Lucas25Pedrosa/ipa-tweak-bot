name: Fix missing hashlib import

on:
  push:
    paths:
      - '.github/workflows/fix-hashlib-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Patch telegram injector workflow
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/telegram-inject.yml')
          text = path.read_text(encoding='utf-8')

          marker = "          python <<'PY'\n          import json\n          import shutil\n          from pathlib import Path\n\n          work = Path(\"ipapatch_main_work\")"
          replacement = "          python <<'PY'\n          import hashlib\n          import json\n          import shutil\n          from pathlib import Path\n\n          work = Path(\"ipapatch_main_work\")"

          if replacement in text:
              print('hashlib import already present')
          elif marker in text:
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding='utf-8')
              print('hashlib import added')
          else:
              raise SystemExit('Expected main-only Python block not found')
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-hashlib-import.yml
          git add .github/workflows/telegram-inject.yml
          git commit -m 'Fix missing hashlib import in main-only IPA Patch'
          git push
