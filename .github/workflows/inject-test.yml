name: Generic IPA Injector

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o IPA descriptografado"
        required: true
        type: string

      addons:
        description: "Nome dos addons separados por vírgula. Ex: Glow"
        required: true
        type: string

      apply_ipapatch:
        description: "Aplicar IPA Patch somente nas extensões"
        required: true
        default: false
        type: boolean

      remove_extensions:
        description: "Remover extensões (.appex)"
        required: true
        default: false
        type: boolean

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils tar zip unzip curl

      - name: Install Cyan
        run: |
          python -m pip install --upgrade pip

          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          echo "✅ Cyan instalado"
          cyan --version

      - name: Install IPA Patch
        if: ${{ inputs.apply_ipapatch }}
        run: |
          echo "📥 Baixando IPA Patch..."

          curl \
            --location \
            --fail \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch

          echo "✅ IPA Patch instalado"
          ./ipapatch --version

      - name: Check incompatible options
        env:
          APPLY_IPAPATCH: ${{ inputs.apply_ipapatch }}
          REMOVE_EXTENSIONS: ${{ inputs.remove_extensions }}
        run: |
          if [ "$APPLY_IPAPATCH" = "true" ] && [ "$REMOVE_EXTENSIONS" = "true" ]; then
            echo "❌ Não é possível aplicar IPA Patch e remover extensões ao mesmo tempo."
            echo "IPA Patch precisa que os .appex sejam preservados."
            exit 1
          fi

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "📥 Baixando IPA..."

          curl \
            --location \
            --fail \
            --retry 3 \
            --output input.ipa \
            "$IPA_URL"

          echo "✅ Download concluído"
          ls -lh input.ipa

      - name: Validate IPA
        run: |
          echo "🔎 Verificando IPA..."

          if ! unzip -tq input.ipa > /dev/null; then
            echo "❌ O arquivo baixado não é um IPA/ZIP válido."
            exit 1
          fi

          echo "✅ IPA válido"

      - name: Detect app information
        id: app
        run: |
          python <<'PY'
          import zipfile
          import plistlib
          import os
          import sys

          ipa = "input.ipa"

          with zipfile.ZipFile(ipa, "r") as z:
              plist_files = [
                  name for name in z.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]

              if not plist_files:
                  print("❌ Info.plist principal não encontrado")
                  sys.exit(1)

              plist_path = plist_files[0]

              with z.open(plist_path) as f:
                  plist = plistlib.load(f)

          bundle_id = plist.get("CFBundleIdentifier")
          app_name = (
              plist.get("CFBundleDisplayName")
              or plist.get("CFBundleName")
              or "Unknown"
          )
          version = plist.get("CFBundleShortVersionString", "Unknown")

          if not bundle_id:
              print("❌ Bundle ID não encontrado")
              sys.exit(1)

          print(f"📱 App: {app_name}")
          print(f"📦 Bundle ID: {bundle_id}")
          print(f"🔢 Versão: {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"app_name={app_name}\n")
              out.write(f"version={version}\n")
          PY

      - name: Find compatible addons
        env:
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          REQUESTED_ADDONS: ${{ inputs.addons }}
        run: |
          python <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          bundle_id = os.environ["BUNDLE_ID"]
          requested_raw = os.environ["REQUESTED_ADDONS"]

          with open("config/addons.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          apps = config.get("apps", {})

          if bundle_id not in apps:
              print(f"❌ Nenhum app cadastrado para o Bundle ID: {bundle_id}")
              print()
              print("Bundle IDs cadastrados:")

              for registered in apps:
                  print(f" - {registered}")

              sys.exit(1)

          app = apps[bundle_id]
          available = app.get("addons", [])

          requested = [
              item.strip()
              for item in requested_raw.split(",")
              if item.strip()
          ]

          if not requested:
              print("❌ Nenhum addon informado")
              sys.exit(1)

          selected = []

          if len(requested) == 1 and requested[0].lower() == "all":
              selected = available
          else:
              for requested_name in requested:
                  match = next(
                      (
                          addon
                          for addon in available
                          if addon.get("name", "").lower()
                          == requested_name.lower()
                      ),
                      None
                  )

                  if not match:
                      print(f"❌ Addon não encontrado: {requested_name}")
                      print()
                      print("Addons disponíveis:")

                      for addon in available:
                          print(f" - {addon.get('name')}")

                      sys.exit(1)

                  selected.append(match)

          paths = []

          print("🧩 Addons selecionados:")

          for addon in selected:
              name = addon.get("name")
              addon_type = addon.get("type")
              file_path = addon.get("file")

              if not file_path:
                  print(f"❌ Caminho não definido para {name}")
                  sys.exit(1)

              if not Path(file_path).exists():
                  print(f"❌ Arquivo/pasta não encontrado: {file_path}")
                  sys.exit(1)

              print(f" • {name} [{addon_type}]")
              print(f"   {file_path}")

              paths.append(file_path)

          with open("selected_addons.txt", "w", encoding="utf-8") as f:
              for path in paths:
                  f.write(path + "\n")

          print()
          print(f"✅ {len(paths)} addon(s) preparado(s)")
          PY

      - name: Show extensions
        run: |
          rm -rf ipa_check
          unzip -q input.ipa -d ipa_check

          echo "🧩 Extensões existentes no IPA:"

          EXTENSIONS=$(find ipa_check/Payload -type d -name "*.appex" -print)

          if [ -z "$EXTENSIONS" ]; then
            echo "Nenhuma extensão encontrada."
          else
            echo "$EXTENSIONS"
          fi

          rm -rf ipa_check

      - name: Inject addons with Cyan
        env:
          REMOVE_EXTENSIONS: ${{ inputs.remove_extensions }}
        run: |
          echo "💉 Preparando injeção..."

          mapfile -t ADDONS < selected_addons.txt

          CYAN_ARGS=(
            -i input.ipa
            -o Cyan_Output.ipa
            -u
            -w
            -f
          )

          for addon in "${ADDONS[@]}"; do
            CYAN_ARGS+=("$addon")
          done

          if [ "$REMOVE_EXTENSIONS" = "true" ]; then
            echo "🗑️ Extensões serão removidas"
            CYAN_ARGS+=("-e")
          else
            echo "🧩 Extensões serão preservadas"
          fi

          CYAN_ARGS+=("--overwrite")

          cyan "${CYAN_ARGS[@]}"

          if [ ! -f "Cyan_Output.ipa" ]; then
            echo "❌ Cyan não gerou o IPA"
            exit 1
          fi

          echo "✅ Injeção concluída"

      - name: Apply IPA Patch to plugins only
        if: ${{ inputs.apply_ipapatch }}
        run: |
          echo "🩹 Aplicando IPA Patch somente aos plugins..."

          ./ipapatch \
            --input Cyan_Output.ipa \
            --output Final.ipa \
            --plugins-only \
            --noconfirm

          if [ ! -f "Final.ipa" ]; then
            echo "❌ IPA Patch não gerou o arquivo final"
            exit 1
          fi

          echo "✅ IPA Patch concluído"

      - name: Use Cyan output
        if: ${{ !inputs.apply_ipapatch }}
        run: |
          mv Cyan_Output.ipa Final.ipa

      - name: Validate final IPA
        run: |
          echo "🔎 Validando IPA final..."

          if [ ! -f "Final.ipa" ]; then
            echo "❌ IPA final não encontrado"
            exit 1
          fi

          if ! unzip -tq Final.ipa > /dev/null; then
            echo "❌ IPA final inválido"
            exit 1
          fi

          echo "✅ IPA final válido"
          ls -lh Final.ipa

          echo ""
          echo "📱 ${{ steps.app.outputs.app_name }}"
          echo "🔢 ${{ steps.app.outputs.version }}"
          echo "📦 ${{ steps.app.outputs.bundle_id }}"

      - name: Upload final IPA
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.app.outputs.app_name }}-${{ steps.app.outputs.version }}-Injected
          path: Final.ipa
          retention-days: 1
