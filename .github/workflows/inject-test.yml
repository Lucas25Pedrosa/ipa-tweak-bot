name: Inject Glow + IPA Patch Test

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o IPA descriptografado do Facebook"
        required: true
        type: string

      apply_ipapatch:
        description: "Aplicar IPA Patch somente nas extensões"
        required: true
        default: false
        type: boolean

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils tar zip unzip curl

      - name: Install Cyan
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Install IPA Patch
        if: ${{ inputs.apply_ipapatch }}
        run: |
          echo "📥 Baixando IPA Patch..."

          curl \
            --location \
            --fail \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch

          echo "✅ IPA Patch instalado"
          ./ipapatch --version

      - name: Check Glow package
        run: |
          ADDON="addons/deb/com.dvntm.glow_1.3.1_iphoneos-arm.deb"

          if [ ! -f "$ADDON" ]; then
            echo "❌ Glow .deb não encontrado"
            exit 1
          fi

          echo "✅ Glow encontrado"
          ls -lh "$ADDON"

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "📥 Baixando IPA..."

          curl \
            --location \
            --fail \
            --retry 3 \
            --output input.ipa \
            "$IPA_URL"

          echo "✅ Download concluído"
          ls -lh input.ipa

      - name: Validate IPA
        run: |
          echo "🔎 Verificando IPA..."

          if ! unzip -tq input.ipa > /dev/null; then
            echo "❌ O arquivo baixado não é um ZIP/IPA válido"
            exit 1
          fi

          unzip -q input.ipa -d ipa_check

          APP_COUNT=$(find ipa_check/Payload -maxdepth 1 -type d -name "*.app" 2>/dev/null | wc -l)

          if [ "$APP_COUNT" -eq 0 ]; then
            echo "❌ Nenhum aplicativo .app encontrado dentro de Payload"
            exit 1
          fi

          echo "✅ Estrutura do IPA válida"

          echo "📦 Extensões encontradas:"
          find ipa_check/Payload -type d -name "*.appex" -print || true

          rm -rf ipa_check

      # SEM IPA PATCH:
      # Mantemos exatamente a lógica que já funcionou no Facebook.
      - name: Inject Glow without extensions
        if: ${{ !inputs.apply_ipapatch }}
        run: |
          echo "💉 Injetando Glow..."
          echo "🗑️ Removendo extensões..."

          cyan \
            -i input.ipa \
            -o Final.ipa \
            -u \
            -w \
            -e \
            -f "addons/deb/com.dvntm.glow_1.3.1_iphoneos-arm.deb" \
            --overwrite

      # COM IPA PATCH:
      # NÃO usamos -e, pois precisamos preservar os .appex.
      - name: Inject Glow preserving extensions
        if: ${{ inputs.apply_ipapatch }}
        run: |
          echo "💉 Injetando Glow..."
          echo "🧩 Preservando extensões para IPA Patch..."

          cyan \
            -i input.ipa \
            -o Facebook_Glow_With_Extensions.ipa \
            -u \
            -w \
            -f "addons/deb/com.dvntm.glow_1.3.1_iphoneos-arm.deb" \
            --overwrite

      - name: Apply IPA Patch to plugins only
        if: ${{ inputs.apply_ipapatch }}
        run: |
          echo "🩹 Aplicando IPA Patch SOMENTE aos plugins..."

          ./ipapatch \
            --input Facebook_Glow_With_Extensions.ipa \
            --output Final.ipa \
            --plugins-only \
            --noconfirm

          echo "✅ IPA Patch aplicado somente às extensões"

      - name: Validate final IPA
        run: |
          if [ ! -f "Final.ipa" ]; then
            echo "❌ IPA final não encontrado"
            exit 1
          fi

          if ! unzip -tq Final.ipa > /dev/null; then
            echo "❌ IPA final inválido"
            exit 1
          fi

          echo "✅ IPA final criado com sucesso"
          ls -lh Final.ipa

      - name: Upload modified IPA
        uses: actions/upload-artifact@v6
        with:
          name: Facebook-Glow-Final
          path: Final.ipa
          retention-days: 1
