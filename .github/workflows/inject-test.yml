name: Generic IPA Injector

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o IPA descriptografado"
        required: true
        type: string

      addon:
        description: "Nome do addon. Ex: Glow, Regram, RXTikTok"
        required: true
        type: string

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils tar zip unzip curl

      - name: Install Cyan
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          cyan --version

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "📥 Baixando IPA..."

          curl \
            --location \
            --fail \
            --retry 3 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq input.ipa > /dev/null

          echo "✅ IPA baixado e validado"
          ls -lh input.ipa

      - name: Detect app and prepare addon
        id: prepare
        env:
          REQUESTED_ADDON: ${{ inputs.addon }}
        run: |
          python <<'PY'
          import json
          import os
          import plistlib
          import zipfile
          import sys
          from pathlib import Path

          ipa = "input.ipa"

          with zipfile.ZipFile(ipa, "r") as z:
              plist_files = [
                  x for x in z.namelist()
                  if x.startswith("Payload/")
                  and x.count("/") == 2
                  and x.endswith(".app/Info.plist")
              ]

              if not plist_files:
                  print("❌ Info.plist principal não encontrado")
                  sys.exit(1)

              plist_path = plist_files[0]

              with z.open(plist_path) as f:
                  plist = plistlib.load(f)

          bundle_id = plist.get("CFBundleIdentifier")
          app_name = (
              plist.get("CFBundleDisplayName")
              or plist.get("CFBundleName")
              or "Unknown"
          )
          version = plist.get("CFBundleShortVersionString", "Unknown")

          with open("config/addons.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          apps = config.get("apps", {})

          if bundle_id not in apps:
              print(f"❌ App não cadastrado: {bundle_id}")
              sys.exit(1)

          app_config = apps[bundle_id]

          requested = os.environ["REQUESTED_ADDON"].strip()

          addon = next(
              (
                  a for a in app_config.get("addons", [])
                  if a.get("name", "").lower() == requested.lower()
              ),
              None
          )

          if not addon:
              print(f"❌ Addon não encontrado: {requested}")
              print("Disponíveis:")
              for a in app_config.get("addons", []):
                  print(" -", a.get("name"))
              sys.exit(1)

          files = addon.get("files", [])

          for item in files:
              path = item.get("path")
              if not Path(path).exists():
                  print(f"❌ Arquivo não encontrado: {path}")
                  sys.exit(1)

          with open("selected_addon.json", "w", encoding="utf-8") as f:
              json.dump(addon, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"app_name={app_name}\n")
              out.write(f"version={version}\n")
              out.write(f"ipapatch={str(addon.get('ipapatch', False)).lower()}\n")
              out.write(
                  f"remove_extensions={str(addon.get('remove_extensions', False)).lower()}\n"
              )

          print()
          print(f"📱 App: {app_name}")
          print(f"📦 Bundle ID: {bundle_id}")
          print(f"🔢 Versão: {version}")
          print(f"🧩 Addon: {addon.get('name')}")
          print(f"🩹 IPA Patch: {addon.get('ipapatch', False)}")
          PY

      - name: Install IPA Patch
        if: ${{ steps.prepare.outputs.ipapatch == 'true' }}
        run: |
          echo "📥 Instalando IPA Patch..."

          curl \
            --location \
            --fail \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch
          ./ipapatch --version

      - name: Prepare package files
        run: |
          python <<'PY'
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          with open("selected_addon.json", "r", encoding="utf-8") as f:
              addon = json.load(f)

          Path("prepared/inject").mkdir(parents=True, exist_ok=True)
          Path("prepared/bundles").mkdir(parents=True, exist_ok=True)
          Path("prepared/appex").mkdir(parents=True, exist_ok=True)

          inject_files = []

          for item in addon.get("files", []):
              path = Path(item["path"])
              action = item["action"]

              if action == "inject":
                  inject_files.append(str(path))

              elif action == "bundle":
                  target = Path("prepared/bundles")

                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(target)

              elif action == "appex":
                  target = Path("prepared/appex")

                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(target)

          with open("inject_files.txt", "w", encoding="utf-8") as f:
              for path in inject_files:
                  f.write(path + "\n")

          print("✅ Componentes preparados")
          PY

      - name: Inject dylibs and debs with Cyan
        run: |
          mapfile -t INJECT_FILES < inject_files.txt

          CYAN_ARGS=(
            -i input.ipa
            -o Cyan_Output.ipa
            -u
            -w
          )

          if [ "${#INJECT_FILES[@]}" -gt 0 ]; then
            CYAN_ARGS+=("-f")

            for file in "${INJECT_FILES[@]}"; do
              CYAN_ARGS+=("$file")
            done
          fi

          if [ "${{ steps.prepare.outputs.remove_extensions }}" = "true" ]; then
            CYAN_ARGS+=("-e")
          fi

          CYAN_ARGS+=("--overwrite")

          cyan "${CYAN_ARGS[@]}"

          echo "✅ Cyan concluído"

      - name: Add bundles and extensions
        run: |
          python <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          source = "Cyan_Output.ipa"
          temp = Path("ipa_work")

          if temp.exists():
              shutil.rmtree(temp)

          temp.mkdir()

          with zipfile.ZipFile(source, "r") as z:
              z.extractall(temp)

          apps = list((temp / "Payload").glob("*.app"))

          if not apps:
              raise SystemExit("❌ .app principal não encontrado")

          app = apps[0]

          bundles_dir = Path("prepared/bundles")
          if bundles_dir.exists():
              for item in bundles_dir.iterdir():
                  destination = app / item.name

                  if destination.exists():
                      if destination.is_dir():
                          shutil.rmtree(destination)
                      else:
                          destination.unlink()

                  if item.is_dir():
                      shutil.copytree(item, destination)
                  else:
                      shutil.copy2(item, destination)

          appex_dir = Path("prepared/appex")
          if appex_dir.exists():
              plugins = app / "PlugIns"
              plugins.mkdir(exist_ok=True)

              for item in appex_dir.iterdir():
                  destination = plugins / item.name

                  if destination.exists():
                      if destination.is_dir():
                          shutil.rmtree(destination)
                      else:
                          destination.unlink()

                  if item.is_dir():
                      shutil.copytree(item, destination)
                  else:
                      shutil.copy2(item, destination)

          with zipfile.ZipFile(
              "Package_Output.ipa",
              "w",
              zipfile.ZIP_DEFLATED
          ) as z:
              for file in temp.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(temp))

          print("✅ Bundles e extensões adicionados")
          PY

      - name: Apply Info.plist changes
        run: |
          python <<'PY'
          import json
          import plistlib
          import shutil
          import zipfile
          from pathlib import Path

          with open("selected_addon.json", "r", encoding="utf-8") as f:
              addon = json.load(f)

          changes = addon.get("plist", {})

          if not changes:
              shutil.copy2("Package_Output.ipa", "Plist_Output.ipa")
              print("ℹ️ Nenhuma alteração de Info.plist")
              raise SystemExit(0)

          temp = Path("plist_work")

          if temp.exists():
              shutil.rmtree(temp)

          temp.mkdir()

          with zipfile.ZipFile("Package_Output.ipa", "r") as z:
              z.extractall(temp)

          apps = list((temp / "Payload").glob("*.app"))
          app = apps[0]

          plist_path = app / "Info.plist"

          with open(plist_path, "rb") as f:
              plist = plistlib.load(f)

          for key, value in changes.items():
              plist[key] = value
              print(f"✅ {key} = {value}")

          with open(plist_path, "wb") as f:
              plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)

          with zipfile.ZipFile(
              "Plist_Output.ipa",
              "w",
              zipfile.ZIP_DEFLATED
          ) as z:
              for file in temp.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(temp))
          PY

      - name: Apply IPA Patch to plugins only
        if: ${{ steps.prepare.outputs.ipapatch == 'true' }}
        run: |
          echo "🩹 Aplicando IPA Patch somente aos plugins..."

          ./ipapatch \
            --input Plist_Output.ipa \
            --output Final.ipa \
            --plugins-only \
            --noconfirm

          echo "✅ IPA Patch aplicado"

      - name: Use output without IPA Patch
        if: ${{ steps.prepare.outputs.ipapatch != 'true' }}
        run: |
          mv Plist_Output.ipa Final.ipa

      - name: Validate final IPA
        run: |
          if [ ! -f Final.ipa ]; then
            echo "❌ Final.ipa não encontrado"
            exit 1
          fi

          unzip -tq Final.ipa > /dev/null

          echo "✅ IPA final válido"
          echo ""
          echo "📱 ${{ steps.prepare.outputs.app_name }}"
          echo "🔢 ${{ steps.prepare.outputs.version }}"
          echo "📦 ${{ steps.prepare.outputs.bundle_id }}"
          echo "🧩 ${{ inputs.addon }}"

          ls -lh Final.ipa

      - name: Upload final IPA
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prepare.outputs.app_name }}-${{ steps.prepare.outputs.version }}-${{ inputs.addon }}
          path: Final.ipa
          retention-days: 1
