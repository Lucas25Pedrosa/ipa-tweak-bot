name: Generic IPA Injector

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o IPA descriptografado"
        required: true
        type: string

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils tar zip unzip curl

      - name: Install Cyan
        run: |
          python -m pip install --upgrade pip

          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          echo "✅ Cyan instalado"
          cyan --version

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "📥 Baixando IPA..."

          curl \
            --location \
            --fail \
            --retry 3 \
            --output input.ipa \
            "$IPA_URL"

          if ! unzip -tq input.ipa > /dev/null; then
            echo "❌ Arquivo baixado não é um IPA/ZIP válido"
            exit 1
          fi

          echo "✅ IPA baixado e validado"
          ls -lh input.ipa

      - name: Detect app and select addon automatically
        id: prepare
        run: |
          python <<'PY'
          import json
          import os
          import plistlib
          import zipfile
          import sys
          from pathlib import Path

          ipa = "input.ipa"

          with zipfile.ZipFile(ipa, "r") as z:
              plist_files = [
                  x for x in z.namelist()
                  if x.startswith("Payload/")
                  and x.count("/") == 2
                  and x.endswith(".app/Info.plist")
              ]

              if not plist_files:
                  print("❌ Info.plist principal não encontrado")
                  sys.exit(1)

              plist_path = plist_files[0]

              with z.open(plist_path) as f:
                  plist = plistlib.load(f)

          bundle_id = plist.get("CFBundleIdentifier")

          app_name = (
              plist.get("CFBundleDisplayName")
              or plist.get("CFBundleName")
              or "Unknown"
          )

          version = plist.get(
              "CFBundleShortVersionString",
              "Unknown"
          )

          if not bundle_id:
              print("❌ Bundle ID não encontrado")
              sys.exit(1)

          with open(
              "config/addons.json",
              "r",
              encoding="utf-8"
          ) as f:
              config = json.load(f)

          apps = config.get("apps", {})

          if bundle_id not in apps:
              print()
              print("❌ App não cadastrado")
              print(f"Bundle ID detectado: {bundle_id}")
              print()
              print("Apps cadastrados:")

              for registered_bundle, data in apps.items():
                  print(
                      f" - {data.get('name', 'Unknown')}"
                      f" ({registered_bundle})"
                  )

              sys.exit(1)

          app_config = apps[bundle_id]
          addons = app_config.get("addons", [])

          if not addons:
              print(
                  f"❌ Nenhum addon cadastrado para "
                  f"{app_config.get('name')}"
              )
              sys.exit(1)

          default_name = app_config.get("default_addon")

          addon = None

          if default_name:
              addon = next(
                  (
                      item
                      for item in addons
                      if item.get("name", "").lower()
                      == default_name.lower()
                  ),
                  None
              )

              if addon is None:
                  print(
                      f"❌ default_addon '{default_name}' "
                      f"não foi encontrado"
                  )
                  sys.exit(1)

          elif len(addons) == 1:
              addon = addons[0]

          else:
              print()
              print(
                  "❌ Existem vários addons para este app "
                  "e nenhum default_addon foi definido."
              )
              print()

              for item in addons:
                  print(f" - {item.get('name')}")

              sys.exit(1)

          for item in addon.get("files", []):
              path = item.get("path")

              if not path:
                  print("❌ Componente sem path definido")
                  sys.exit(1)

              if not Path(path).exists():
                  print(f"❌ Arquivo não encontrado: {path}")
                  sys.exit(1)

          with open(
              "selected_addon.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  addon,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"app_name={app_name}\n")
              out.write(f"version={version}\n")
              out.write(
                  f"addon_name={addon.get('name', 'Unknown')}\n"
              )
              out.write(
                  f"ipapatch="
                  f"{str(addon.get('ipapatch', False)).lower()}\n"
              )
              out.write(
                  f"remove_extensions="
                  f"{str(addon.get('remove_extensions', False)).lower()}\n"
              )

          print()
          print("✅ Aplicativo identificado")
          print(f"📱 App: {app_name}")
          print(f"📦 Bundle ID: {bundle_id}")
          print(f"🔢 Versão: {version}")
          print(f"🧩 Addon: {addon.get('name')}")
          print(
              f"🩹 IPA Patch: "
              f"{addon.get('ipapatch', False)}"
          )
          print(
              f"🧹 Remover extensões: "
              f"{addon.get('remove_extensions', False)}"
          )
          PY

      - name: Install IPA Patch
        if: ${{ steps.prepare.outputs.ipapatch == 'true' }}
        run: |
          echo "📥 Instalando IPA Patch..."

          curl \
            --location \
            --fail \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch

          echo "✅ IPA Patch instalado"
          ./ipapatch --version

      - name: Prepare addon files
        run: |
          python <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path

          with open(
              "selected_addon.json",
              "r",
              encoding="utf-8"
          ) as f:
              addon = json.load(f)

          prepared = Path("prepared")

          if prepared.exists():
              shutil.rmtree(prepared)

          inject_dir = prepared / "inject"
          bundles_dir = prepared / "bundles"
          appex_dir = prepared / "appex"

          inject_dir.mkdir(parents=True)
          bundles_dir.mkdir(parents=True)
          appex_dir.mkdir(parents=True)

          inject_files = []

          for item in addon.get("files", []):
              path = Path(item["path"])
              action = item.get("action")

              print(
                  f"📦 Preparando {path.name} "
                  f"[{action}]"
              )

              if action == "inject":
                  inject_files.append(str(path))

              elif action == "bundle":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(bundles_dir)

              elif action == "appex":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(appex_dir)

              else:
                  raise SystemExit(
                      f"❌ Ação desconhecida: {action}"
                  )

          with open(
              "inject_files.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for path in inject_files:
                  f.write(path + "\n")

          print()
          print(
              f"✅ {len(inject_files)} arquivo(s) "
              f"de injeção preparado(s)"
          )

          bundles = list(bundles_dir.iterdir())
          appex = list(appex_dir.iterdir())

          print(
              f"✅ {len(bundles)} bundle(s) preparado(s)"
          )
          print(
              f"✅ {len(appex)} extensão(ões) preparada(s)"
          )
          PY

      - name: Inject dylibs and debs with Cyan
        run: |
          echo "💉 Executando Cyan..."

          mapfile -t INJECT_FILES < inject_files.txt

          CYAN_ARGS=(
            -i input.ipa
            -o Cyan_Output.ipa
            -u
            -w
          )

          if [ "${#INJECT_FILES[@]}" -gt 0 ]; then
            CYAN_ARGS+=("-f")

            for file in "${INJECT_FILES[@]}"; do
              CYAN_ARGS+=("$file")
            done
          fi

          if [ "${{ steps.prepare.outputs.remove_extensions }}" = "true" ]; then
            echo "🧹 Extensões serão removidas"
            CYAN_ARGS+=("-e")
          else
            echo "🧩 Extensões serão preservadas"
          fi

          CYAN_ARGS+=("--overwrite")

          cyan "${CYAN_ARGS[@]}"

          if [ ! -f Cyan_Output.ipa ]; then
            echo "❌ Cyan não gerou o IPA"
            exit 1
          fi

          echo "✅ Cyan concluído"
          ls -lh Cyan_Output.ipa

      - name: Add bundles and extra extensions
        run: |
          python <<'PY'
          import shutil
          import zipfile
          from pathlib import Path

          source = Path("Cyan_Output.ipa")
          temp = Path("ipa_work")

          if temp.exists():
              shutil.rmtree(temp)

          temp.mkdir()

          with zipfile.ZipFile(source, "r") as z:
              z.extractall(temp)

          payload = temp / "Payload"

          apps = [
              item
              for item in payload.iterdir()
              if item.is_dir()
              and item.suffix == ".app"
          ]

          if not apps:
              raise SystemExit(
                  "❌ .app principal não encontrado"
              )

          app = apps[0]

          print(f"📱 App encontrado: {app.name}")

          bundles_dir = Path("prepared/bundles")

          if bundles_dir.exists():
              for item in bundles_dir.iterdir():
                  destination = app / item.name

                  print(
                      f"📦 Adicionando bundle: "
                      f"{item.name}"
                  )

                  if destination.exists():
                      if destination.is_dir():
                          shutil.rmtree(destination)
                      else:
                          destination.unlink()

                  if item.is_dir():
                      shutil.copytree(
                          item,
                          destination
                      )
                  else:
                      shutil.copy2(
                          item,
                          destination
                      )

          appex_dir = Path("prepared/appex")

          if appex_dir.exists():
              plugins = app / "PlugIns"
              plugins.mkdir(exist_ok=True)

              for item in appex_dir.iterdir():
                  destination = plugins / item.name

                  print(
                      f"🧩 Adicionando extensão: "
                      f"{item.name}"
                  )

                  if destination.exists():
                      if destination.is_dir():
                          shutil.rmtree(destination)
                      else:
                          destination.unlink()

                  if item.is_dir():
                      shutil.copytree(
                          item,
                          destination
                      )
                  else:
                      shutil.copy2(
                          item,
                          destination
                      )

          output = Path("Package_Output.ipa")

          if output.exists():
              output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as z:
              for file in temp.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(temp)
                      )

          print("✅ Bundles/extensões adicionados")
          PY

      - name: Apply Info.plist changes
        run: |
          python <<'PY'
          import json
          import plistlib
          import shutil
          import zipfile
          from pathlib import Path

          with open(
              "selected_addon.json",
              "r",
              encoding="utf-8"
          ) as f:
              addon = json.load(f)

          changes = addon.get("plist", {})

          if not changes:
              shutil.copy2(
                  "Package_Output.ipa",
                  "Plist_Output.ipa"
              )

              print(
                  "ℹ️ Nenhuma alteração de Info.plist"
              )

              raise SystemExit(0)

          temp = Path("plist_work")

          if temp.exists():
              shutil.rmtree(temp)

          temp.mkdir()

          with zipfile.ZipFile(
              "Package_Output.ipa",
              "r"
          ) as z:
              z.extractall(temp)

          apps = list(
              (temp / "Payload").glob("*.app")
          )

          if not apps:
              raise SystemExit(
                  "❌ App não encontrado"
              )

          app = apps[0]
          plist_path = app / "Info.plist"

          with open(plist_path, "rb") as f:
              plist = plistlib.load(f)

          print("📝 Alterações no Info.plist:")

          for key, value in changes.items():
              old_value = plist.get(
                  key,
                  "<não existente>"
              )

              plist[key] = value

              print(
                  f" • {key}: "
                  f"{old_value} -> {value}"
              )

          with open(plist_path, "wb") as f:
              plistlib.dump(
                  plist,
                  f,
                  fmt=plistlib.FMT_BINARY
              )

          output = Path("Plist_Output.ipa")

          if output.exists():
              output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as z:
              for file in temp.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(temp)
                      )

          print("✅ Info.plist atualizado")
          PY

      - name: Apply IPA Patch to plugins only
        if: ${{ steps.prepare.outputs.ipapatch == 'true' }}
        run: |
          echo "🩹 Aplicando IPA Patch..."
          echo "Modo: plugins-only"

          ./ipapatch \
            --input Plist_Output.ipa \
            --output Final.ipa \
            --plugins-only \
            --noconfirm

          if [ ! -f Final.ipa ]; then
            echo "❌ IPA Patch não gerou Final.ipa"
            exit 1
          fi

          echo "✅ IPA Patch aplicado"

      - name: Use output without IPA Patch
        if: ${{ steps.prepare.outputs.ipapatch != 'true' }}
        run: |
          cp Plist_Output.ipa Final.ipa

          echo "ℹ️ IPA Patch não necessário"

      - name: Validate final IPA
        run: |
          echo "🔎 Validando IPA final..."

          if [ ! -f Final.ipa ]; then
            echo "❌ Final.ipa não encontrado"
            exit 1
          fi

          if ! unzip -tq Final.ipa > /dev/null; then
            echo "❌ Final.ipa inválido"
            exit 1
          fi

          echo ""
          echo "✅ IPA FINAL CRIADO"
          echo ""
          echo "📱 App:"
          echo "${{ steps.prepare.outputs.app_name }}"
          echo ""
          echo "🔢 Versão:"
          echo "${{ steps.prepare.outputs.version }}"
          echo ""
          echo "📦 Bundle ID:"
          echo "${{ steps.prepare.outputs.bundle_id }}"
          echo ""
          echo "🧩 Addon:"
          echo "${{ steps.prepare.outputs.addon_name }}"
          echo ""
          echo "🩹 IPA Patch:"
          echo "${{ steps.prepare.outputs.ipapatch }}"
          echo ""

          ls -lh Final.ipa

      - name: Upload final IPA
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prepare.outputs.app_name }}-${{ steps.prepare.outputs.version }}-${{ steps.prepare.outputs.addon_name }}
          path: Final.ipa
          retention-days: 1
