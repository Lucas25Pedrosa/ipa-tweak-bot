name: Restore Messenger FBLP Workflow Again

on:
  push:
    paths:
      - '.restore-messenger-fblp-workflow-again-trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore Telegram Injector FBLP workflow
        run: |
          set -euo pipefail
          BASE=092d83f4349bcaed8177877f9df0180d0ee6757a
          git show "$BASE:.github/workflows/telegram-inject.yml" > .github/workflows/telegram-inject.yml

      - name: Verify restored workflow
        run: |
          set -euo pipefail
          grep -q 'telegram_messenger_translation.py' .github/workflows/telegram-inject.yml
          grep -q 'Download and prepare Messenger pt-BR translation' .github/workflows/telegram-inject.yml
          grep -q 'Embed Messenger pt-BR translation' .github/workflows/telegram-inject.yml
          grep -q 'Validate Messenger MSGPlusX + pt-BR layout' .github/workflows/telegram-inject.yml
          grep -q 'feather_package_transport.py' .github/workflows/telegram-inject.yml
          echo '✅ Workflow FBLP restaurado e validado'

      - name: Commit restoration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/telegram-inject.yml
          if git diff --cached --quiet; then
            echo 'Nada para restaurar.'
            exit 0
          fi
          git commit -m 'Restore Messenger FBLP workflow for 576 experiment'
          git push
