name: Build MessengerNameFixV2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/theos-sdks.zip
          unzip -q /tmp/theos-sdks.zip -d /tmp/theos-sdks
          cp -R /tmp/theos-sdks/sdks-master/*.sdk "$THEOS/sdks/"

      - name: Install ldid
        run: |
          set -euo pipefail
          brew update
          brew install ldid
          command -v ldid

      - name: Create temporary tweak source
        run: |
          set -euo pipefail
          mkdir -p messenger-name-fix

          cat > messenger-name-fix/Tweak.xm <<'EOF'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static const NSInteger kMSGPlusXWordmarkTag = 0x26B7;

          static UIImageView *MNFOriginalImageView(id object) {
              Ivar ivar = class_getInstanceVariable([object class], "_imageView");
              if (!ivar) return nil;

              id value = object_getIvar(object, ivar);
              if (value && [value isKindOfClass:[UIImageView class]]) {
                  return (UIImageView *)value;
              }

              return nil;
          }

          static void MNFHideArtificialWordmark(UIView *view) {
              if (!view) return;

              if ([view isKindOfClass:[UILabel class]]) {
                  UILabel *label = (UILabel *)view;

                  if (label.tag == kMSGPlusXWordmarkTag) {
                      label.hidden = YES;
                      label.alpha = 0.0;
                  }
              }

              for (UIView *subview in view.subviews) {
                  MNFHideArtificialWordmark(subview);
              }
          }

          %hook MSGMessengerWordmarkView

          - (void)layoutSubviews {
              %orig;

              UIImageView *imageView = MNFOriginalImageView(self);

              if (imageView) {
                  imageView.hidden = NO;
                  imageView.alpha = 1.0;
              }

              MNFHideArtificialWordmark((UIView *)self);
          }

          %end
          EOF

          cat > messenger-name-fix/Makefile <<'EOF'
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = Messenger

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = MessengerNameFixV2
          MessengerNameFixV2_FILES = Tweak.xm
          MessengerNameFixV2_CFLAGS = -fobjc-arc
          MessengerNameFixV2_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Build MessengerNameFixV2
        working-directory: messenger-name-fix
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1

          DYLIB="$(find .theos -type f -name 'MessengerNameFixV2.dylib' | head -n 1)"

          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "❌ MessengerNameFixV2.dylib não encontrado"
            exit 1
          fi

          mkdir -p ../output
          cp "$DYLIB" ../output/MessengerNameFixV2.dylib
          file ../output/MessengerNameFixV2.dylib

      - name: Upload MessengerNameFixV2 dylib
        uses: actions/upload-artifact@v4
        with:
          name: MessengerNameFixV2-dylib
          path: output/MessengerNameFixV2.dylib
          if-no-files-found: error
          retention-days: 30
