name: Build MessengerNameFix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o /tmp/theos-sdks.zip

          unzip -q /tmp/theos-sdks.zip \
            -d /tmp/theos-sdks

          cp -R \
            /tmp/theos-sdks/sdks-master/*.sdk \
            "$THEOS/sdks/"

      - name: Create temporary tweak source
        run: |
          set -euo pipefail

          mkdir -p messenger-name-fix

          cat > messenger-name-fix/Tweak.xm <<'EOF'
          #import <UIKit/UIKit.h>

          static const NSInteger kMSGPlusXWordmarkTag = 0x26B7;

          static void MNFApplyMessengerName(UIView *view) {
              if (!view) return;

              if ([view isKindOfClass:[UILabel class]]) {
                  UILabel *label = (UILabel *)view;
                  NSString *text = label.text ?: @"";
                  NSString *lower = text.lowercaseString;

                  BOOL isTarget =
                      label.tag == kMSGPlusXWordmarkTag ||
                      [lower isEqualToString:@"msg"] ||
                      [lower isEqualToString:@"msgplusx"] ||
                      [lower isEqualToString:@"msgplus"];

                  if (isTarget) {
                      label.text = @"messenger";
                      label.hidden = NO;
                      label.alpha = 1.0;
                  }
              }

              for (UIView *subview in view.subviews) {
                  MNFApplyMessengerName(subview);
              }
          }

          %hook MSGMessengerWordmarkView

          - (void)layoutSubviews {
              %orig;
              MNFApplyMessengerName((UIView *)self);
          }

          %end
          EOF

          cat > messenger-name-fix/Makefile <<'EOF'
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:15.0
          INSTALL_TARGET_PROCESSES = Messenger

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = MessengerNameFix
          MessengerNameFix_FILES = Tweak.xm
          MessengerNameFix_CFLAGS = -fobjc-arc
          MessengerNameFix_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          echo "✅ Fonte temporária criada"

      - name: Build MessengerNameFix
        working-directory: messenger-name-fix
        run: |
          set -euo pipefail

          make clean
          make FINALPACKAGE=1

          DYLIB="$(
            find .theos \
              -type f \
              -name 'MessengerNameFix.dylib' \
              | head -n 1
          )"

          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "❌ MessengerNameFix.dylib não encontrado"
            exit 1
          fi

          mkdir -p ../output
          cp "$DYLIB" \
            ../output/MessengerNameFix.dylib

          echo "✅ MessengerNameFix.dylib compilado"
          file ../output/MessengerNameFix.dylib
          ls -lh ../output/MessengerNameFix.dylib

      - name: Upload MessengerNameFix dylib
        uses: actions/upload-artifact@v4
        with:
          name: MessengerNameFix-dylib
          path: output/MessengerNameFix.dylib
          if-no-files-found: error
          retention-days: 30
