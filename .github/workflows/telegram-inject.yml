      - name: Validate Messenger MSGPlusX native locale layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.facebook.Messenger' }}
        env:
          APP_VERSION: ${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}
          APP_BUILD: ${{ steps.prepare.outputs.build }}
        run: |
          python <<'PY'
          import hashlib
          import json
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("messenger_validate")

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          with zipfile.ZipFile(
              "Final.ipa",
              "r",
          ) as z:
              z.extractall(work)

          apps = list(
              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  "❌ Messenger principal não identificado"
              )

          app = apps[0]

          with (
              app / "Info.plist"
          ).open("rb") as f:
              info = plistlib.load(f)

          if (
              info.get("CFBundleIdentifier")
              != "com.facebook.Messenger"
          ):
              raise SystemExit(
                  "❌ Bundle ID final do Messenger inesperado"
              )

          version = str(
              info.get(
                  "CFBundleShortVersionString",
                  "",
              )
          )
          build = str(
              info.get(
                  "CFBundleVersion",
                  "",
              )
          )

          if version != str(
              __import__("os").environ["APP_VERSION"]
          ):
              raise SystemExit(
                  "❌ Versão final do Messenger diverge do IPA de entrada"
              )

          if build != str(
              __import__("os").environ["APP_BUILD"]
          ):
              raise SystemExit(
                  "❌ Build final do Messenger diverge do IPA de entrada"
              )

          forbidden_keys = [
              "UIFileSharingEnabled",
              "LSSupportsOpeningDocumentsInPlace",
          ]

          for key in forbidden_keys:
              if key in info:
                  raise SystemExit(
                      f"❌ Chave de File Sharing ainda presente: {key}"
                  )

          executable_name = info.get(
              "CFBundleExecutable"
          )

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do Messenger ausente"
              )

          main = (
              app
              / executable_name
          )

          if not main.is_file():
              raise SystemExit(
                  "❌ Executável principal do Messenger ausente"
              )

          frameworks = (
              app
              / "Frameworks"
          )

          required_dylibs = [
              "Sideload Keychain Fix.dylib",
              "MSGPlusX.dylib",
              "MessengerEnhancements.dylib",
          ]

          for name in required_dylibs:
              path = (
                  frameworks
                  / name
              )

              if not path.is_file():
                  raise SystemExit(
                      f"❌ Dylib ausente: Frameworks/{name}"
                  )

          substrate = (
              frameworks
              / "CydiaSubstrate.framework"
              / "CydiaSubstrate"
          )

          if not substrate.is_file():
              raise SystemExit(
                  "❌ CydiaSubstrate.framework ausente"
              )

          def otool_dependencies(
              executable_path: Path,
          ) -> list[str]:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-L",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              dependencies = []

              for raw_line in proc.stdout.splitlines():
                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.endswith(":"):
                      continue

                  if line.startswith(
                      "(architecture "
                  ):
                      continue

                  marker = " (compatibility version "

                  if marker in line:
                      dependency = line.split(
                          marker,
                          1,
                      )[0]
                  else:
                      dependency = line

                  dependency = dependency.strip()

                  if dependency.startswith(
                      (
                          "/Library/",
                          "/usr/lib/",
                          "@",
                      )
                  ):
                      dependencies.append(
                          dependency
                      )

              return dependencies

          dependencies = otool_dependencies(
              main
          )

          required_dependencies = {
              (
                  "@executable_path/Frameworks/"
                  "Sideload Keychain Fix.dylib"
              ),
              (
                  "@executable_path/Frameworks/"
                  "MSGPlusX.dylib"
              ),
              (
                  "@executable_path/Frameworks/"
                  "MessengerEnhancements.dylib"
              ),
          }

          missing_dependencies = sorted(
              required_dependencies
              - set(dependencies)
          )

          if missing_dependencies:
              raise SystemExit(
                  "❌ Dependência principal ausente: "
                  + ", ".join(
                      missing_dependencies
                  )
              )

          forbidden_dependencies = {
              "@rpath/Sideload Keychain Fix.dylib",
              "@rpath/MSGPlusX.dylib",
              "@rpath/MessengerEnhancements.dylib",
          }

          remaining_rpath = sorted(
              forbidden_dependencies
              & set(dependencies)
          )

          if remaining_rpath:
              raise SystemExit(
                  "❌ Caminho @rpath antigo ainda presente: "
                  + ", ".join(
                      remaining_rpath
                  )
              )

          # As extensões devem receber somente o shim do IPA Patch.
          # MSGPlusX, Keychain Fix e MessengerEnhancements continuam
          # exclusivos do executável principal.
          forbidden_extension_tokens = (
              "Sideload Keychain Fix.dylib",
              "MSGPlusX.dylib",
              "MessengerEnhancements.dylib",
          )
          required_extension_dependency = (
              "@rpath/zxPluginsInject.dylib"
          )

          extensions = []

          for directory_name in (
              "PlugIns",
              "Extensions",
          ):
              directory = (
                  app
                  / directory_name
              )

              if directory.is_dir():
                  extensions.extend(
                      sorted(
                          directory.glob(
                              "*.appex"
                          )
                      )
                  )

          for extension in extensions:
              plist_path = (
                  extension
                  / "Info.plist"
              )

              if not plist_path.is_file():
                  continue

              with plist_path.open(
                  "rb"
              ) as f:
                  extension_info = (
                      plistlib.load(f)
                  )

              extension_executable_name = (
                  extension_info.get(
                      "CFBundleExecutable"
                  )
              )

              if not extension_executable_name:
                  continue

              extension_executable = (
                  extension
                  / extension_executable_name
              )

              if not extension_executable.is_file():
                  continue

              extension_dependencies = (
                  otool_dependencies(
                      extension_executable
                  )
              )

              bad = [
                  dependency
                  for dependency
                  in extension_dependencies
                  if any(
                      token in dependency
                      for token
                      in forbidden_extension_tokens
                  )
              ]

              if bad:
                  raise SystemExit(
                      "❌ Tweak principal do Messenger injetado "
                      "indevidamente em "
                      f"{extension.name}: {bad}"
                  )

              if (
                  required_extension_dependency
                  not in extension_dependencies
              ):
                  raise SystemExit(
                      "❌ zxPluginsInject ausente em "
                      f"{extension.name}"
                  )

          zx_path = (
              frameworks
              / "zxPluginsInject.dylib"
          )

          if not zx_path.is_file():
              raise SystemExit(
                  "❌ Frameworks/zxPluginsInject.dylib ausente"
              )

          if (
              "@rpath/zxPluginsInject.dylib"
              not in dependencies
          ):
              raise SystemExit(
                  "❌ zxPluginsInject ausente do executável principal"
              )

          if (
              info.get("UIDesignRequiresCompatibility")
              is not False
          ):
              raise SystemExit(
                  "❌ UIDesignRequiresCompatibility não está false"
              )

          print(
              "✅ Layout MSGPlusX do Messenger validado"
          )
          print(
              "✅ zxPluginsInject validado no app principal"
          )
          print(
              f"✅ zxPluginsInject validado em {len(extensions)} extensão(ões)"
          )
          print(
              "✅ UIDesignRequiresCompatibility = false"
          )
          print(
              "✅ Sem tradução FBLP customizada no fluxo"
          )
          print(
              "✅ File Sharing removido"
          )
          print(
              f"✅ {len(extensions)} extensão(ões) sem MSGPlusX/Keychain/"
              "MessengerEnhancements"
          )
          PY

      - name: Validate WhatsApp Watusi Fouad layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'net.whatsapp.WhatsApp' }}
