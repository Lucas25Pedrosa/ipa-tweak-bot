              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  "❌ WhatsApp principal não identificado"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              plist = plistlib.load(f)

          if plist.get("CFBundleIdentifier") != "net.whatsapp.WhatsApp":
              raise SystemExit(
                  "❌ Bundle ID do WhatsApp inesperado"
              )

          executable_name = plist.get("CFBundleExecutable")

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do WhatsApp ausente"
              )

          executable_path = app / executable_name
          dependencies = Executable(
              str(executable_path)
          ).get_dependencies()

          required_main = {
              "@executable_path/Watusi.dylib",
              "@executable_path/libWatusiToolsSL.dylib",
          }

          missing_main = sorted(
              required_main - set(dependencies)
          )

          if missing_main:
              raise SystemExit(
                  "❌ Dependência principal ausente: "
                  + ", ".join(missing_main)
              )

          forbidden_main = {
              "@rpath/Watusi.dylib",
              "@rpath/libWatusiToolsSL.dylib",
              "@executable_path/ContactSync.dylib",
              "@executable_path/OnlineNotify.dylib",
              "@executable_path/Stalky.dylib",
              "@rpath/ContactSync.dylib",
              "@rpath/OnlineNotify.dylib",
              "@rpath/Stalky.dylib",
              "@rpath/zxPluginsInject.dylib",
          }

          unexpected = sorted(
              forbidden_main & set(dependencies)
          )

          if unexpected:
              raise SystemExit(
                  "❌ Dependência inesperada no WhatsApp: "
                  + ", ".join(unexpected)
              )

          required_root = [
              "Watusi.dylib",
              "libWatusiToolsSL.dylib",
              "ContactSync.dylib",
              "OnlineNotify.dylib",
              "Stalky.dylib",
              "Watusi.bundle",
              "WatusiTools.bundle",
              "ContactSync.bundle",
              "OnlineNotify.bundle",
              "Stalky.bundle",
          ]

          for name in required_root:
              if not (app / name).exists():
                  raise SystemExit(
                      f"❌ Componente Watusi ausente na raiz: {name}"
                  )

          vendor = (
              app
              / "Frameworks"
              / "WSVendor.framework"
              / "WSVendor"
          )

          if not vendor.is_file():
              raise SystemExit(
                  "❌ WSVendor.framework ausente"
              )

          migration = (
              app
              / "Extensions"
              / "AppMigrationExtension.appex"
          )

          if migration.exists():
              raise SystemExit(
                  "❌ AppMigrationExtension.appex deveria ter sido removida"
              )

          expected_plugins = {
              "BroadcastUploadExtension.appex",
              "Intents.appex",
              "NotificationExtension.appex",
              "ServiceExtension.appex",
              "ShareExtension.appex",
              "WidgetExtension.appex",
          }

          plugins = app / "PlugIns"
          actual_plugins = {
              item.name
              for item in plugins.glob("*.appex")
          }

          if actual_plugins != expected_plugins:
              raise SystemExit(
                  "❌ Conjunto de extensões do WhatsApp mudou. "
                  f"Esperado: {sorted(expected_plugins)}; "
                  f"encontrado: {sorted(actual_plugins)}"
              )

          forbidden_plugin_tokens = (
              "Watusi.dylib",
              "libWatusiToolsSL.dylib",
              "ContactSync.dylib",
              "OnlineNotify.dylib",
              "Stalky.dylib",
              "zxPluginsInject.dylib",
          )

          for extension in sorted(plugins.glob("*.appex")):
              plist_path = extension / "Info.plist"

              with plist_path.open("rb") as f:
                  extension_plist = plistlib.load(f)

              extension_executable_name = extension_plist.get(
                  "CFBundleExecutable"
              )

              if not extension_executable_name:
                  raise SystemExit(
                      f"❌ CFBundleExecutable ausente em {extension.name}"
                  )

              extension_executable = (
                  extension
                  / extension_executable_name
              )

              extension_dependencies = Executable(
                  str(extension_executable)
              ).get_dependencies()

              bad = [
                  dependency
                  for dependency in extension_dependencies
                  if any(
                      token in dependency
                      for token in forbidden_plugin_tokens
                  )
              ]

              if bad:
                  raise SystemExit(
                      "❌ Tweak injetado indevidamente em "
                      f"{extension.name}: {bad}"
                  )

          print(
              "✅ WhatsApp segue o layout Watusi/Fouad auditado"
          )
          print(
              "✅ 6 extensões originais preservadas sem Watusi/IPA Patch"
          )
          print(
              "✅ AppMigrationExtension.appex removida seletivamente"
          )
          PY

      - name: Validate Duolingo MAX layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.duolingo.DuolingoMobile' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("duolingo_validate")

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          with zipfile.ZipFile(
              "Final.ipa",
              "r",
          ) as z:
              z.extractall(work)

          apps = list(
              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  "❌ Duolingo principal não identificado"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              plist = plistlib.load(f)

          if (
              plist.get("CFBundleIdentifier")
              != "com.duolingo.DuolingoMobile"
          ):
              raise SystemExit(
                  "❌ Bundle ID final do Duolingo inesperado"
              )

          executable_name = plist.get(
              "CFBundleExecutable"
          )

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do Duolingo ausente"
              )

          main = app / executable_name

          if not main.is_file():
              raise SystemExit(
                  "❌ Executável principal do Duolingo ausente"
              )

          required_files = (
              app / "CachefixPatch.dylib",
              app / "Duolingo.dylib",
              app / "Frameworks" / "blatantsPatch.dylib",
              (
                  app
                  / "Frameworks"
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              ),
          )

          for required in required_files:
              if not required.is_file():
                  raise SystemExit(
                      "❌ Componente final do Duolingo ausente: "
                      f"{required.relative_to(app)}"
                  )

          def dependencies(executable_path: Path) -> list[str]:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-L",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              result = []

              for raw_line in proc.stdout.splitlines():
                  line = raw_line.strip()

                  if (
                      not line
                      or line.endswith(":")
                      or line.startswith("(architecture ")
                  ):
                      continue

                  marker = " (compatibility version "

                  if marker in line:
                      line = line.split(marker, 1)[0]

                  line = line.strip()

                  if line.startswith(
                      (
                          "/",
                          "@",
                      )
                  ):
                      result.append(line)

              return result

          def has_rpath(
              executable_path: Path,
              rpath: str,
          ) -> bool:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-l",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              return (
                  f"path {rpath} "
                  in proc.stdout
              )

          main_dependencies = dependencies(main)

          expected_main = [
              "@executable_path/CachefixPatch.dylib",
              "@executable_path/Duolingo.dylib",
              "@rpath/blatantsPatch.dylib",
          ]

          for dependency in expected_main:
              if dependency not in main_dependencies:
                  raise SystemExit(
                      "❌ Dependência principal do Duolingo ausente: "
                      f"{dependency}"
                  )

          positions = [
              main_dependencies.index(dependency)
              for dependency in expected_main
          ]

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Ordem dos dylibs do Duolingo diverge do IPA de referência"
              )

          forbidden_main = (
              "@rpath/CachefixPatch.dylib",
              "@rpath/Duolingo.dylib",
          )

          for dependency in forbidden_main:
              if dependency in main_dependencies:
                  raise SystemExit(
                      "❌ Load path antigo ainda presente no Duolingo: "
                      f"{dependency}"
                  )

          cachefix_dependencies = dependencies(
              app / "CachefixPatch.dylib"
          )

          substrate_dependency = (
              "@rpath/CydiaSubstrate.framework/"
              "CydiaSubstrate"
          )

          if (
              substrate_dependency
              not in cachefix_dependencies
          ):
              raise SystemExit(
                  "❌ CachefixPatch perdeu a dependência do CydiaSubstrate"
              )

          if not has_rpath(
              main,
              "@executable_path/Frameworks",
          ):
              raise SystemExit(
                  "❌ Executável principal sem @executable_path/Frameworks"
              )

          plugins = app / "PlugIns"
          extensions = sorted(
              path
              for path in plugins.glob("*.appex")
              if path.is_dir()
          )

          if not extensions:
              raise SystemExit(
                  "❌ Nenhuma extensão do Duolingo encontrada"
              )

          required_extension_dependency = (
              "@rpath/blatantsPatch.dylib"
          )
          required_extension_rpath = (
              "@executable_path/../../Frameworks"
          )

          for extension in extensions:
              plist_path = (
                  extension
                  / "Info.plist"
              )

              if not plist_path.is_file():
                  raise SystemExit(
                      f"❌ Info.plist ausente em {extension.name}"
                  )

              with plist_path.open("rb") as f:
                  extension_info = plistlib.load(f)

              extension_executable_name = (
                  extension_info.get(
                      "CFBundleExecutable"
                  )
              )

              if not extension_executable_name:
                  raise SystemExit(
                      "❌ CFBundleExecutable ausente em "
                      f"{extension.name}"
                  )

              extension_executable = (
                  extension
                  / extension_executable_name
              )

              if not extension_executable.is_file():
                  raise SystemExit(
                      "❌ Executável ausente em "
                      f"{extension.name}"
                  )

              extension_dependencies = dependencies(
                  extension_executable
              )

              if (
                  required_extension_dependency
                  not in extension_dependencies
              ):
                  raise SystemExit(
                      "❌ blatantsPatch ausente em "
                      f"{extension.name}"
                  )

              if not has_rpath(
                  extension_executable,
                  required_extension_rpath,
              ):
                  raise SystemExit(
                      "❌ RPATH compartilhado ausente em "
                      f"{extension.name}"
                  )

          print(
              "✅ Duolingo.dylib e CachefixPatch.dylib na raiz"
          )
          print(
              "✅ Load commands principais normalizados"
          )
          print(
              "✅ Ordem CachefixPatch -> Duolingo -> blatantsPatch validada"
          )
          print(
              "✅ CydiaSubstrate.framework validado"
          )
          print(
              f"✅ blatantsPatch validado em {len(extensions)} extensão(ões)"
          )
          PY

