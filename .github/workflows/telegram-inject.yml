      - name: Validate Media Converter Pro layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.verycoolapp.mediaconvert' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("mediaconverter_validate")

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          with zipfile.ZipFile(
              "Final.ipa",
              "r",
          ) as z:
              z.extractall(work)

          apps = list(
              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  "❌ Media Converter principal não identificado"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              plist = plistlib.load(f)

          if (
              plist.get("CFBundleIdentifier")
              != "com.verycoolapp.mediaconvert"
          ):
              raise SystemExit(
                  "❌ Bundle ID final do Media Converter inesperado"
              )

          executable_name = plist.get(
              "CFBundleExecutable"
          )

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do Media Converter ausente"
              )

          main = app / executable_name

          if not main.is_file():
              raise SystemExit(
                  "❌ Executável principal do Media Converter ausente"
              )

          required_files = (
              app / "Frameworks" / "MediaConverter.dylib",
              app / "Frameworks" / "blatantsPatch.dylib",
          )

          for required in required_files:
              if not required.is_file():
                  raise SystemExit(
                      "❌ Componente final do Media Converter ausente: "
                      f"{required.relative_to(app)}"
                  )

          def dependencies(executable_path: Path) -> list[str]:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-L",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              result = []

              for raw_line in proc.stdout.splitlines():
                  line = raw_line.strip()

                  if (
                      not line
                      or line.endswith(":")
                      or line.startswith("(architecture ")
                  ):
                      continue

                  marker = " (compatibility version "

                  if marker in line:
                      line = line.split(marker, 1)[0]

                  line = line.strip()

                  if line.startswith(
                      (
                          "/",
                          "@",
                      )
                  ):
                      result.append(line)

              return result

          def has_rpath(
              executable_path: Path,
              rpath: str,
          ) -> bool:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-l",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              return (
                  f"path {rpath} "
                  in proc.stdout
              )

          main_dependencies = dependencies(main)

          expected_main = [
              "@rpath/MediaConverter.dylib",
              "@rpath/blatantsPatch.dylib",
          ]

          for dependency in expected_main:
              if dependency not in main_dependencies:
                  raise SystemExit(
                      "❌ Dependência principal do Media Converter ausente: "
                      f"{dependency}"
                  )

          positions = [
              main_dependencies.index(dependency)
              for dependency in expected_main
          ]

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Ordem MediaConverter -> blatantsPatch diverge "
                  "do IPA de referência"
              )

          if not has_rpath(
              main,
              "@executable_path/Frameworks",
          ):
              raise SystemExit(
                  "❌ Executável principal do Media Converter sem "
                  "@executable_path/Frameworks"
              )

          plugins = app / "PlugIns"
          expected_extensions = {
              "MediaConvertAction.appex",
              "MediaConvertShare.appex",
          }

          extensions = sorted(
              path
              for path in plugins.glob("*.appex")
              if path.is_dir()
          )

          actual_extensions = {
              path.name
              for path in extensions
          }

          if actual_extensions != expected_extensions:
              raise SystemExit(
                  "❌ Conjunto de extensões do Media Converter diverge "
                  f"do IPA de referência: {sorted(actual_extensions)}"
              )

          required_extension_dependency = (
              "@rpath/blatantsPatch.dylib"
          )
          forbidden_extension_dependency = (
              "@rpath/MediaConverter.dylib"
          )
          required_extension_rpath = (
              "@executable_path/../../Frameworks"
          )

          for extension in extensions:
              plist_path = (
                  extension
                  / "Info.plist"
              )

              if not plist_path.is_file():
                  raise SystemExit(
                      f"❌ Info.plist ausente em {extension.name}"
                  )

              with plist_path.open("rb") as f:
                  extension_info = plistlib.load(f)

              extension_executable_name = (
                  extension_info.get(
                      "CFBundleExecutable"
                  )
              )

              if not extension_executable_name:
                  raise SystemExit(
                      "❌ CFBundleExecutable ausente em "
                      f"{extension.name}"
                  )

              extension_executable = (
                  extension
                  / extension_executable_name
              )

              if not extension_executable.is_file():
                  raise SystemExit(
                      "❌ Executável ausente em "
                      f"{extension.name}"
                  )

              extension_dependencies = dependencies(
                  extension_executable
              )

              if (
                  required_extension_dependency
                  not in extension_dependencies
              ):
                  raise SystemExit(
                      "❌ blatantsPatch ausente em "
                      f"{extension.name}"
                  )

              if (
                  forbidden_extension_dependency
                  in extension_dependencies
              ):
                  raise SystemExit(
                      "❌ MediaConverter.dylib foi injetado "
                      "indevidamente em "
                      f"{extension.name}"
                  )

              if not has_rpath(
                  extension_executable,
                  required_extension_rpath,
              ):
                  raise SystemExit(
                      "❌ RPATH compartilhado ausente em "
                      f"{extension.name}"
                  )

          print(
              "✅ MediaConverter.dylib e blatantsPatch.dylib em Frameworks"
          )
          print(
              "✅ Ordem MediaConverter -> blatantsPatch validada "
              "no executável principal"
          )
          print(
              "✅ blatantsPatch validado nas 2 extensões do Media Converter"
          )
          print(
              "✅ MediaConverter.dylib restrito ao app principal"
          )
          PY

