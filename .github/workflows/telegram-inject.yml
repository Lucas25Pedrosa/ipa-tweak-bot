              raise SystemExit("❌ iTranslate: Frameworks ausente")
          if not entitlements.is_file():
              raise SystemExit("❌ iTranslate: cyan.entitlements ausente")

          required_first_stage = [
              frameworks / "CachefixPatch.dylib",
              frameworks / "iTranslateTranslator.dylib",
              (
                  frameworks
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              ),
          ]
          for path in required_first_stage:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ iTranslate: primeira etapa incompleta: {path}"
                  )

          candidates = []
          for raw in Path("inject_files.txt").read_text().splitlines():
              raw = raw.strip()
              if raw and Path(raw).name == "blatantsPatch.dylib":
                  candidates.append(Path(raw))

          if len(candidates) != 1 or not candidates[0].is_file():
              raise SystemExit(
                  "❌ iTranslate: blatantsPatch.dylib não localizado"
              )

          blatant_dst = frameworks / "blatantsPatch.dylib"
          shutil.copy2(candidates[0], blatant_dst)

          before = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          if DEP in before:
              raise SystemExit(
                  "❌ iTranslate: blatant já estava no executável antes da segunda etapa"
              )

          insert_dylib = Path(Executable.idylib)
          if not insert_dylib.is_file():
              raise SystemExit(
                  f"❌ iTranslate: insert_dylib do Cyan ausente: {insert_dylib}"
              )

          Executable(str(exe)).remove_signature()

          proc = subprocess.run(
              [
                  str(insert_dylib),
                  "--weak",
                  "--inplace",
                  "--all-yes",
                  DEP,
                  str(exe),
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  "❌ iTranslate: insert_dylib falhou:\n"
                  + (proc.stderr or proc.stdout or "sem diagnóstico")
              )

          # A referência funcional usa timestamp 2 no blatant.
          raw = bytearray(exe.read_bytes())
          if struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF:
              raise SystemExit("❌ iTranslate: Mach-O principal inesperado")

          ncmds = struct.unpack_from("<I", raw, 16)[0]
          offset = 32
          found = False

          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", raw, offset)
              if cmd == 0x80000018:
                  name_off = struct.unpack_from("<I", raw, offset + 8)[0]
                  start = offset + name_off
                  end = raw.find(b"\0", start, offset + cmdsize)
                  if end < 0:
                      end = offset + cmdsize
                  name = raw[start:end].decode(
                      "utf-8",
                      errors="replace",
                  )
                  if name == DEP:
                      struct.pack_into("<I", raw, offset + 12, 2)
                      found = True
              offset += cmdsize

          if not found:
              raise SystemExit(
                  "❌ iTranslate: load command do blatant não localizado"
              )

          exe.write_bytes(raw)

          # O audit 17.4.75 mostrou os frameworks originais alterados apenas
          # em assinatura/__LINKEDIT. Reassina por descoberta, sem lista fixa.
          resigned = 0
          for framework in sorted(frameworks.glob("*.framework")):
              plist_path = framework / "Info.plist"
              executable_name = framework.stem

              if plist_path.is_file():
                  try:
                      with plist_path.open("rb") as f:
                          framework_info = plistlib.load(f)
                      executable_name = (
                          framework_info.get("CFBundleExecutable")
                          or executable_name
                      )
                  except Exception:
                      pass

              binary = framework / executable_name
              if not binary.is_file():
                  continue

              magic = binary.read_bytes()[:4]
              if magic not in {
                  b"\xcf\xfa\xed\xfe",
                  b"\xca\xfe\xba\xbe",
                  b"\xbe\xba\xfe\xca",
              }:
                  continue

              subprocess.run(
                  [Executable.ldid, "-S", "-M", str(binary)],
                  check=True,
              )
              resigned += 1

          zero_requirements = (
              Path(Executable.install_dir)
              / "extras"
              / "zero.requirements"
          )

          sign_args = [
              Executable.ldid,
              f"-S{entitlements}",
              "-M",
              "-Cadhoc",
          ]
          if zero_requirements.is_file():
              sign_args.append(f"-Q{zero_requirements}")
          sign_args.append(str(exe))

          subprocess.run(sign_args, check=True)

          after = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          if DEP not in after:
              raise SystemExit(
                  "❌ iTranslate: blatant não persistiu no executável"
              )

          output = Path("Cyan_Output.ipa")
          output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(work))

          print(
              "✅ iTranslate: CachefixPatch → iTranslateTranslator → blatant"
          )
          print("✅ iTranslate: timestamp 2 aplicado no blatant principal")
          print(
              "✅ iTranslate: CydiaSubstrate fornecido pelo Cyan"
          )
          print(
              f"✅ iTranslate: {resigned} framework(s) Mach-O reassinado(s)"
          )
          print("ℹ️ iTranslate: ipapatch não utilizado")

          shutil.rmtree(work)
          PY

      - name: Aloha - apply structural second-stage patch
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.alohabrowser.alohabrowser' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import struct
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.alohabrowser.alohabrowser"
          DEP = "@rpath/blatantsPatch.dylib"
          EXTRA_RPATH = "@executable_path/../Frameworks"

          work = Path("aloha_second_stage")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Cyan_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ Aloha: .app principal não identificado"
              )

          app = apps[0]
          info_path = app / "Info.plist"
          with info_path.open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit(
                  "❌ Aloha: bundle ID inesperado"
              )

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit(
                  "❌ Aloha: CFBundleExecutable ausente"
              )

          exe = app / exe_name
          frameworks = app / "Frameworks"
          entitlements = app / "cyan.entitlements"

          if not exe.is_file():
              raise SystemExit(
                  "❌ Aloha: executável principal ausente"
              )
          if not frameworks.is_dir():
              raise SystemExit(
                  "❌ Aloha: Frameworks ausente"
              )
          if not entitlements.is_file():
              raise SystemExit(
                  "❌ Aloha: cyan.entitlements ausente"
              )

          required_first_stage = (
              frameworks / "CachefixPatch.dylib",
              frameworks / "AlohaBrowserPrivateVPNPatch.dylib",
              (
                  frameworks
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              ),
          )
          for path in required_first_stage:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Aloha: primeira etapa incompleta: {path}"
                  )

          candidates = []
          for raw in Path("inject_files.txt").read_text().splitlines():
              raw = raw.strip()
              if raw and Path(raw).name == "blatantsPatch.dylib":
                  candidates.append(Path(raw))

          if len(candidates) != 1 or not candidates[0].is_file():
              raise SystemExit(
                  "❌ Aloha: blatantsPatch.dylib não localizado"
              )

          blatant_dst = frameworks / "blatantsPatch.dylib"
          shutil.copy2(candidates[0], blatant_dst)

          def dependencies(path: Path) -> list[str]:
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              result = []
              for raw_line in proc.stdout.splitlines()[1:]:
                  line = raw_line.strip()
                  marker = " (compatibility version "
                  if marker in line:
                      line = line.split(marker, 1)[0]
                  if line.startswith(("/", "@")):
                      result.append(line)
              return result

          def load_commands(path: Path) -> list[dict]:
              raw = bytearray(path.read_bytes())
              if len(raw) < 32 or struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF:
                  raise SystemExit(
                      f"❌ Aloha: Mach-O inesperado: {path}"
                  )

              ncmds = struct.unpack_from("<I", raw, 16)[0]
              offset = 32
              result = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      raw,
                      offset,
                  )
                  if cmd in {
                      0xC,
                      0x80000018,
                  }:
                      name_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      timestamp = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 12,
                      )[0]
                      start = offset + name_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize
                      name = raw[start:end].decode(
                          "utf-8",
                          errors="replace",
                      )
                      result.append(
                          {
                              "cmd": cmd,
                              "name": name,
                              "timestamp": timestamp,
                          }
                      )
                  offset += cmdsize

              return result

          def patch_timestamp(
              path: Path,
              dependency: str,
              expected_cmd: int,
              timestamp: int,
          ) -> None:
              raw = bytearray(path.read_bytes())
              if len(raw) < 32 or struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF:
                  raise SystemExit(
                      f"❌ Aloha: Mach-O inesperado: {path}"
                  )

              ncmds = struct.unpack_from("<I", raw, 16)[0]
              offset = 32
              found = False

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      raw,
                      offset,
                  )
                  if cmd == expected_cmd:
                      name_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      start = offset + name_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize
                      name = raw[start:end].decode(
                          "utf-8",
                          errors="replace",
                      )
                      if name == dependency:
                          struct.pack_into(
                              "<I",
                              raw,
                              offset + 12,
                              timestamp,
                          )
                          found = True
                  offset += cmdsize

              if not found:
                  raise SystemExit(
                      "❌ Aloha: load command esperado não localizado: "
                      f"{dependency}"
                  )

              path.write_bytes(raw)

          def rpaths(path: Path) -> set[str]:
              proc = subprocess.run(
                  [Executable.otool, "-l", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              result = set()
              for raw_line in proc.stdout.splitlines():
                  line = raw_line.strip()
                  if not line.startswith("path "):
                      continue
                  value = line.split("path ", 1)[1].split(
                      " (offset",
                      1,
                  )[0]
                  result.add(value)
              return result

          insert_dylib = Path(Executable.idylib)
          if not insert_dylib.is_file():
              raise SystemExit(
                  f"❌ Aloha: insert_dylib do Cyan ausente: {insert_dylib}"
              )

          main_before = dependencies(exe)
          for expected in (
              "@rpath/CachefixPatch.dylib",
              "@rpath/AlohaBrowserPrivateVPNPatch.dylib",
          ):
              if main_before.count(expected) != 1:
                  raise SystemExit(
                      "❌ Aloha: primeira etapa não contém exatamente um "
                      f"{expected}"
                  )

          if DEP in main_before:
              raise SystemExit(
                  "❌ Aloha: blatant entrou no principal antes da segunda etapa"
              )

          # A referência funcional usa LC_LOAD_DYLIB normal no blatant
          # do executável principal, não weak-load.
          Executable(str(exe)).remove_signature()
          proc = subprocess.run(
              [
                  str(insert_dylib),
                  "--inplace",
                  "--all-yes",
                  DEP,
                  str(exe),
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  "❌ Aloha: insert_dylib principal falhou:\n"
                  + (proc.stderr or proc.stdout or "sem diagnóstico")
              )

          patch_timestamp(
              exe,
              DEP,
              0xC,
              2,
          )

          # Reproduz as cinco extensões do IPA funcional:
          # blatant normal + timestamp 2 + rpath adicional ../Frameworks.
          appex_dirs = sorted(
              [
                  p
                  for root in (
                      app / "PlugIns",
                      app / "Extensions",
                  )
                  for p in root.glob("*.appex")
                  if p.is_dir()
              ],
              key=lambda p: str(p.relative_to(app)),
          )

          if not appex_dirs:
              raise SystemExit(
                  "❌ Aloha: nenhuma extensão original encontrada"
              )

          for appex in appex_dirs:
              plist_path = appex / "Info.plist"
              with plist_path.open("rb") as f:
                  appex_info = plistlib.load(f)

              appex_bundle = appex_info.get("CFBundleIdentifier")
              if not appex_bundle:
                  raise SystemExit(
                      f"❌ Aloha: bundle ID ausente em {appex.name}"
                  )

              appex_exe_name = appex_info.get("CFBundleExecutable")
              if not appex_exe_name:
                  raise SystemExit(
                      f"❌ Aloha: CFBundleExecutable ausente em {appex.name}"
                  )

              appex_exe = appex / appex_exe_name
              if not appex_exe.is_file():
                  raise SystemExit(
                      f"❌ Aloha: executável ausente em {appex.name}"
                  )

              current = dependencies(appex_exe)

              for forbidden in (
                  "@rpath/CachefixPatch.dylib",
                  "@rpath/AlohaBrowserPrivateVPNPatch.dylib",
              ):
                  if forbidden in current:
                      raise SystemExit(
                          f"❌ Aloha: {appex.name} recebeu dylib indevido: "
                          f"{forbidden}"
                      )

              Executable(str(appex_exe)).remove_signature()

              current_rpaths = rpaths(appex_exe)
              if EXTRA_RPATH not in current_rpaths:
                  add_rpath = subprocess.run(
                      [
                          Executable.nt,
                          "-add_rpath",
                          EXTRA_RPATH,
                          str(appex_exe),
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if add_rpath.returncode != 0:
                      raise SystemExit(
                          f"❌ Aloha: falha ao adicionar rpath em {appex.name}: "
                          + (
                              add_rpath.stderr
                              or add_rpath.stdout
                              or "sem diagnóstico"
                          )
                      )

              current = dependencies(appex_exe)
              if DEP not in current:
                  inject = subprocess.run(
                      [
                          str(insert_dylib),
                          "--inplace",
                          "--all-yes",
                          DEP,
                          str(appex_exe),
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if inject.returncode != 0:
                      raise SystemExit(
                          f"❌ Aloha: insert_dylib falhou em {appex.name}:\n"
                          + (
                              inject.stderr
                              or inject.stdout
                              or "sem diagnóstico"
                          )
                      )

              patch_timestamp(
                  appex_exe,
                  DEP,
                  0xC,
                  2,
              )

              subprocess.run(
                  [
                      Executable.ldid,
                      "-S",
                      "-M",
                      str(appex_exe),
                  ],
                  check=True,
              )

          zero_requirements = (
              Path(Executable.install_dir)
              / "extras"
              / "zero.requirements"
          )
          sign_args = [
              Executable.ldid,
              f"-S{entitlements}",
              "-M",
              "-Cadhoc",
          ]
          if zero_requirements.is_file():
              sign_args.append(
                  f"-Q{zero_requirements}"
              )
          sign_args.append(str(exe))
          subprocess.run(sign_args, check=True)

          main_after = dependencies(exe)
          expected_order = [
              "@rpath/CachefixPatch.dylib",
              "@rpath/AlohaBrowserPrivateVPNPatch.dylib",
              DEP,
          ]
          positions = []
          for expected in expected_order:
              if main_after.count(expected) != 1:
                  raise SystemExit(
                      "❌ Aloha: load principal ausente/duplicado: "
                      f"{expected}"
                  )
              positions.append(main_after.index(expected))

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Aloha: ordem dos dylibs divergiu da referência "
                  "(CachefixPatch → AlohaBrowserPrivateVPNPatch → blatant)"
              )

          output = Path("Cyan_Output.ipa")
          output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(work),
                      )

          print(
              "✅ Aloha: CachefixPatch → "
              "AlohaBrowserPrivateVPNPatch → blatant"
          )
          print(
              "✅ Aloha: blatant principal em LC_LOAD_DYLIB timestamp 2"
          )
          print(
              f"✅ Aloha: {len(appex_dirs)} extensão(ões) preservada(s) "
              "com blatant normal(2)"
          )
          print(
              "✅ Aloha: rpath ../Frameworks reproduzido nas extensões"
          )
          print(
              "✅ Aloha: CydiaSubstrate fornecido pelo Cyan"
          )
          print(
              "ℹ️ Aloha: V5 ainda NÃO aplicado; será executado no Final.ipa"
          )

          shutil.rmtree(work)
          PY

