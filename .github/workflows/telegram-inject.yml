          required_extension = "@rpath/zxPluginsInject.dylib"
          if required_extension not in extension_dependencies:
              raise SystemExit(
                  "❌ IPA Patch não injetou zxPluginsInject na extensão"
              )

          if any(
              "SatellaJailed.dylib" in dep
              for dep in extension_dependencies
          ):
              raise SystemExit(
                  "❌ SatellaJailed foi injetada indevidamente na extensão"
              )

          if not has_rpath(
              extension_executable,
              "@executable_path/../../Frameworks",
          ):
              raise SystemExit(
                  "❌ Extensão sem @executable_path/../../Frameworks"
              )

          zx = app / "Frameworks" / "zxPluginsInject.dylib"
          if not zx.is_file():
              raise SystemExit(
                  "❌ zxPluginsInject.dylib não foi criado em Frameworks"
              )

          print(
              "✅ SatellaJailed.dylib preservada byte a byte na raiz"
          )
          print(
              "✅ App principal carrega somente @executable_path/SatellaJailed.dylib"
          )
          print(
              "✅ OneSignalNotificationServiceExtension carrega "
              "@rpath/zxPluginsInject.dylib"
          )
          print(
              "✅ IPA Patch plugins-only restrito à extensão"
          )
