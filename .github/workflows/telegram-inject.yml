          with zipfile.ZipFile("Final.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ BoldVoice: .app final não identificado após V5"
              )

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.wellocution.iosapp":
              raise SystemExit(
                  "❌ BoldVoice: bundle final inesperado após V5"
              )

          frameworks = app / "Frameworks"
          patch = frameworks / "BoldVoiceAccentTrainingPatch.dylib"

          if not patch.is_file():
              raise SystemExit(
                  "❌ BoldVoice: BoldVoiceAccentTrainingPatch.dylib ausente"
              )

          for name in EXPECTED_DYLIBS:
              if not (frameworks / name).is_file():
                  raise SystemExit(
                      f"❌ BoldVoice: componente final ausente: {name}"
                  )

          spec = importlib.util.spec_from_file_location(
              "private_postprocess_boldvoice_post",
              "private-core/scripts/postprocess.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ BoldVoice: não foi possível carregar postprocess.py"
              )

          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          candidate = module.find_v5_candidate(
              patch.read_bytes()
          )

          if candidate.view_did_load.imp != candidate.dismiss_callback.imp:
              raise SystemExit(
                  "❌ BoldVoice: V5 não redirecionou viewDidLoad"
              )

          # Depois do V5, as extensões continuam sem os 7 dylibs.
          for base_name in ("PlugIns", "Extensions"):
              base = app / base_name
              if not base.is_dir():
                  continue

              for appex in sorted(base.glob("*.appex")):
                  plist_path = appex / "Info.plist"
                  if not plist_path.is_file():
                      continue

                  with plist_path.open("rb") as f:
                      ext_info = plistlib.load(f)

                  ext_exec_name = ext_info.get("CFBundleExecutable")
                  if not ext_exec_name:
                      continue

                  ext_exec = appex / ext_exec_name
                  if not ext_exec.is_file():
                      continue

                  proc = subprocess.run(
                      [Executable.otool, "-L", str(ext_exec)],
                      capture_output=True,
                      text=True,
                      check=True,
                  )

                  leaked = [
                      name
                      for name in EXPECTED_DYLIBS
                      if name in proc.stdout
                  ]
                  if leaked:
                      raise SystemExit(
                          f"❌ BoldVoice: {appex.name} recebeu dylib indevida: "
                          f"{leaked}"
                      )

          print(
              "✅ BoldVoice: rota inicial STANDARD confirmada"
          )
          print(
              "✅ BoldVoice: 7 dylibs preservados no Final.ipa"
          )
          print(
              "✅ BoldVoice: V5 aplicado somente no Final.ipa"
          )
          print(
              "✅ BoldVoice: extensões preservadas sem injeção"
          )
          print(
              f"✅ BoldVoice: bytes alterados pelo V5: "
              f"{nopopup.get('changed_bytes', 0)}"
          )

          shutil.rmtree(work)
          PY

      - name: Validate CamScanner V5 after injection
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.intsig.CamScannerLite' }}
        run: |
          python <<'PY'
          import importlib.util
          import json
          import plistlib
          import shutil
          import struct
          import sys
          import zipfile
          from pathlib import Path

          EXPECTED_DYLIBS = [
              "NewFix1.dylib",
              "libpro.dylib",
              "Sideloadbypass2.dylib",
              "FixCrash.dylib",
              "Sideloadbypass1.dylib",
              "CachefixPatch.dylib",
              "NewFix2.dylib",
              "CamScannerPDFScannerAppPatch.dylib",
          ]
          EXPECTED_LOADS = [
              f"@rpath/{name}"
              for name in EXPECTED_DYLIBS
          ]

          status_path = Path(".private-status.json")
          if not status_path.is_file():
              raise SystemExit(
                  "❌ CamScanner: status do pós-processamento V5 ausente"
              )

          status = json.loads(
              status_path.read_text(encoding="utf-8")
          )

          if status.get("processing_route") != "private":
              raise SystemExit(
                  "❌ CamScanner: Final.ipa não entrou na rota privada V5"
              )

          nopopup = status.get("nopopup", {})
          if nopopup.get("status") not in {
              "applied",
              "already_applied",
          }:
              raise SystemExit(
                  "❌ CamScanner: V5 não foi aplicado: "
                  + json.dumps(
                      nopopup,
                      ensure_ascii=False,
                  )
              )

          work = Path("camscanner_post_v5_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Final.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ CamScanner: .app final não identificado após V5"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.intsig.CamScannerLite":
              raise SystemExit(
                  "❌ CamScanner: bundle final inesperado após V5"
              )

          executable_name = info.get("CFBundleExecutable")
          executable = app / str(executable_name or "")
          frameworks = app / "Frameworks"
          patch = frameworks / "CamScannerPDFScannerAppPatch.dylib"

          if not executable.is_file():
              raise SystemExit(
                  "❌ CamScanner: executável final ausente"
              )

          for name in EXPECTED_DYLIBS:
              if not (frameworks / name).is_file():
                  raise SystemExit(
                      f"❌ CamScanner: componente final ausente: {name}"
                  )

          if not (
              frameworks
              / "CydiaSubstrate.framework"
              / "CydiaSubstrate"
          ).is_file():
              raise SystemExit(
                  "❌ CamScanner: CydiaSubstrate.framework ausente após V5"
              )

          # Extensões precisam continuar totalmente removidas.
          remaining_appex = []
          for base_name in ("PlugIns", "Extensions"):
              base = app / base_name
              if base.is_dir():
                  remaining_appex.extend(
                      str(path.relative_to(app))
                      for path in base.rglob("*.appex")
                  )

          if remaining_appex:
              raise SystemExit(
                  "❌ CamScanner: extensão(ões) reapareceram após V5: "
                  + ", ".join(sorted(remaining_appex))
              )

          # V5 estrutural deve ter sido aplicado ao Patch.
          spec = importlib.util.spec_from_file_location(
              "private_postprocess_camscanner_post",
              "private-core/scripts/postprocess.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ CamScanner: não foi possível carregar postprocess.py"
              )

          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          candidate = module.find_v5_candidate(
              patch.read_bytes()
          )

          if candidate.view_did_load.imp != candidate.dismiss_callback.imp:
              raise SystemExit(
                  "❌ CamScanner: V5 não redirecionou viewDidLoad"
              )

          # O pós-processamento V5 não deve alterar a ordem/tipo dos loads.
          raw = executable.read_bytes()
          if (
              len(raw) < 32
              or struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF
          ):
              raise SystemExit(
                  "❌ CamScanner: executável final não é Mach-O arm64 esperado"
              )

          ncmds = struct.unpack_from("<I", raw, 16)[0]
          offset = 32
          loads = []

          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", raw, offset)

              if cmd in {0xC, 0x80000018}:
                  name_offset = struct.unpack_from(
                      "<I",
                      raw,
                      offset + 8,
                  )[0]
                  timestamp = struct.unpack_from(
                      "<I",
                      raw,
                      offset + 12,
                  )[0]
                  start = offset + name_offset
                  end = raw.find(
                      b"\0",
                      start,
                      offset + cmdsize,
                  )
                  if end < 0:
                      end = offset + cmdsize

                  loads.append(
                      (
                          cmd,
                          raw[start:end].decode(
                              "utf-8",
                              errors="replace",
                          ),
                          timestamp,
                      )
                  )

              offset += cmdsize

          positions = []
          for dep in EXPECTED_LOADS:
              matches = [
                  (index, cmd, timestamp)
                  for index, (cmd, name, timestamp)
                  in enumerate(loads)
                  if name == dep
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"❌ CamScanner: load final ausente/duplicado: {dep}"
                  )

              index, cmd, timestamp = matches[0]
              positions.append(index)

              if cmd != 0x80000018 or timestamp != 0:
                  raise SystemExit(
                      f"❌ CamScanner: load final divergente em {dep}"
                  )

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ CamScanner: ordem dos dylibs mudou após o V5"
              )

          print(
              "✅ CamScanner: rota inicial STANDARD confirmada"
          )
          print(
              "✅ CamScanner: 8 dylibs weak(0) preservados no Final.ipa"
          )
          print(
              "✅ CamScanner: extensões continuam removidas"
          )
          print(
              "✅ CamScanner: V5 aplicado somente no Final.ipa"
          )
          print(
              f"✅ CamScanner: bytes alterados pelo V5: "
              f"{nopopup.get('changed_bytes', 0)}"
          )

          shutil.rmtree(work)
          PY

      - name: Validate final IPA
        run: |
          if [ ! -f Final.ipa ]; then
            echo "❌ Final.ipa ausente"
            exit 1
          fi

          if ! unzip -tq Final.ipa > /dev/null; then
            echo "❌ Final.ipa inválido"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "✅ IPA FINAL CRIADO"
          echo "=========================================="
          echo ""
          echo "📱 Nome:"
          echo "${{ steps.prepare.outputs.app_name || steps.private_input.outputs.app_name }}"
          echo ""
          echo "📦 Bundle ID:"
          echo "${{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}"
          echo ""
          echo "🔢 Versão:"
          echo "${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}"
          echo ""
          echo "🧩 Tweak:"
          echo "${{ steps.prepare.outputs.addon_name || steps.private_input.outputs.addon_name }}"
          echo ""
          echo "🩹 IPA Patch:"
          echo "${{ steps.prepare.outputs.ipapatch }}"
          echo ""
          echo "🩹 Modo IPA Patch:"
          echo "${{ steps.prepare.outputs.ipapatch_mode }}"
          echo ""

          ls -lh Final.ipa

      - name: Progresso da injeção - 100%
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
        run: |
          python .update_injection_progress.py 100

      # =========================================================
      # 13. TELEGRAM BOT
      # =========================================================

      - name: Validate Feather package metadata
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        env:
          BUNDLE_ID: ${{ steps.prepare.outputs.bundle_id }}
          APP_VERSION: ${{ steps.prepare.outputs.version }}
          ADDON_NAME: ${{ steps.prepare.outputs.addon_name }}
        run: |
          python <<'PY'
          import feather_package_transport as transport

          metadata = transport._load_package_metadata("Final.ipa")

          if not metadata:
              raise SystemExit(
                  "❌ Feather metadata não pôde ser gerado para o IPA final"
              )

          required = (
              "bundle",
              "appVersion",
              "packageName",
              "packageVersion",
              "packageRevision",
          )

          missing = [
              key
              for key in required
              if not str(metadata.get(key) or "").strip()
          ]

          if missing:
              raise SystemExit(
                  "❌ Feather metadata incompleto: "
                  + ", ".join(missing)
              )

          print(
              "🪶 Feather metadata validado: "
              f"{metadata['packageName']} "
              f"{metadata['packageVersion']} | "
              f"rev {metadata['packageRevision'][:12]}"
          )
          PY

      - name: Send final IPA to Telegram bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}

          APP_NAME: ${{ steps.prepare.outputs.app_name || steps.private_input.outputs.app_name }}
          BUNDLE_ID: ${{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}
          APP_VERSION: ${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}
          ADDON_NAME: ${{ steps.prepare.outputs.addon_name || steps.private_input.outputs.addon_name }}
          ADDON_VERSION: ${{ steps.prepare.outputs.addon_version }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
        run: |
          python telegram_send.py

      # =========================================================
      # 14. FINALIZAR NOTIFICAÇÃO DO BOT
      # =========================================================

      - name: Finalizar notificação do /iniciar
        if: ${{ always() && inputs.telegram_message_id != '' && inputs.callback_url != '' }}
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -fsS -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Token: ${TELEGRAM_BOT_TOKEN}" \
            --data "{\"telegram_message_id\":\"${TELEGRAM_MESSAGE_ID}\",\"status\":\"${JOB_STATUS}\"}" \
            >/dev/null

