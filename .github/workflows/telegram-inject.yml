      - name: Add bundles and extra extensions
        if: ${{ steps.prepare.outputs.bundle_id != 'com.burbn.instagram' }}
        run: |
          python <<'PY'
          import shutil
          import zipfile
          from pathlib import Path

          work = Path(
              "package_work"
          )

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          with zipfile.ZipFile(
              "Patched_Output.ipa",
              "r",
          ) as z:
              z.extractall(work)

          apps = list(
              (work / "Payload").glob("*.app")
          )

