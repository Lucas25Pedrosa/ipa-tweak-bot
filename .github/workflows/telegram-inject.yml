      - name: Apply Info.plist changes
        if: ${{ steps.prepare.outputs.bundle_id != 'com.burbn.instagram' }}
        run: |
          python <<'PY'
          import json
          import plistlib
          import shutil
          import zipfile
          from pathlib import Path

          with open(
              "selected_addon.json",
              "r",
              encoding="utf-8",
          ) as f:
              addon = json.load(f)

          changes = addon.get(
              "plist",
              {},
          )

          if not changes:
              shutil.copy2(
                  "Package_Output.ipa",
                  "Final.ipa",
              )

              print(
                  "ℹ️ Nenhuma alteração de Info.plist"
              )

              raise SystemExit(0)

          work = Path(
              "plist_work"
          )

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          with zipfile.ZipFile(
              "Package_Output.ipa",
              "r",
          ) as z:
              z.extractall(work)

          apps = list(
              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  "❌ App principal não encontrado"
              )

          app = apps[0]
          plist_path = app / "Info.plist"

          with open(
              plist_path,
              "rb",
          ) as f:
              plist = plistlib.load(f)

          print(
              "📝 Alterações no Info.plist:"
          )

          for key, value in changes.items():
              old = plist.get(
                  key,
                  "<não existente>",
              )

              plist[key] = value

              print(
                  f"✅ {key}: {old} -> {value}"
              )

          with open(
              plist_path,
              "wb",
          ) as f:
              plistlib.dump(
                  plist,
                  f,
                  fmt=plistlib.FMT_BINARY,
              )

          output = Path(
              "Final.ipa"
          )

          if output.exists():
              output.unlink()

          with zipfile.ZipFile(
