              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.edsonteco.PocketTerco":
              raise SystemExit(
                  "❌ Bundle ID final do Pocket Terço inesperado"
              )

          executable_name = info.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do Pocket Terço ausente"
              )

          main = app / executable_name
          satella = app / "SatellaJailed.dylib"
          if not main.is_file():
              raise SystemExit(
                  "❌ Executável principal do Pocket Terço ausente"
              )
          if not satella.is_file():
              raise SystemExit(
                  "❌ SatellaJailed.dylib não está na raiz do app"
              )

          if (app / "Frameworks" / "SatellaJailed.dylib").exists():
              raise SystemExit(
                  "❌ SatellaJailed.dylib permaneceu indevidamente em Frameworks"
              )

          expected_satella_sha256 = (
              "ac8587090f3421d1ef9f629f9eac543deede82d608059a347be62b6cbad161d5"
          )
          actual_satella_sha256 = hashlib.sha256(
              satella.read_bytes()
          ).hexdigest()
          if actual_satella_sha256 != expected_satella_sha256:
              raise SystemExit(
                  "❌ SatellaJailed.dylib foi alterada durante o pipeline: "
                  f"{actual_satella_sha256}"
              )

          def dependencies(path: Path) -> list[str]:
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              deps = []
              for raw in proc.stdout.splitlines():
                  line = raw.strip()
                  if (
                      not line
                      or line.endswith(":")
                      or line.startswith("(architecture ")
                  ):
                      continue
                  marker = " (compatibility version "
                  dep = (
                      line.split(marker, 1)[0].strip()
                      if marker in line
                      else line
                  )
                  if dep.startswith(("/", "@")):
                      deps.append(dep)
              return deps

          def has_rpath(path: Path, rpath: str) -> bool:
              proc = subprocess.run(
                  [Executable.otool, "-l", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return f"path {rpath} " in proc.stdout

          main_dependencies = dependencies(main)
          required_main = "@executable_path/SatellaJailed.dylib"

          if required_main not in main_dependencies:
              raise SystemExit(
                  "❌ App principal não carrega SatellaJailed pela raiz"
              )

          if "@rpath/SatellaJailed.dylib" in main_dependencies:
              raise SystemExit(
                  "❌ App principal carrega Satella pelo caminho incorreto"
              )

          if any(
              "zxPluginsInject.dylib" in dep
              for dep in main_dependencies
          ):
              raise SystemExit(
                  "❌ IPA Patch atingiu indevidamente o app principal"
              )

          extensions = sorted(
              (app / "PlugIns").glob("*.appex")
