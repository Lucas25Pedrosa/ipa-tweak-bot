              "@executable_path/Stalky.dylib",
              "@rpath/ContactSync.dylib",
              "@rpath/OnlineNotify.dylib",
              "@rpath/Stalky.dylib",
              "@rpath/zxPluginsInject.dylib",
          }

          unexpected = sorted(
              forbidden_main & set(dependencies)
          )

          if unexpected:
              raise SystemExit(
                  "❌ Dependência inesperada no WhatsApp: "
                  + ", ".join(unexpected)
              )

          required_root = [
              "Watusi.dylib",
              "libWatusiToolsSL.dylib",
              "ContactSync.dylib",
              "OnlineNotify.dylib",
              "Stalky.dylib",
              "Watusi.bundle",
              "WatusiTools.bundle",
              "ContactSync.bundle",
              "OnlineNotify.bundle",
              "Stalky.bundle",
          ]

          for name in required_root:
              if not (app / name).exists():
                  raise SystemExit(
                      f"❌ Componente Watusi ausente na raiz: {name}"
                  )

          vendor = (
              app
              / "Frameworks"
              / "WSVendor.framework"
              / "WSVendor"
          )

          if not vendor.is_file():
              raise SystemExit(
                  "❌ WSVendor.framework ausente"
              )

          migration = (
              app
              / "Extensions"
              / "AppMigrationExtension.appex"
          )

          if migration.exists():
              raise SystemExit(
                  "❌ AppMigrationExtension.appex deveria ter sido removida"
              )

          expected_plugins = {
              "BroadcastUploadExtension.appex",
              "Intents.appex",
              "NotificationExtension.appex",
              "ServiceExtension.appex",
              "ShareExtension.appex",
              "WidgetExtension.appex",
          }

          plugins = app / "PlugIns"
          actual_plugins = {
              item.name
              for item in plugins.glob("*.appex")
          }

          if actual_plugins != expected_plugins:
              raise SystemExit(
                  "❌ Conjunto de extensões do WhatsApp mudou. "
                  f"Esperado: {sorted(expected_plugins)}; "
                  f"encontrado: {sorted(actual_plugins)}"
              )

          forbidden_plugin_tokens = (
              "Watusi.dylib",
              "libWatusiToolsSL.dylib",
              "ContactSync.dylib",
              "OnlineNotify.dylib",
              "Stalky.dylib",
              "zxPluginsInject.dylib",
          )

          for extension in sorted(plugins.glob("*.appex")):
              plist_path = extension / "Info.plist"

              with plist_path.open("rb") as f:
                  extension_plist = plistlib.load(f)

              extension_executable_name = extension_plist.get(
                  "CFBundleExecutable"
              )

              if not extension_executable_name:
                  raise SystemExit(
                      f"❌ CFBundleExecutable ausente em {extension.name}"
                  )

              extension_executable = (
                  extension
                  / extension_executable_name
              )

              extension_dependencies = Executable(
                  str(extension_executable)
              ).get_dependencies()

              bad = [
                  dependency
                  for dependency in extension_dependencies
                  if any(
                      token in dependency
                      for token in forbidden_plugin_tokens
                  )
              ]

              if bad:
                  raise SystemExit(
                      "❌ Tweak injetado indevidamente em "
                      f"{extension.name}: {bad}"
                  )

          print(
              "✅ WhatsApp segue o layout Watusi/Fouad auditado"
          )
          print(
              "✅ 6 extensões originais preservadas sem Watusi/IPA Patch"
          )
          print(
              "✅ AppMigrationExtension.appex removida seletivamente"
          )
          PY

      - name: Progresso da injeção - 80%
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
        run: |
          python .update_injection_progress.py 80

      - name: Prepare private processing output
        if: ${{ steps.private_input.outputs.processing_route == 'private' }}
        run: |
          cp input.ipa Final.ipa

      - name: Private post-processing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
        run: |
          python private-core/scripts/postprocess.py Final.ipa \
            --status-file .private-status.json

      - name: Validate final IPA
        run: |
          if [ ! -f Final.ipa ]; then
            echo "❌ Final.ipa ausente"
            exit 1
          fi

          if ! unzip -tq Final.ipa > /dev/null; then
            echo "❌ Final.ipa inválido"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "✅ IPA FINAL CRIADO"
          echo "=========================================="
          echo ""
          echo "📱 Nome:"
          echo "${{ steps.prepare.outputs.app_name || steps.private_input.outputs.app_name }}"
          echo ""
          echo "📦 Bundle ID:"
          echo "${{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}"
          echo ""
          echo "🔢 Versão:"
          echo "${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}"
          echo ""
          echo "🧩 Tweak:"
          echo "${{ steps.prepare.outputs.addon_name || steps.private_input.outputs.addon_name }}"
          echo ""
          echo "🩹 IPA Patch:"
          echo "${{ steps.prepare.outputs.ipapatch }}"
          echo ""
          echo "🩹 Modo IPA Patch:"
          echo "${{ steps.prepare.outputs.ipapatch_mode }}"
          echo ""

          ls -lh Final.ipa

      - name: Progresso da injeção - 100%
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
        run: |
          python .update_injection_progress.py 100

      # =========================================================
      # 13. TELEGRAM BOT
      # =========================================================

      - name: Send final IPA to Telegram bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}

          APP_NAME: ${{ steps.prepare.outputs.app_name || steps.private_input.outputs.app_name }}
          BUNDLE_ID: ${{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}
          APP_VERSION: ${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}
          ADDON_NAME: ${{ steps.prepare.outputs.addon_name || steps.private_input.outputs.addon_name }}
          ADDON_VERSION: ${{ steps.prepare.outputs.addon_version }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
        run: |
          python telegram_send.py

      # =========================================================
      # 14. FINALIZAR NOTIFICAÇÃO DO BOT
      # =========================================================

      - name: Finalizar notificação do /iniciar
        if: ${{ always() && inputs.telegram_message_id != '' && inputs.callback_url != '' }}
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -fsS -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Token: ${TELEGRAM_BOT_TOKEN}" \
            --data "{\"telegram_message_id\":\"${TELEGRAM_MESSAGE_ID}\",\"status\":\"${JOB_STATUS}\"}" \
            >/dev/null

