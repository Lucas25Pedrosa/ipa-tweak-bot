      - name: Install Pocket Terço using audited Satella layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.edsonteco.PocketTerco' }}
        run: |
          python <<'PY'
          import json
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("pocketterco_work")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("input.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit("❌ Pocket Terço: .app principal não identificado")

          app = apps[0]
          plist_path = app / "Info.plist"
          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.edsonteco.PocketTerco":
              raise SystemExit("❌ Pocket Terço: bundle ID inesperado")

          executable_name = info.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit("❌ Pocket Terço: CFBundleExecutable ausente")

          executable_path = app / executable_name

          with open("selected_addon.json", "r", encoding="utf-8") as f:
              addon = json.load(f)

          satella_source = None
          for item in addon.get("files", []):
              if item.get("action") != "inject":
                  continue
              candidate = Path(item["path"])
              if candidate.name == "SatellaJailed.dylib":
                  satella_source = candidate
                  break

          if satella_source is None or not satella_source.is_file():
              raise SystemExit(
                  "❌ Pocket Terço: SatellaJailed.dylib ausente no Core"
              )

          satella_destination = app / "SatellaJailed.dylib"
          shutil.copy2(satella_source, satella_destination)
          print("✅ Pocket Terço: SatellaJailed.dylib copiado para a raiz sem reprocessamento")

          def dependencies(path: Path) -> list[str]:
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              deps = []
              for raw in proc.stdout.splitlines():
                  line = raw.strip()
                  if not line or line.endswith(":") or line.startswith("(architecture "):
                      continue
                  marker = " (compatibility version "
                  dep = line.split(marker, 1)[0].strip() if marker in line else line
                  if dep.startswith(("/Library/", "/usr/lib/", "@")):
                      deps.append(dep)
              return deps

          expected_load = "@executable_path/SatellaJailed.dylib"
          before = dependencies(executable_path)

          if expected_load in before:
              raise SystemExit(
                  "❌ Pocket Terço: Satella já estava injetada na base limpa"
              )

          if "@rpath/SatellaJailed.dylib" in before:
              raise SystemExit(
                  "❌ Pocket Terço: base limpa contém load @rpath inesperado da Satella"
              )

          proc = subprocess.run(
              [
                  Executable.idylib,
                  "--weak",
                  "--inplace",
                  "--all-yes",
                  "--no-strip-codesig",
                  expected_load,
                  str(executable_path),
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  "❌ Pocket Terço: falha ao inserir SatellaJailed:\n"
                  + proc.stderr
              )

          after = dependencies(executable_path)
          if expected_load not in after:
              raise SystemExit(
                  "❌ Pocket Terço: weak-load da Satella não foi gravado"
              )

          if "@rpath/SatellaJailed.dylib" in after:
              raise SystemExit(
                  "❌ Pocket Terço: Satella ficou com load path incorreto"
              )

          if any("zxPluginsInject.dylib" in dep for dep in after):
              raise SystemExit(
                  "❌ Pocket Terço: zxPluginsInject foi injetado indevidamente no app principal"
              )

          proc = subprocess.run(
              [Executable.otool, "-l", str(executable_path)],
              capture_output=True,
              text=True,
              check=True,
          )
          load_text = proc.stdout
          idx = load_text.find(expected_load)
          if idx < 0:
              raise SystemExit(
                  "❌ Pocket Terço: load command da Satella não encontrado"
              )
          prefix = load_text[max(0, idx - 500):idx]
          if "cmd LC_LOAD_WEAK_DYLIB" not in prefix:
              raise SystemExit(
                  "❌ Pocket Terço: Satella não está como LC_LOAD_WEAK_DYLIB"
              )

          output = Path("Cyan_Output.ipa")
          if output.exists():
              output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(work))

          print(
              "✅ Pocket Terço: Satella na raiz reproduzida sem Cyan; "
              "extensão seguirá para IPA Patch plugins-only"
          )
          PY

      - name: Inject with Cyan
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id != 'com.burbn.instagram' && steps.prepare.outputs.bundle_id != 'com.edsonteco.PocketTerco' }}
        run: |
          mapfile -t INJECT_FILES < inject_files.txt

          CYAN_ARGS=(
            -i input.ipa
            -o Cyan_Output.ipa
            -u
            -w
          )

          CYAN_INJECT_FILES=()
          for FILE in "${INJECT_FILES[@]}"; do
            if { [ "${{ steps.prepare.outputs.bundle_id }}" = "com.lightricks.Facetune2" ] \
                 || [ "${{ steps.prepare.outputs.bundle_id }}" = "com.ilovepdf.www" ] \
                 || [ "${{ steps.prepare.outputs.bundle_id }}" = "com.outerspaceapps.itranslate" ] \
                 || [ "${{ steps.prepare.outputs.bundle_id }}" = "com.alohabrowser.alohabrowser" ]; } \
               && [ "$(basename "$FILE")" = "blatantsPatch.dylib" ]; then
              echo "🧩 blatantsPatch será aplicado na segunda etapa, fora do Cyan"
              continue
            fi
            CYAN_INJECT_FILES+=("$FILE")
          done

          if [ "${#CYAN_INJECT_FILES[@]}" -gt 0 ]; then
            CYAN_ARGS+=("-f")

            for FILE in "${CYAN_INJECT_FILES[@]}"; do
              CYAN_ARGS+=("$FILE")
            done
          fi

          if [ "${{ steps.prepare.outputs.bundle_id }}" = "com.lightricks.Facetune2" ]; then
            echo "🧹 Facetune: removendo extensões antes da segunda etapa"
            CYAN_ARGS+=("-e")
          elif [ "${{ steps.prepare.outputs.remove_extensions }}" = "true" ]; then
            echo "🧹 Extensões serão removidas"
            CYAN_ARGS+=("-e")
          else
            echo "🧩 Extensões originais serão preservadas"
          fi

          CYAN_ARGS+=("--overwrite")

          echo "💉 Executando Cyan..."
          cyan "${CYAN_ARGS[@]}"

          if [ ! -f Cyan_Output.ipa ]; then
            echo "❌ Cyan não gerou Cyan_Output.ipa"
            exit 1
          fi

          echo "✅ Cyan concluído"

      - name: Facetune - apply structural second-stage patch
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.lightricks.Facetune2' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.lightricks.Facetune2"

          work = Path("facetune_second_stage")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Cyan_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ Facetune: .app não identificado na segunda etapa"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit(
                  "❌ Facetune: bundle inesperado na segunda etapa"
              )

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit(
                  "❌ Facetune: CFBundleExecutable ausente"
              )

          exe = app / exe_name
          if not exe.is_file():
              raise SystemExit(
                  f"❌ Facetune: executável ausente: {exe_name}"
              )

          frameworks = app / "Frameworks"
          frameworks.mkdir(exist_ok=True)

          entitlements = app / "cyan.entitlements"
          if not entitlements.is_file():
              raise SystemExit(
                  "❌ Facetune: cyan.entitlements ausente"
              )

          candidates = []
          for raw in Path("inject_files.txt").read_text().splitlines():
              raw = raw.strip()
              if raw and Path(raw).name == "blatantsPatch.dylib":
                  candidates.append(Path(raw))

          if len(candidates) != 1 or not candidates[0].is_file():
              raise SystemExit(
                  "❌ Facetune: blatantsPatch.dylib original não localizado"
              )

          blatant_src = candidates[0]
          blatant_dst = frameworks / "blatantsPatch.dylib"
          shutil.copy2(blatant_src, blatant_dst)

          dep = "@rpath/blatantsPatch.dylib"

          before = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          if dep in before:
              raise SystemExit(
                  "❌ Facetune: blatantsPatch já estava carregado "
                  "antes da segunda etapa"
              )

          insert_dylib = Path(Executable.idylib)
          if not insert_dylib.is_file():
              raise SystemExit(
                  "❌ Facetune: insert_dylib do Cyan não encontrado: "
                  f"{insert_dylib}"
              )

          # Remove apenas a assinatura antiga antes de alterar os load commands.
          # Nada aqui depende de versão, offsets, hashes ou tamanhos conhecidos.
          Executable(str(exe)).remove_signature()

          proc = subprocess.run(
              [
                  str(insert_dylib),
                  "--weak",
                  "--inplace",
                  "--all-yes",
                  dep,
                  str(exe),
              ],
              capture_output=True,
              text=True,
          )

          if proc.returncode != 0:
              raise SystemExit(
                  "❌ Facetune: insert_dylib falhou:\n"
                  + (proc.stderr or proc.stdout or "sem diagnóstico")
              )

          after = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          if dep not in after:
              raise SystemExit(
                  "❌ Facetune: blatantsPatch não apareceu no Mach-O"
              )

          # Reassina somente frameworks conhecidos que realmente existirem.
          # A ausência de algum deles em uma versão futura não bloqueia a rota.
          known_frameworks = [
              frameworks / "FullStory.framework" / "FullStory",
              frameworks / "RxCocoa.framework" / "RxCocoa",
              frameworks / "RxRelay.framework" / "RxRelay",
              frameworks / "RxSwift.framework" / "RxSwift",
              frameworks / "Sentry.framework" / "Sentry",
          ]

          resigned = 0
          for fw in known_frameworks:
              if not fw.is_file():
                  continue

              subprocess.run(
                  [
                      Executable.ldid,
                      "-S",
                      "-M",
                      str(fw),
                  ],
                  check=True,
              )
              resigned += 1

          # Assinatura final dinâmica. Sem qualquer parâmetro específico
          # da versão 26.26.
          sign_args = [
              Executable.ldid,
              f"-S{entitlements}",
              "-M",
              "-Cadhoc",
          ]

          zero_requirements = (
              Path(Executable.install_dir)
              / "extras"
              / "zero.requirements"
          )
          if zero_requirements.is_file():
              sign_args.append(
                  f"-Q{zero_requirements}"
              )

          sign_args.append(str(exe))

          subprocess.run(
              sign_args,
              check=True,
          )

          output = Path("Cyan_Output.ipa")
          output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(work),
                      )

          print(
              "✅ Facetune: blatantsPatch aplicado pela rota estrutural"
          )
          print(
              "✅ Facetune: executável reassinado dinamicamente"
          )
          print(
              f"ℹ️ Facetune: {resigned} framework(s) conhecido(s) reassinado(s)"
          )
          print(
              "ℹ️ Facetune: nenhum perfil exato de versão foi utilizado"
          )

          shutil.rmtree(work)
          PY

      - name: iLovePDF - apply structural second-stage patch
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.ilovepdf.www' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import struct
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.ilovepdf.www"
          DEP = "@rpath/blatantsPatch.dylib"

          work = Path("ilovepdf_second_stage")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Cyan_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit("❌ iLovePDF: .app principal não identificado")

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit("❌ iLovePDF: bundle ID inesperado")

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit("❌ iLovePDF: CFBundleExecutable ausente")

          exe = app / exe_name
          frameworks = app / "Frameworks"
          entitlements = app / "cyan.entitlements"

          if not exe.is_file():
              raise SystemExit("❌ iLovePDF: executável principal ausente")
          if not frameworks.is_dir():
              raise SystemExit("❌ iLovePDF: Frameworks ausente")
          if not entitlements.is_file():
              raise SystemExit("❌ iLovePDF: cyan.entitlements ausente")

          required_first_stage = [
              frameworks / "FilePickerFix.dylib",
              frameworks / "iLovePDF.dylib",
          ]
          for path in required_first_stage:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ iLovePDF: primeira etapa incompleta: {path.name}"
                  )

          candidates = []
          for raw in Path("inject_files.txt").read_text().splitlines():
              raw = raw.strip()
              if raw and Path(raw).name == "blatantsPatch.dylib":
                  candidates.append(Path(raw))

          if len(candidates) != 1 or not candidates[0].is_file():
              raise SystemExit("❌ iLovePDF: blatantsPatch.dylib não localizado")

          blatant_dst = frameworks / "blatantsPatch.dylib"
          shutil.copy2(candidates[0], blatant_dst)

          before = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          if DEP in before:
              raise SystemExit(
                  "❌ iLovePDF: blatant já estava no executável antes da segunda etapa"
              )

          insert_dylib = Path(Executable.idylib)
          if not insert_dylib.is_file():
              raise SystemExit(
                  f"❌ iLovePDF: insert_dylib do Cyan ausente: {insert_dylib}"
              )

          Executable(str(exe)).remove_signature()

          proc = subprocess.run(
              [
                  str(insert_dylib),
                  "--weak",
                  "--inplace",
                  "--all-yes",
                  DEP,
                  str(exe),
              ],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  "❌ iLovePDF: insert_dylib falhou:\n"
                  + (proc.stderr or proc.stdout or "sem diagnóstico")
              )

          # A rota funcional usa timestamp 2 no blatant da segunda etapa.
          raw = bytearray(exe.read_bytes())
          if struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF:
              raise SystemExit("❌ iLovePDF: Mach-O principal inesperado")

          ncmds = struct.unpack_from("<I", raw, 16)[0]
          offset = 32
          found = False

          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", raw, offset)
              if cmd == 0x80000018:
                  name_off = struct.unpack_from("<I", raw, offset + 8)[0]
                  start = offset + name_off
                  end = raw.find(b"\0", start, offset + cmdsize)
                  if end < 0:
                      end = offset + cmdsize
                  name = raw[start:end].decode("utf-8", errors="replace")
                  if name == DEP:
                      struct.pack_into("<I", raw, offset + 12, 2)
                      found = True
              offset += cmdsize

          if not found:
              raise SystemExit("❌ iLovePDF: load command do blatant não localizado")

          exe.write_bytes(raw)

          # O audit 4.0.4 mostrou que todos os frameworks Mach-O do app
          # passam por reassinatura. Fazemos isso por descoberta, sem perfil
          # de versão, para manter a rota compatível com atualizações.
          resigned = 0
          for framework in sorted(frameworks.glob("*.framework")):
              plist_path = framework / "Info.plist"
              executable_name = framework.stem

              if plist_path.is_file():
                  try:
                      with plist_path.open("rb") as f:
                          framework_info = plistlib.load(f)
                      executable_name = (
                          framework_info.get("CFBundleExecutable")
                          or executable_name
                      )
                  except Exception:
                      pass

              binary = framework / executable_name
              if not binary.is_file():
                  continue

              magic = binary.read_bytes()[:4]
              if magic not in {
                  b"\xcf\xfa\xed\xfe",
                  b"\xca\xfe\xba\xbe",
                  b"\xbe\xba\xfe\xca",
              }:
                  continue

              subprocess.run(
                  [Executable.ldid, "-S", "-M", str(binary)],
                  check=True,
              )
              resigned += 1

          zero_requirements = (
              Path(Executable.install_dir)
              / "extras"
              / "zero.requirements"
          )

          sign_args = [
              Executable.ldid,
              f"-S{entitlements}",
              "-M",
              "-Cadhoc",
          ]
          if zero_requirements.is_file():
              sign_args.append(f"-Q{zero_requirements}")
          sign_args.append(str(exe))

          subprocess.run(sign_args, check=True)

          after = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          if DEP not in after:
              raise SystemExit("❌ iLovePDF: blatant não persistiu no executável")

          output = Path("Cyan_Output.ipa")
          output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(work))

          print("✅ iLovePDF: blatant aplicado na segunda etapa")
          print("✅ iLovePDF: timestamp 2 aplicado no load do blatant")
          print(f"✅ iLovePDF: {resigned} framework(s) Mach-O reassinado(s)")
          print("ℹ️ iLovePDF: rota estrutural sem trava de versão")

          shutil.rmtree(work)
          PY


