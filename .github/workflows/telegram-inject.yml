                  )

          print(
              f"✅ iLovePDF {info.get('CFBundleShortVersionString', '?')}: "
              "rota estrutural validada"
          )
          print("✅ Principal: FilePickerFix → iLovePDF → blatant")
          print(f"✅ Extensões preservadas e patchadas: {len(appex_dirs)}")
          print("✅ blatant timestamp 2 no principal e extensões")
          print("ℹ️ Sem trava de versão, hash, offset ou tamanho")

          shutil.rmtree(work)
          PY


      - name: Validate iTranslate structural 1:1 layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.outerspaceapps.itranslate' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.outerspaceapps.itranslate"
          KEYBOARD_BUNDLE_ID = "com.outerspaceapps.itranslate.keyboard"
          work = Path("itranslate_validate")

          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ iTranslate: .app final não identificado"
              )

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit(
                  "❌ iTranslate: bundle ID final inesperado"
              )

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit(
                  "❌ iTranslate: CFBundleExecutable ausente"
              )

          exe = app / exe_name
          frameworks = app / "Frameworks"

          required = (
              frameworks / "CachefixPatch.dylib",
              frameworks / "iTranslateTranslator.dylib",
              frameworks / "blatantsPatch.dylib",
              (
                  frameworks
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              ),
          )
          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ iTranslate: componente obrigatório ausente: {path}"
                  )

          def deps(path):
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              result = []
              for raw_line in proc.stdout.splitlines()[1:]:
                  line = raw_line.strip()
                  marker = " (compatibility version "
                  if marker in line:
                      line = line.split(marker, 1)[0]
                  if line.startswith(("/", "@")):
                      result.append(line)
              return result

          def load_text(path):
              return subprocess.run(
                  [Executable.otool, "-l", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout

          def assert_weak_timestamp(text, dep, timestamp, label):
              marker = f"name {dep}"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(
                      f"❌ iTranslate: {label} load ausente: {dep}"
                  )

              prefix = text[max(0, pos - 500):pos]
              if "cmd LC_LOAD_WEAK_DYLIB" not in prefix:
                  raise SystemExit(
                      f"❌ iTranslate: {label} não é weak-load: {dep}"
                  )

              nearby = text[pos:pos + 300]
              if f"time stamp {timestamp}" not in nearby:
                  raise SystemExit(
                      "❌ iTranslate: "
                      f"{label} timestamp divergente em {dep}; "
                      f"esperado {timestamp}"
                  )

          main_expected = [
              "@rpath/CachefixPatch.dylib",
              "@rpath/iTranslateTranslator.dylib",
              "@rpath/blatantsPatch.dylib",
          ]
          main_deps = deps(exe)

          positions = []
          for dep in main_expected:
              if main_deps.count(dep) != 1:
                  raise SystemExit(
                      "❌ iTranslate: load principal ausente/duplicado: "
                      f"{dep}"
                  )
              positions.append(main_deps.index(dep))

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ iTranslate: ordem principal incorreta "
                  "(CachefixPatch → iTranslateTranslator → blatant)"
              )

          main_load = load_text(exe)
          if "path @executable_path/Frameworks " not in main_load:
              raise SystemExit(
                  "❌ iTranslate: rpath Frameworks ausente no principal"
              )

          assert_weak_timestamp(
              main_load,
              "@rpath/CachefixPatch.dylib",
              0,
              "CachefixPatch",
          )
          assert_weak_timestamp(
              main_load,
              "@rpath/iTranslateTranslator.dylib",
              0,
              "iTranslateTranslator",
          )
          assert_weak_timestamp(
              main_load,
              "@rpath/blatantsPatch.dylib",
              2,
              "blatantsPatch principal",
          )

          cachefix_deps = deps(
              frameworks / "CachefixPatch.dylib"
          )
          substrate_dep = (
              "@rpath/CydiaSubstrate.framework/"
              "CydiaSubstrate"
          )
          if substrate_dep not in cachefix_deps:
              raise SystemExit(
                  "❌ iTranslate: CachefixPatch perdeu a dependência "
                  "do CydiaSubstrate"
              )

          appex_dirs = sorted(
              [
                  p
                  for root in (app / "PlugIns", app / "Extensions")
                  for p in root.glob("*.appex")
                  if p.is_dir()
              ],
              key=lambda p: str(p.relative_to(app)),
          )

          if len(appex_dirs) != 1:
              raise SystemExit(
                  "❌ iTranslate: esperado exatamente 1 teclado .appex; "
                  f"encontrado(s) {len(appex_dirs)}"
              )

          keyboard = appex_dirs[0]
          with (keyboard / "Info.plist").open("rb") as f:
              keyboard_info = plistlib.load(f)

          if keyboard_info.get("CFBundleIdentifier") != KEYBOARD_BUNDLE_ID:
              raise SystemExit(
                  "❌ iTranslate: extensão preservada não é "
                  "iTranslateKeyboard"
              )

          keyboard_exe_name = keyboard_info.get("CFBundleExecutable")
          if not keyboard_exe_name:
              raise SystemExit(
                  "❌ iTranslate: CFBundleExecutable do teclado ausente"
              )

          keyboard_exe = keyboard / keyboard_exe_name
          keyboard_deps = deps(keyboard_exe)

          if keyboard_deps.count("@rpath/blatantsPatch.dylib") != 1:
              raise SystemExit(
                  "❌ iTranslate: teclado sem exatamente um "
                  "blatantsPatch"
              )

          for forbidden in (
              "@rpath/CachefixPatch.dylib",
              "@rpath/iTranslateTranslator.dylib",
          ):
              if forbidden in keyboard_deps:
                  raise SystemExit(
                      "❌ iTranslate: teclado recebeu dylib indevido: "
                      f"{forbidden}"
                  )

          keyboard_load = load_text(keyboard_exe)
          if "path @executable_path/../../Frameworks " not in keyboard_load:
              raise SystemExit(
                  "❌ iTranslate: rpath compartilhado ausente no teclado"
              )

          assert_weak_timestamp(
              keyboard_load,
              "@rpath/blatantsPatch.dylib",
              2,
              "blatantsPatch do teclado",
          )

          # A referência funcional não usa zxPluginsInject/ipapatch.
          for dep in keyboard_deps:
              if "zxPluginsInject" in dep:
                  raise SystemExit(
                      "❌ iTranslate: zxPluginsInject apareceu no teclado; "
                      "a referência funcional não usa IPA Patch"
                  )

          print(
              f"✅ iTranslate {info.get('CFBundleShortVersionString', '?')}: "
              "rota 1:1 estrutural validada"
          )
          print(
              "✅ Principal: CachefixPatch(0) → "
              "iTranslateTranslator(0) → blatant(2)"
          )
          print(
              "✅ Teclado preservado: somente blatant(2)"
          )
          print(
              "✅ CydiaSubstrate presente para CachefixPatch"
          )
          print(
              "✅ Sem zxPluginsInject / IPA Patch"
          )

          shutil.rmtree(work)
          PY

      - name: Validate Aloha structural layout before V5
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.alohabrowser.alohabrowser' }}
        run: |
          python <<'PY'
          import importlib.util
          import plistlib
          import sys
          import shutil
          import struct
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.alohabrowser.alohabrowser"
          DEP = "@rpath/blatantsPatch.dylib"
          work = Path("aloha_pre_v5_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ Aloha: .app final não identificado"
              )

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit(
                  "❌ Aloha: bundle ID final inesperado"
              )

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit(
                  "❌ Aloha: CFBundleExecutable ausente"
              )

          exe = app / exe_name
          frameworks = app / "Frameworks"

          required = (
              frameworks / "CachefixPatch.dylib",
              frameworks / "AlohaBrowserPrivateVPNPatch.dylib",
              frameworks / "blatantsPatch.dylib",
              (
                  frameworks
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              ),
          )
          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Aloha: componente obrigatório ausente: {path}"
                  )

          def dependencies(path: Path) -> list[str]:
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              result = []
              for raw_line in proc.stdout.splitlines()[1:]:
                  line = raw_line.strip()
                  marker = " (compatibility version "
                  if marker in line:
                      line = line.split(marker, 1)[0]
                  if line.startswith(("/", "@")):
                      result.append(line)
              return result

          def parse_macho(path: Path):
              raw = path.read_bytes()
              if len(raw) < 32 or struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF:
                  raise SystemExit(
                      f"❌ Aloha: Mach-O inesperado: {path}"
                  )

              ncmds = struct.unpack_from("<I", raw, 16)[0]
              offset = 32
              loads = []
              rpaths = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      raw,
                      offset,
                  )

                  if cmd in {
                      0xC,
                      0x80000018,
                  }:
                      name_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      timestamp = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 12,
                      )[0]
                      start = offset + name_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize
                      loads.append(
                          (
                              cmd,
                              raw[start:end].decode(
                                  "utf-8",
                                  errors="replace",
                              ),
                              timestamp,
                          )
                      )

                  elif cmd == 0x8000001C:
                      path_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      start = offset + path_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize
                      rpaths.append(
                          raw[start:end].decode(
                              "utf-8",
                              errors="replace",
                          )
                      )

                  offset += cmdsize

              return loads, rpaths

          main_deps = dependencies(exe)
          expected_order = [
              "@rpath/CachefixPatch.dylib",
              "@rpath/AlohaBrowserPrivateVPNPatch.dylib",
              DEP,
          ]
          positions = []
          for dep in expected_order:
              if main_deps.count(dep) != 1:
                  raise SystemExit(
                      "❌ Aloha: load principal ausente/duplicado: "
                      f"{dep}"
                  )
              positions.append(main_deps.index(dep))

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Aloha: ordem principal incorreta "
                  "(CachefixPatch → AlohaBrowserPrivateVPNPatch → blatant)"
              )

          main_loads, main_rpaths = parse_macho(exe)
          expected_main_loads = {
              "@rpath/CachefixPatch.dylib": (
                  0x80000018,
                  0,
              ),
              "@rpath/AlohaBrowserPrivateVPNPatch.dylib": (
                  0x80000018,
                  0,
              ),
              DEP: (
                  0xC,
                  2,
              ),
          }

          for dep, expected in expected_main_loads.items():
              matches = [
                  (cmd, timestamp)
                  for cmd, name, timestamp in main_loads
                  if name == dep
              ]
              if matches != [expected]:
                  raise SystemExit(
                      f"❌ Aloha: load principal divergente em {dep}: "
                      f"{matches}; esperado {[expected]}"
                  )

          if "@executable_path/Frameworks" not in main_rpaths:
              raise SystemExit(
                  "❌ Aloha: rpath Frameworks ausente no principal"
              )

          cachefix_deps = dependencies(
              frameworks / "CachefixPatch.dylib"
          )
          substrate_dep = (
              "@rpath/CydiaSubstrate.framework/"
              "CydiaSubstrate"
          )
          if substrate_dep not in cachefix_deps:
              raise SystemExit(
                  "❌ Aloha: CachefixPatch perdeu a dependência "
                  "do CydiaSubstrate"
              )

          appex_dirs = sorted(
              [
                  p
                  for root in (
                      app / "PlugIns",
                      app / "Extensions",
                  )
                  for p in root.glob("*.appex")
                  if p.is_dir()
              ],
              key=lambda p: str(p.relative_to(app)),
          )

          if not appex_dirs:
              raise SystemExit(
                  "❌ Aloha: nenhuma extensão preservada"
              )

          expected_rpaths = {
              "/usr/lib/swift",
              "@executable_path/Frameworks",
              "@executable_path/../../Frameworks",
              "@executable_path/../Frameworks",
          }

          for appex in appex_dirs:
              with (appex / "Info.plist").open("rb") as f:
                  appex_info = plistlib.load(f)

              bundle_id = appex_info.get("CFBundleIdentifier")
              if not bundle_id:
                  raise SystemExit(
                      f"❌ Aloha: bundle ID ausente em {appex.name}"
                  )

              appex_exe_name = appex_info.get("CFBundleExecutable")
              if not appex_exe_name:
                  raise SystemExit(
                      f"❌ Aloha: CFBundleExecutable ausente em {appex.name}"
                  )

              appex_exe = appex / appex_exe_name
              appex_deps = dependencies(appex_exe)

              if appex_deps.count(DEP) != 1:
                  raise SystemExit(
                      f"❌ Aloha: {appex.name} sem exatamente um blatant"
                  )

              for forbidden in (
                  "@rpath/CachefixPatch.dylib",
                  "@rpath/AlohaBrowserPrivateVPNPatch.dylib",
              ):
                  if forbidden in appex_deps:
                      raise SystemExit(
                          f"❌ Aloha: {appex.name} recebeu dylib indevido: "
                          f"{forbidden}"
                      )

              loads, appex_rpaths = parse_macho(appex_exe)
              blatant_matches = [
                  (cmd, timestamp)
                  for cmd, name, timestamp in loads
                  if name == DEP
              ]
              if blatant_matches != [
                  (
                      0xC,
                      2,
                  )
              ]:
                  raise SystemExit(
                      f"❌ Aloha: blatant de {appex.name} divergiu: "
                      f"{blatant_matches}"
                  )

              missing_rpaths = expected_rpaths.difference(
                  set(appex_rpaths)
              )
              if missing_rpaths:
                  raise SystemExit(
                      f"❌ Aloha: rpath(s) ausente(s) em {appex.name}: "
                      f"{sorted(missing_rpaths)}"
                  )

          # Garante que a dylib ainda está no estado pré-V5.
          spec = importlib.util.spec_from_file_location(
              "private_postprocess",
              "private-core/scripts/postprocess.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ Aloha: não foi possível carregar postprocess.py"
              )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          candidate = module.find_v5_candidate(
              (
                  frameworks
                  / "AlohaBrowserPrivateVPNPatch.dylib"
              ).read_bytes()
          )

          if candidate.view_did_load.imp == candidate.dismiss_callback.imp:
              raise SystemExit(
                  "❌ Aloha: V5 foi aplicado antes da hora"
              )

          print(
              f"✅ Aloha {info.get('CFBundleShortVersionString', '?')}: "
              "layout funcional pré-V5 validado"
          )
          print(
              "✅ Principal: CachefixPatch weak(0) → "
              "AlohaBrowserPrivateVPNPatch weak(0) → blatant normal(2)"
          )
          print(
              f"✅ {len(appex_dirs)} extensão(ões) preservada(s) "
              "com blatant normal(2)"
          )
          print(
              "✅ V5 confirmado como pendente até o Final.ipa"
          )
          print(
              "ℹ️ Aloha: validação estrutural sem trava de versão/hash/offset"
          )

          shutil.rmtree(work)
          PY

