          for dylib_name in dylibs:
              source = (
                  app
                  / "Frameworks"
                  / dylib_name
              )

              destination = (
                  app
                  / dylib_name
              )

              if source.exists():
                  if destination.exists():
                      destination.unlink()

                  shutil.move(
                      source,
                      destination,
                  )

                  print(
                      f"✅ Frameworks/{dylib_name} -> raiz"
                  )

              elif destination.exists():
                  print(
                      f"ℹ️ {dylib_name} já está na raiz"
                  )

              else:
                  raise SystemExit(
                      f"❌ {dylib_name} não encontrado"
                  )

              old_load = (
                  f"@rpath/{dylib_name}"
              )

              new_load = (
                  f"@executable_path/{dylib_name}"
              )

              executable.change_dependency(
                  old_load,
                  new_load,
              )

              print(
                  f"✅ {old_load} -> {new_load}"
              )

          if bundle_id == "com.facebook.Messenger":
              messenger_dylibs = [
                  "Sideload Keychain Fix.dylib",
                  "MSGPlusX.dylib",
                  "MessengerEnhancements.dylib",
              ]

              def messenger_dependencies():
                  proc = subprocess.run(
                      [
                          Executable.otool,
                          "-L",
                          str(executable_path),
                      ],
                      capture_output=True,
                      text=True,
                      check=True,
                  )

                  dependencies = []

                  for raw_line in proc.stdout.splitlines():
                      line = raw_line.strip()

                      if not line:
                          continue

                      if line.endswith(":"):
                          continue

                      if line.startswith(
                          "(architecture "
                      ):
                          continue

                      marker = " (compatibility version "

                      if marker in line:
                          dependency = line.split(
                              marker,
                              1,
                          )[0]
                      else:
                          dependency = line

                      dependency = dependency.strip()

                      if dependency.startswith(
                          (
                              "/Library/",
                              "/usr/lib/",
                              "@",
                          )
                      ):
                          dependencies.append(
                              dependency
                          )

                  return dependencies

              executable.remove_signature()

              for dylib_name in messenger_dylibs:
                  dylib_path = (
                      app
                      / "Frameworks"
                      / dylib_name
                  )

                  if not dylib_path.is_file():
                      raise SystemExit(
                          "❌ Dylib do Messenger ausente: "
                          f"Frameworks/{dylib_name}"
                      )

                  new_load = (
                      "@executable_path/Frameworks/"
                      f"{dylib_name}"
                  )

                  dependencies = (
                      messenger_dependencies()
                  )

                  if new_load in dependencies:
                      print(
                          f"ℹ️ {dylib_name} já usa "
                          "o caminho oficial"
                      )
                      continue

                  candidates = [
                      dependency
                      for dependency in dependencies
                      if (
                          dependency == dylib_name
                          or dependency.endswith(
                              "/" + dylib_name
                          )
                      )
                  ]

                  if not candidates:
                      print(
                          "❌ Dependências reais do "
                          "executável principal:"
                      )

                      for dependency in dependencies:
                          print(
                              f"   • {dependency}"
                          )

                      raise SystemExit(
                          "❌ Nenhum load command real "
                          f"encontrado para {dylib_name}"
                      )

                  if len(candidates) > 1:
                      print(
                          "❌ Mais de um load command "
                          f"encontrado para {dylib_name}:"
                      )

                      for candidate in candidates:
                          print(
                              f"   • {candidate}"
                          )

                      raise SystemExit(
                          "❌ Load command ambíguo para "
                          f"{dylib_name}"
                      )

                  old_load = candidates[0]

                  executable.change_dependency(
                      old_load,
                      new_load,
                  )

                  print(
                      f"✅ {old_load} -> {new_load}"
                  )

              final_dependencies = (
                  messenger_dependencies()
              )

              for dylib_name in messenger_dylibs:
                  expected = (
                      "@executable_path/Frameworks/"
                      f"{dylib_name}"
                  )

                  if expected not in final_dependencies:
                      raise SystemExit(
                          "❌ Normalização não persistiu: "
                          f"{expected}"
                      )

              substrate = (
                  app
                  / "Frameworks"
                  / "CydiaSubstrate.framework"
                  / "CydiaSubstrate"
              )

              if not substrate.is_file():
                  raise SystemExit(
                      "❌ CydiaSubstrate.framework não foi "
                      "adicionado pelo Cyan"
                  )

              print(
                  "✅ 3 load commands do Messenger "
                  "normalizados via otool"
              )
              print(
                  "✅ Messenger segue o layout oficial "
                  "do MSGPlusX"
              )

          output = Path(
              "Layout_Output.ipa"
          )

          if output.exists():
              output.unlink()

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(work),
                      )

          print(
              "✅ Layout das dylibs concluído"
          )
          PY

      - name: Facetune - validate structural layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.lightricks.Facetune2' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("facetune_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  "❌ Facetune: .app final não identificado"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.lightricks.Facetune2":
              raise SystemExit(
                  "❌ Facetune: bundle ID final inesperado"
              )

          executable_name = info.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit(
                  "❌ Facetune: CFBundleExecutable ausente"
              )

          exe = app / executable_name
          if not exe.is_file():
              raise SystemExit(
                  "❌ Facetune: executável principal ausente"
              )

          frameworks = app / "Frameworks"

          required = [
              "sideloadKeychainfix.dylib",
              "Facetune.dylib",
              "blatantsPatch.dylib",
          ]

          for name in required:
              path = frameworks / name
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Facetune: Frameworks/{name} ausente"
                  )

          # A rota atual do Facetune usa Cyan -e. A validação confere apenas
          # a consequência estrutural dessa escolha; não depende da quantidade
          # de extensões que uma determinada versão possuía originalmente.
          appex = sorted(
              p.relative_to(app).as_posix()
              for p in app.rglob("*.appex")
          )
          if appex:
              raise SystemExit(
                  "❌ Facetune: extensões ainda presentes após Cyan -e: "
                  + ", ".join(appex)
              )

          entitlements = app / "cyan.entitlements"
          if not entitlements.is_file():
              raise SystemExit(
                  "❌ Facetune: cyan.entitlements ausente"
              )

          proc = subprocess.run(
              [Executable.otool, "-L", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          )

          deps = []
          for raw in proc.stdout.splitlines():
              line = raw.strip()

              if (
                  not line
                  or line.endswith(":")
                  or line.startswith("(architecture ")
              ):
                  continue

              marker = " (compatibility version "
              dep = (
                  line.split(marker, 1)[0].strip()
                  if marker in line
                  else line
              )

              if dep.startswith(
                  ("/Library/", "/usr/lib/", "@")
              ):
                  deps.append(dep)

          expected = [
              "@rpath/sideloadKeychainfix.dylib",
              "@rpath/Facetune.dylib",
              "@rpath/blatantsPatch.dylib",
          ]

          positions = []
          for dep in expected:
              if deps.count(dep) != 1:
                  raise SystemExit(
                      "❌ Facetune: load command ausente ou duplicado: "
                      f"{dep}"
                  )

              positions.append(
                  deps.index(dep)
              )

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Facetune: ordem dos dylibs incorreta "
                  "(sideloadKeychainfix → Facetune → blatantsPatch)"
              )

          proc = subprocess.run(
              [Executable.otool, "-l", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          )
          load_text = proc.stdout

          for dep in expected:
              idx = load_text.find(dep)

              if idx < 0:
                  raise SystemExit(
                      f"❌ Facetune: load command não encontrado: {dep}"
                  )

              prefix = load_text[
                  max(0, idx - 500):idx
              ]

              if "cmd LC_LOAD_WEAK_DYLIB" not in prefix:
                  raise SystemExit(
                      f"❌ Facetune: {dep} não é LC_LOAD_WEAK_DYLIB"
                  )

          rpaths = [
              line.strip()
              .split("path ", 1)[1]
              .split(" (offset", 1)[0]
              for line in load_text.splitlines()
              if line.strip().startswith("path ")
          ]

          if "@executable_path/Frameworks" not in rpaths:
              raise SystemExit(
                  "❌ Facetune: @executable_path/Frameworks ausente"
              )

          # Sanidade da assinatura final: exige LC_CODE_SIGNATURE válido,
          # mas não compara offsets/tamanhos com qualquer versão específica.
          signature_dataoff = None
          signature_datasize = None

          load_lines = load_text.splitlines()
          for index, line in enumerate(load_lines):
              if line.strip() != "cmd LC_CODE_SIGNATURE":
                  continue

              for candidate in load_lines[
                  index:index + 12
              ]:
                  stripped = candidate.strip()

                  if stripped.startswith("dataoff "):
                      signature_dataoff = int(
                          stripped.split()[1]
                      )

                  if stripped.startswith("datasize "):
                      signature_datasize = int(
                          stripped.split()[1]
                      )

              break

          if (
              signature_dataoff is None
              or signature_datasize is None
              or signature_datasize <= 0
          ):
              raise SystemExit(
                  "❌ Facetune: LC_CODE_SIGNATURE final inválido ou ausente"
              )

          file_size = exe.stat().st_size
          if (
              signature_dataoff < 0
              or signature_dataoff >= file_size
              or signature_dataoff + signature_datasize > file_size
          ):
              raise SystemExit(
                  "❌ Facetune: área LC_CODE_SIGNATURE está fora "
                  f"do executável ({signature_dataoff}+"
                  f"{signature_datasize}>{file_size})"
              )

          version = str(
              info.get("CFBundleShortVersionString")
              or "?"
          )

          print(
              f"✅ Facetune {version}: rota estrutural validada"
          )
          print(
              "✅ Facetune: 3 dylibs presentes e em weak-load"
          )
          print(
              "✅ Facetune: ordem sideloadKeychainfix → Facetune → blatant"
          )
          print(
              "✅ Facetune: extensões removidas"
          )
          print(
              "✅ Facetune: assinatura final estruturalmente válida"
          )
          print(
              "ℹ️ Facetune: sem hashes, offsets ou tamanhos "
              "específicos de versão"
          )

          shutil.rmtree(work)
          PY

      - name: Documents / PDF Expert / Duolingo / InShot / Picsart / Media Converter / Photoleap / iLovePDF / iTranslate - inject blatantsPatch into extensions
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && (steps.prepare.outputs.bundle_id == 'com.readdle.ReaddleDocsIPad' || steps.prepare.outputs.bundle_id == 'com.readdle.PDFExpert5' || steps.prepare.outputs.bundle_id == 'com.duolingo.DuolingoMobile' || steps.prepare.outputs.bundle_id == 'com.camerasideas.InstaShot' || steps.prepare.outputs.bundle_id == 'com.picsart.studio' || steps.prepare.outputs.bundle_id == 'com.verycoolapp.mediaconvert' || steps.prepare.outputs.bundle_id == 'com.lightricks.Enlight-Editor' || steps.prepare.outputs.bundle_id == 'com.ilovepdf.www' || steps.prepare.outputs.bundle_id == 'com.outerspaceapps.itranslate') }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import struct
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable
          from cyan.tbhtypes.main_executable import MainExecutable

          profiles = {
              "com.readdle.ReaddleDocsIPad": {
                  "name": "Documents",
                  "required_paths": (
                      "Frameworks/FilePickerFix.dylib",
                      "Frameworks/Documents.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.readdle.PDFExpert5": {
                  "name": "PDF Expert",
                  "required_paths": (
                      "Frameworks/FilePickerFix.dylib",
                      "Frameworks/PDFExpert.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.duolingo.DuolingoMobile": {
                  "name": "Duolingo",
                  "required_paths": (
                      "CachefixPatch.dylib",
                      "Duolingo.dylib",
                      "Frameworks/blatantsPatch.dylib",
                      "Frameworks/CydiaSubstrate.framework/CydiaSubstrate",
                  ),
              },
              "com.camerasideas.InstaShot": {
                  "name": "InShot",
                  "required_paths": (
                      "Frameworks/InShot.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.picsart.studio": {
                  "name": "Picsart",
                  "required_paths": (
                      "Frameworks/sideloadKeychainfix.dylib",
                      "Frameworks/Picsart.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.verycoolapp.mediaconvert": {
                  "name": "Media Converter",
                  "required_paths": (
                      "Frameworks/MediaConverter.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.lightricks.Enlight-Editor": {
                  "name": "Photoleap",
                  "required_paths": (
                      "Frameworks/sideloadKeychainfix.dylib",
                      "Frameworks/Photoleap.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.ilovepdf.www": {
                  "name": "iLovePDF",
                  "required_paths": (
                      "Frameworks/FilePickerFix.dylib",
                      "Frameworks/iLovePDF.dylib",
                      "Frameworks/blatantsPatch.dylib",
                  ),
              },
              "com.outerspaceapps.itranslate": {
                  "name": "iTranslate",
                  "required_paths": (
                      "Frameworks/CachefixPatch.dylib",
                      "Frameworks/iTranslateTranslator.dylib",
                      "Frameworks/blatantsPatch.dylib",
                      "Frameworks/CydiaSubstrate.framework/CydiaSubstrate",
                  ),
              },
          }

          source_ipa = Path("Layout_Output.ipa")
          work = Path("blatant_extensions_work")
          output_ipa = Path("Blatant_Extensions_Output.ipa")

          if not source_ipa.is_file():
              raise SystemExit(
                  "❌ Layout_Output.ipa não encontrado"
              )

          if work.exists():
              shutil.rmtree(work)

          if output_ipa.exists():
              output_ipa.unlink()

          work.mkdir()

          with zipfile.ZipFile(source_ipa, "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 .app principal; encontrei {len(apps)}"
              )

          app = apps[0]
          app_plist_path = app / "Info.plist"

          with open(app_plist_path, "rb") as f:
              app_plist = plistlib.load(f)

          bundle_id = app_plist.get("CFBundleIdentifier")
          profile = profiles.get(bundle_id)

          if profile is None:
              raise SystemExit(
                  "❌ Etapa blatantsPatch acionada para Bundle ID incorreto: "
                  f"{bundle_id}"
              )

          app_name = profile["name"]

          for relative_path in profile["required_paths"]:
              required = app / relative_path

              if not required.is_file():
                  raise SystemExit(
                      f"❌ Componente obrigatório do {app_name} ausente: "
                      f"{relative_path}"
                  )

          extension_roots = (
              app / "PlugIns",
              app / "Extensions",
          )
          appex_dirs = sorted(
              (
                  path
                  for root in extension_roots
                  for path in root.glob("*.appex")
                  if path.is_dir()
              ),
              key=lambda path: str(path.relative_to(app)),
          )

          if not appex_dirs:
              raise SystemExit(
                  f"❌ Nenhuma extensão .appex encontrada no {app_name}"
              )

          expected_load = "@rpath/blatantsPatch.dylib"
          shared_rpath = "@executable_path/../../Frameworks"
          patched = 0
          already_patched = 0

          def dependencies(executable_path: Path) -> list[str]:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-L",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              result = []

              for raw_line in proc.stdout.splitlines()[1:]:
                  line = raw_line.strip()

                  if not line:
                      continue

                  marker = " (compatibility version "

                  if marker in line:
                      line = line.split(marker, 1)[0]

                  if line.startswith(
                      (
                          "/",
                          "@",
                      )
                  ):
                      result.append(line)

              return result

          def has_shared_rpath(executable_path: Path) -> bool:
              proc = subprocess.run(
                  [
                      Executable.otool,
                      "-l",
                      str(executable_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              return (
                  f"path {shared_rpath} "
                  in proc.stdout
              )

          for appex in appex_dirs:
              plist_path = appex / "Info.plist"

              if not plist_path.is_file():
                  raise SystemExit(
                      f"❌ Info.plist ausente em {appex.name}"
                  )

              with open(plist_path, "rb") as f:
                  plist = plistlib.load(f)

              executable_name = plist.get("CFBundleExecutable")

              if not executable_name:
                  raise SystemExit(
                      f"❌ CFBundleExecutable ausente em {appex.name}"
                  )

              executable_path = appex / executable_name

              if not executable_path.is_file():
                  raise SystemExit(
                      "❌ Executável da extensão não encontrado: "
                      f"{appex.name}/{executable_name}"
                  )

              current_dependencies = dependencies(executable_path)

              if (
                  expected_load in current_dependencies
                  and has_shared_rpath(executable_path)
              ):
                  already_patched += 1
                  print(
                      f"ℹ️ {appex.name}: blatantsPatch já configurado"
                  )
                  continue

              executable = MainExecutable(
                  str(executable_path),
                  str(appex),
              )

              executable.remove_signature()

              if not has_shared_rpath(executable_path):
                  result = subprocess.run(
                      [
                          Executable.nt,
                          "-add_rpath",
                          shared_rpath,
                          str(executable_path),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          "❌ Falha ao adicionar rpath em "
                          f"{appex.name}: {result.stderr.strip()}"
                      )

              current_dependencies = dependencies(executable_path)

              if expected_load not in current_dependencies:
                  executable.inj_func(expected_load)

                  if executable.inj is not None:
                      executable.inj.write(
                          str(executable_path)
                      )

              final_dependencies = dependencies(executable_path)

              if expected_load not in final_dependencies:
                  raise SystemExit(
                      "❌ Injeção não persistiu em "
                      f"{appex.name}: {expected_load}"
                  )

              if bundle_id in {
                  "com.ilovepdf.www",
                  "com.outerspaceapps.itranslate",
              }:
                  raw_binary = bytearray(executable_path.read_bytes())
                  if struct.unpack_from("<I", raw_binary, 0)[0] != 0xFEEDFACF:
                      raise SystemExit(
                          f"❌ {app_name}: Mach-O inesperado em {appex.name}"
                      )

                  ncmds = struct.unpack_from("<I", raw_binary, 16)[0]
                  cmd_offset = 32
                  timestamp_patched = False

                  for _ in range(ncmds):
                      cmd, cmdsize = struct.unpack_from(
                          "<II",
                          raw_binary,
                          cmd_offset,
                      )
                      if cmd == 0x80000018:
                          name_offset = struct.unpack_from(
                              "<I",
                              raw_binary,
                              cmd_offset + 8,
                          )[0]
                          string_start = cmd_offset + name_offset
                          string_end = raw_binary.find(
                              b"\0",
                              string_start,
                              cmd_offset + cmdsize,
                          )
                          if string_end < 0:
                              string_end = cmd_offset + cmdsize

                          dylib_name = raw_binary[
                              string_start:string_end
                          ].decode("utf-8", errors="replace")

                          if dylib_name == expected_load:
                              struct.pack_into(
                                  "<I",
                                  raw_binary,
                                  cmd_offset + 12,
                                  2,
                              )
                              timestamp_patched = True

                      cmd_offset += cmdsize

                  if not timestamp_patched:
                      raise SystemExit(
                          f"❌ {app_name}: timestamp do blatant não localizado em {appex.name}"
                      )

                  executable_path.write_bytes(raw_binary)

              if not has_shared_rpath(executable_path):
                  raise SystemExit(
                      "❌ RPATH compartilhado não persistiu em "
                      f"{appex.name}: {shared_rpath}"
                  )

              patched += 1
              print(
                  f"✅ {appex.name}: {expected_load}"
              )

          with zipfile.ZipFile(
              output_ipa,
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as z:
              for file in work.rglob("*"):
                  if file.is_file():
                      z.write(
                          file,
                          file.relative_to(work),
                      )

          if not output_ipa.is_file():
              raise SystemExit(
                  "❌ Blatant_Extensions_Output.ipa não foi gerado"
              )

          shutil.move(
              output_ipa,
              source_ipa,
          )

          print()
          print(
              f"✅ {app_name}: blatantsPatch aplicado às extensões"
          )
          print(
              f"✅ Extensões encontradas: {len(appex_dirs)}"
          )
          print(
              f"✅ Modificadas nesta execução: {patched}"
          )
          print(
              f"ℹ️ Já configuradas: {already_patched}"
          )
          PY

      - name: Validate iLovePDF structural layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.ilovepdf.www' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("ilovepdf_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit("❌ iLovePDF: .app final não identificado")

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.ilovepdf.www":
              raise SystemExit("❌ iLovePDF: bundle ID final inesperado")

          exe_name = info.get("CFBundleExecutable")
          if not exe_name:
              raise SystemExit("❌ iLovePDF: CFBundleExecutable ausente")

          exe = app / exe_name
          frameworks = app / "Frameworks"

          for name in (
              "FilePickerFix.dylib",
              "iLovePDF.dylib",
              "blatantsPatch.dylib",
          ):
              if not (frameworks / name).is_file():
                  raise SystemExit(
                      f"❌ iLovePDF: Frameworks/{name} ausente"
                  )

          def deps(path):
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              result = []
              for raw_line in proc.stdout.splitlines()[1:]:
                  line = raw_line.strip()
                  marker = " (compatibility version "
                  if marker in line:
                      line = line.split(marker, 1)[0]
                  if line.startswith(("/", "@")):
                      result.append(line)
              return result

          main_expected = [
              "@rpath/FilePickerFix.dylib",
              "@rpath/iLovePDF.dylib",
              "@rpath/blatantsPatch.dylib",
          ]
          main_deps = deps(exe)

          positions = []
          for dep in main_expected:
              if main_deps.count(dep) != 1:
                  raise SystemExit(
                      f"❌ iLovePDF: load principal ausente/duplicado: {dep}"
                  )
              positions.append(main_deps.index(dep))

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ iLovePDF: ordem principal incorreta "
                  "(FilePickerFix → iLovePDF → blatant)"
              )

          load_text = subprocess.run(
              [Executable.otool, "-l", str(exe)],
              capture_output=True,
              text=True,
              check=True,
          ).stdout

          for dep in main_expected:
              pos = load_text.find(dep)
              if pos < 0:
                  raise SystemExit(f"❌ iLovePDF: load não encontrado: {dep}")
              prefix = load_text[max(0, pos - 500):pos]
              if "cmd LC_LOAD_WEAK_DYLIB" not in prefix:
                  raise SystemExit(f"❌ iLovePDF: {dep} não é weak-load")

          blatant_pos = load_text.find("name @rpath/blatantsPatch.dylib")
