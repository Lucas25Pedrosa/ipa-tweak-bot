                          "<I",
                          raw,
                          offset + 12,
                      )[0]
                      start = offset + name_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize

                      loads.append(
                          (
                              cmd,
                              raw[start:end].decode(
                                  "utf-8",
                                  errors="replace",
                              ),
                              timestamp,
                          )
                      )

                  elif cmd == 0x8000001C:
                      path_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      start = offset + path_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize
                      rpaths.append(
                          raw[start:end].decode(
                              "utf-8",
                              errors="replace",
                          )
                      )

                  offset += cmdsize

              return loads, rpaths

          main_deps = dependencies(exe)
          positions = []

          for dep in EXPECTED_LOADS:
              if main_deps.count(dep) != 1:
                  raise SystemExit(
                      "❌ BoldVoice: load principal ausente/duplicado: "
                      f"{dep}"
                  )
              positions.append(main_deps.index(dep))

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ BoldVoice: ordem dos 7 dylibs divergiu da funcional"
              )

          main_loads, main_rpaths = parse_macho(exe)

          for dep in EXPECTED_LOADS:
              matches = [
                  (cmd, timestamp)
                  for cmd, name, timestamp in main_loads
                  if name == dep
              ]
              if matches != [
                  (
                      0x80000018,
                      0,
                  )
              ]:
                  raise SystemExit(
                      f"❌ BoldVoice: load divergente em {dep}: "
                      f"{matches}; esperado weak(0)"
                  )

          if "@executable_path/Frameworks" not in main_rpaths:
              raise SystemExit(
                  "❌ BoldVoice: rpath Frameworks ausente no principal"
              )

          # Compara estruturalmente as extensões da clean com a saída:
          # todas devem ser preservadas e nenhuma recebe os 7 dylibs.
          def appex_map(root_app: Path) -> dict[str, Path]:
              result = {}
              for base_name in ("PlugIns", "Extensions"):
                  base = root_app / base_name
                  if not base.is_dir():
                      continue
                  for appex in sorted(base.glob("*.appex")):
                      plist_path = appex / "Info.plist"
                      if not plist_path.is_file():
                          continue
                      with plist_path.open("rb") as f:
                          ext_info = plistlib.load(f)
                      bid = str(
                          ext_info.get("CFBundleIdentifier")
                          or ""
                      ).strip()
                      if bid:
                          result[bid] = appex
              return result

          input_exts = appex_map(input_app)
          output_exts = appex_map(app)

          if set(input_exts) != set(output_exts):
              raise SystemExit(
                  "❌ BoldVoice: conjunto de extensões divergiu da clean: "
                  f"input={sorted(input_exts)} "
                  f"output={sorted(output_exts)}"
              )

          if not output_exts:
              raise SystemExit(
                  "❌ BoldVoice: nenhuma extensão preservada"
              )

          for bid, appex in output_exts.items():
              with (appex / "Info.plist").open("rb") as f:
                  ext_info = plistlib.load(f)

              ext_exe_name = ext_info.get("CFBundleExecutable")
              if not ext_exe_name:
                  raise SystemExit(
                      f"❌ BoldVoice: executável ausente em {bid}"
                  )

              ext_exe = appex / ext_exe_name
              ext_deps = dependencies(ext_exe)

              leaked = [
                  dep
                  for dep in EXPECTED_LOADS
                  if dep in ext_deps
              ]
              if leaked:
                  raise SystemExit(
                      f"❌ BoldVoice: extensão {bid} recebeu dylib indevida: "
                      f"{leaked}"
                  )

          # Confirma que o patch estrutural existe mas ainda não foi aplicado.
          spec = importlib.util.spec_from_file_location(
              "private_postprocess_boldvoice_pre",
              "private-core/scripts/postprocess.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ BoldVoice: não foi possível carregar postprocess.py"
              )

          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          candidate = module.find_v5_candidate(
              (frameworks / PATCH_NAME).read_bytes()
          )

          if candidate.view_did_load.imp == candidate.dismiss_callback.imp:
              raise SystemExit(
                  "❌ BoldVoice: V5 foi aplicado antes do Final.ipa"
              )

          print(
              f"✅ BoldVoice {info.get('CFBundleShortVersionString', '?')}: "
              "layout funcional pré-V5 validado"
          )
          print(
              "✅ Principal: 7 dylibs weak(0) na ordem 1:1"
          )
          print(
              f"✅ {len(output_exts)} extensão(ões) preservada(s), "
              "sem injeção"
          )
          print(
              "✅ CydiaSubstrate.framework presente"
          )
          print(
              "✅ V5 confirmado como pendente até o Final.ipa"
          )
          print(
              "ℹ️ BoldVoice: validação estrutural sem trava de versão/hash/offset"
          )

          shutil.rmtree(work)
          shutil.rmtree(input_work)
          PY

      - name: Validate CamScanner structural layout before V5
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.intsig.CamScannerLite' }}
        run: |
          python <<'PY'
          import importlib.util
          import plistlib
          import shutil
          import struct
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          BUNDLE_ID = "com.intsig.CamScannerLite"
          EXPECTED_DYLIBS = [
              "NewFix1.dylib",
              "libpro.dylib",
              "Sideloadbypass2.dylib",
              "FixCrash.dylib",
              "Sideloadbypass1.dylib",
              "CachefixPatch.dylib",
              "NewFix2.dylib",
              "CamScannerPDFScannerAppPatch.dylib",
          ]
          EXPECTED_LOADS = [
              f"@rpath/{name}"
              for name in EXPECTED_DYLIBS
          ]
          PATCH_NAME = "CamScannerPDFScannerAppPatch.dylib"

          work = Path("camscanner_pre_v5_validate")
          input_work = Path("camscanner_input_compare")

          for path in (work, input_work):
              if path.exists():
                  shutil.rmtree(path)
              path.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          with zipfile.ZipFile("input.ipa", "r") as z:
              z.extractall(input_work)

          apps = list((work / "Payload").glob("*.app"))
          input_apps = list((input_work / "Payload").glob("*.app"))

          if len(apps) != 1 or len(input_apps) != 1:
              raise SystemExit(
                  "❌ CamScanner: .app principal não identificado"
              )

          app = apps[0]
          input_app = input_apps[0]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != BUNDLE_ID:
              raise SystemExit(
                  "❌ CamScanner: bundle ID inesperado"
              )

          executable_name = info.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit(
                  "❌ CamScanner: CFBundleExecutable ausente"
              )

          executable = app / executable_name
          frameworks = app / "Frameworks"

          if not executable.is_file():
              raise SystemExit(
                  "❌ CamScanner: executável principal ausente"
              )

          for name in EXPECTED_DYLIBS:
              if not (frameworks / name).is_file():
                  raise SystemExit(
                      f"❌ CamScanner: dylib obrigatória ausente: {name}"
                  )

          substrate = (
              frameworks
              / "CydiaSubstrate.framework"
              / "CydiaSubstrate"
          )
          if not substrate.is_file():
              raise SystemExit(
                  "❌ CamScanner: CydiaSubstrate.framework ausente"
              )

          def parse_macho(path: Path):
              raw = path.read_bytes()

              if (
                  len(raw) < 32
                  or struct.unpack_from("<I", raw, 0)[0] != 0xFEEDFACF
              ):
                  raise SystemExit(
                      f"❌ CamScanner: Mach-O inesperado: {path}"
                  )

              ncmds = struct.unpack_from("<I", raw, 16)[0]
              offset = 32
              loads = []
              rpaths = []

              for _ in range(ncmds):
                  if offset + 8 > len(raw):
                      raise SystemExit(
                          f"❌ CamScanner: load command truncado: {path}"
                      )

                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      raw,
                      offset,
                  )

                  if cmdsize < 8 or offset + cmdsize > len(raw):
                      raise SystemExit(
                          f"❌ CamScanner: cmdsize inválido: {path}"
                      )

                  if cmd in {0xC, 0x80000018}:
                      name_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      timestamp = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 12,
                      )[0]

                      start = offset + name_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize

                      loads.append(
                          (
                              cmd,
                              raw[start:end].decode(
                                  "utf-8",
                                  errors="replace",
                              ),
                              timestamp,
                          )
                      )

                  elif cmd == 0x8000001C:
                      path_offset = struct.unpack_from(
                          "<I",
                          raw,
                          offset + 8,
                      )[0]
                      start = offset + path_offset
                      end = raw.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )
                      if end < 0:
                          end = offset + cmdsize

                      rpaths.append(
                          raw[start:end].decode(
                              "utf-8",
                              errors="replace",
                          )
                      )

                  offset += cmdsize

              return loads, rpaths

          main_loads, main_rpaths = parse_macho(executable)

          positions = []
          for dep in EXPECTED_LOADS:
              matches = [
                  (index, cmd, timestamp)
                  for index, (cmd, name, timestamp)
                  in enumerate(main_loads)
                  if name == dep
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"❌ CamScanner: load ausente/duplicado: {dep}"
                  )

              index, cmd, timestamp = matches[0]
              positions.append(index)

              if cmd != 0x80000018 or timestamp != 0:
                  raise SystemExit(
                      f"❌ CamScanner: {dep} não está weak(0): "
                      f"cmd=0x{cmd:x}, timestamp={timestamp}"
                  )

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ CamScanner: ordem dos 8 dylibs divergiu da funcional"
              )

          if "@executable_path/Frameworks" not in main_rpaths:
              raise SystemExit(
                  "❌ CamScanner: @executable_path/Frameworks ausente"
              )

          # A IPA funcional não preserva nenhuma extensão.
          def count_appex(root_app: Path) -> int:
              found = set()
              for base_name in ("PlugIns", "Extensions"):
                  base = root_app / base_name
                  if base.is_dir():
                      for appex in base.rglob("*.appex"):
                          found.add(appex.resolve())
              return len(found)

          clean_extension_count = count_appex(input_app)
          final_extension_count = count_appex(app)

          if clean_extension_count == 0:
              raise SystemExit(
                  "❌ CamScanner: a IPA clean usada na validação "
                  "não contém extensões"
              )

          if final_extension_count != 0:
              raise SystemExit(
                  "❌ CamScanner: extensões permaneceram após "
                  "remove_extensions=true: "
                  f"{final_extension_count}"
              )

          # Os frameworks originais da clean devem continuar presentes.
          clean_frameworks = input_app / "Frameworks"
          if clean_frameworks.is_dir():
              missing_original = []
              for original in clean_frameworks.iterdir():
                  if not (frameworks / original.name).exists():
                      missing_original.append(original.name)

              if missing_original:
                  raise SystemExit(
                      "❌ CamScanner: framework(s) original(is) removido(s): "
                      + ", ".join(sorted(missing_original))
                  )

          # V5 precisa continuar pendente neste ponto.
          spec = importlib.util.spec_from_file_location(
              "private_postprocess_camscanner_pre",
              "private-core/scripts/postprocess.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ CamScanner: não foi possível carregar postprocess.py"
              )

          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          candidate = module.find_v5_candidate(
              (frameworks / PATCH_NAME).read_bytes()
          )

          if candidate.view_did_load.imp == candidate.dismiss_callback.imp:
              raise SystemExit(
                  "❌ CamScanner: V5 foi aplicado antes do Final.ipa"
              )

          print(
              f"✅ CamScanner {info.get('CFBundleShortVersionString', '?')}: "
              "layout funcional pré-V5 validado"
          )
          print(
              "✅ Principal: 8 dylibs weak(0) na ordem 1:1"
          )
          print(
              f"✅ Extensões removidas: {clean_extension_count} -> 0"
          )
          print(
              "✅ Frameworks originais preservados"
          )
          print(
              "✅ CydiaSubstrate.framework presente"
          )
          print(
              "✅ V5 confirmado como pendente até o Final.ipa"
          )
          print(
              "ℹ️ CamScanner: validação estrutural sem trava de "
              "versão/hash/offset"
          )

          shutil.rmtree(work)
          shutil.rmtree(input_work)
          PY

      - name: Validate Photoleap Unlimited 1:1 layout
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.lightricks.Enlight-Editor' }}
        run: |
          python <<'PY'
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("photoleap_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Layout_Output.ipa", "r") as z:
              z.extractall(work)

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit("❌ Photoleap: .app principal não identificado")

          app = apps[0]
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("CFBundleIdentifier") != "com.lightricks.Enlight-Editor":
              raise SystemExit("❌ Photoleap: bundle ID final inesperado")

          if info.get("CFBundleShortVersionString") != "2.124":
              print(
                  "⚠️ Photoleap: versão diferente da referência 2.124; "
                  "a estrutura 1:1 continuará sendo validada"
              )

          executable_name = info.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit("❌ Photoleap: CFBundleExecutable ausente")

          main = app / executable_name
          frameworks = app / "Frameworks"

          for name in (
              "sideloadKeychainfix.dylib",
              "Photoleap.dylib",
              "blatantsPatch.dylib",
          ):
              if not (frameworks / name).is_file():
                  raise SystemExit(
                      f"❌ Photoleap: Frameworks/{name} ausente"
                  )

          if not (app / "cyan.entitlements").is_file():
              raise SystemExit("❌ Photoleap: cyan.entitlements ausente")

          def dependencies(path: Path) -> list[str]:
              proc = subprocess.run(
                  [Executable.otool, "-L", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              deps = []
              for raw in proc.stdout.splitlines():
                  line = raw.strip()
                  if (
                      not line
                      or line.endswith(":")
                      or line.startswith("(architecture ")
                  ):
                      continue
                  marker = " (compatibility version "
                  dep = (
                      line.split(marker, 1)[0].strip()
                      if marker in line
                      else line
                  )
                  if dep.startswith(("/", "@")):
                      deps.append(dep)
              return deps

          def load_text(path: Path) -> str:
              proc = subprocess.run(
                  [Executable.otool, "-l", str(path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return proc.stdout

          def assert_weak(path: Path, dep: str, label: str) -> None:
              data = load_text(path)
              idx = data.find(dep)
              if idx < 0:
                  raise SystemExit(
                      f"❌ {label}: load command ausente: {dep}"
                  )
              prefix = data[max(0, idx - 500):idx]
              if "cmd LC_LOAD_WEAK_DYLIB" not in prefix:
                  raise SystemExit(
                      f"❌ {label}: {dep} não é LC_LOAD_WEAK_DYLIB"
                  )

          main_deps = dependencies(main)
          expected_main = [
              "@rpath/sideloadKeychainfix.dylib",
              "@rpath/Photoleap.dylib",
              "@rpath/blatantsPatch.dylib",
          ]

          positions = []
          for dep in expected_main:
              if main_deps.count(dep) != 1:
                  raise SystemExit(
                      f"❌ Photoleap: load ausente ou duplicado: {dep}"
                  )
              positions.append(main_deps.index(dep))
              assert_weak(main, dep, "Photoleap")

          if positions != sorted(positions):
              raise SystemExit(
                  "❌ Photoleap: ordem divergiu da referência "
                  "(sideloadKeychainfix → Photoleap → blatantsPatch)"
              )

          main_loads = load_text(main)
          main_rpaths = [
              line.strip().split("path ", 1)[1].split(
                  " (offset", 1
              )[0]
              for line in main_loads.splitlines()
              if line.strip().startswith("path ")
          ]
          expected_rpaths = {
              "/usr/lib/swift",
              "@loader_path/Frameworks",
              "@executable_path/Frameworks",
          }
          missing_rpaths = expected_rpaths - set(main_rpaths)
          if missing_rpaths:
              raise SystemExit(
                  "❌ Photoleap: rpath(s) da referência ausente(s): "
                  + ", ".join(sorted(missing_rpaths))
              )

          extensions = sorted(
              p for p in app.rglob("*.appex") if p.is_dir()
          )
          expected_names = {
              "EnlightAvatarsLiveActivityExtension.appex",
              "EnlightRichPushNotification.appex",
              "EnlightShareExtension.appex",
          }
          actual_names = {p.name for p in extensions}
          if actual_names != expected_names:
              raise SystemExit(
                  "❌ Photoleap: extensões divergiram da referência. "
                  f"Esperado={sorted(expected_names)} "
                  f"Encontrado={sorted(actual_names)}"
              )

          for extension in extensions:
              plist_path = extension / "Info.plist"
              if not plist_path.is_file():
                  raise SystemExit(
                      f"❌ Photoleap: Info.plist ausente em {extension.name}"
                  )

              with plist_path.open("rb") as f:
                  ext_info = plistlib.load(f)

              ext_name = ext_info.get("CFBundleExecutable")
              if not ext_name:
                  raise SystemExit(
                      f"❌ Photoleap: CFBundleExecutable ausente em {extension.name}"
                  )

              ext_exec = extension / ext_name
              if not ext_exec.is_file():
                  raise SystemExit(
                      f"❌ Photoleap: executável ausente em {extension.name}"
                  )

              ext_deps = dependencies(ext_exec)
              required = "@rpath/blatantsPatch.dylib"
              if ext_deps.count(required) != 1:
                  raise SystemExit(
                      f"❌ Photoleap: blatantsPatch ausente/duplicado em {extension.name}"
                  )

              assert_weak(
                  ext_exec,
                  required,
                  f"Photoleap/{extension.name}",
              )

              for forbidden in (
                  "@rpath/sideloadKeychainfix.dylib",
                  "@rpath/Photoleap.dylib",
              ):
                  if forbidden in ext_deps:
                      raise SystemExit(
                          f"❌ Photoleap: {forbidden} indevido em {extension.name}"
                      )

              if (
                  "path @executable_path/../../Frameworks "
                  not in load_text(ext_exec)
              ):
                  raise SystemExit(
                      f"❌ Photoleap: rpath compartilhado ausente em {extension.name}"
                  )

          print("✅ Photoleap: 3 dylibs presentes em Frameworks")
          print("✅ Photoleap: cyan.entitlements presente")
          print("✅ Photoleap: weak-loads principais na ordem 1:1")
          print("✅ Photoleap: 3 extensões preservadas")
          print("✅ Photoleap: blatantsPatch exclusivo nas extensões")
          print("✅ Photoleap: estrutura 2.124 reproduzida 1:1")

          shutil.rmtree(work)
          PY

      # =========================================================
      # 9. IPAPATCH - OUTROS APPS
      # =========================================================

      - name: Apply IPA Patch to main executable only
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id != 'com.burbn.instagram' && steps.prepare.outputs.ipapatch == 'true' && steps.prepare.outputs.ipapatch_mode == 'main-only' }}
        run: |
          echo "🩹 Aplicando IPA Patch"
          echo "Modo: main-only"
          echo "ℹ️ As extensões originais serão retiradas temporariamente"
          echo "   e restauradas intactas após o patch do app principal."

          rm -rf ipapatch_main_work ipapatch_plugins_backup ipapatch_patched_work
          mkdir -p ipapatch_main_work ipapatch_plugins_backup ipapatch_patched_work

          unzip -q Layout_Output.ipa -d ipapatch_main_work

          python <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          work = Path("ipapatch_main_work")
          backup_root = Path("ipapatch_plugins_backup")

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal; encontrei {len(apps)}"
              )

          app = apps[0]
          rel_app = app.relative_to(work)
          manifest = {}

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          for directory_name in ("PlugIns", "Extensions"):
              source = app / directory_name
              if not source.exists():
                  continue

              destination = backup_root / rel_app / directory_name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(source), str(destination))

              for file in destination.rglob("*"):
                  if file.is_file():
                      key = str(file.relative_to(backup_root))
                      manifest[key] = sha256(file)

              print(
                  f"✅ {directory_name} reservado temporariamente"
              )

          if not manifest:
              raise SystemExit(
                  "❌ Nenhuma extensão original encontrada para preservar"
              )

          Path("ipapatch_plugins_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          print(
              f"✅ {len(manifest)} arquivo(s) das extensões "
              "registrados para validação"
          )
          PY

          (
            cd ipapatch_main_work
            zip -qry ../MainOnly_Input.ipa .
          )

          ./ipapatch \
            --input MainOnly_Input.ipa \
            --output MainOnly_Patched.ipa \
            --noconfirm

          if [ ! -f MainOnly_Patched.ipa ]; then
            echo "❌ IPA Patch não gerou MainOnly_Patched.ipa"
            exit 1
          fi

          unzip -q MainOnly_Patched.ipa -d ipapatch_patched_work

          python <<'PY'
          import hashlib
          import json
          import plistlib
          import shutil
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          patched_work = Path("ipapatch_patched_work")
          backup_root = Path("ipapatch_plugins_backup")
          manifest = json.loads(
              Path("ipapatch_plugins_manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          apps = list((patched_work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal após IPA Patch; "
                  f"encontrei {len(apps)}"
              )

          app = apps[0]
          rel_app = app.relative_to(patched_work)

          with (app / "Info.plist").open("rb") as f:
              plist = plistlib.load(f)

          executable_name = plist.get("CFBundleExecutable")
          if not executable_name:
              raise SystemExit("❌ CFBundleExecutable ausente")

          executable_path = app / executable_name
          dependencies = Executable(
              str(executable_path)
          ).get_dependencies()

          required = "@rpath/zxPluginsInject.dylib"
          if required not in dependencies:
              raise SystemExit(
                  "❌ IPA Patch não injetou zxPluginsInject "
                  "no executável principal"
              )

          zx = app / "Frameworks" / "zxPluginsInject.dylib"
          if not zx.is_file():
              raise SystemExit(
                  "❌ Frameworks/zxPluginsInject.dylib ausente"
              )

          print(
              "✅ Executável principal -> "
              "@rpath/zxPluginsInject.dylib"
          )
          print(
              "✅ Frameworks/zxPluginsInject.dylib adicionado "
              "pelo IPA Patch"
          )

          for directory_name in ("PlugIns", "Extensions"):
              backup = backup_root / rel_app / directory_name
              if not backup.exists():
                  continue

              destination = app / directory_name
              if destination.exists():
                  if destination.is_dir():
                      shutil.rmtree(destination)
                  else:
                      destination.unlink()

              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(backup, destination)
              print(
                  f"✅ {directory_name} original restaurado intacto"
              )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          for relative, expected_hash in manifest.items():
              restored = patched_work / relative
              if not restored.is_file():
                  raise SystemExit(
                      f"❌ Arquivo restaurado ausente: {relative}"
                  )

              actual_hash = sha256(restored)
              if actual_hash != expected_hash:
                  raise SystemExit(
                      "❌ Extensão original foi alterada: "
                      f"{relative}"
                  )

          print(
              "✅ Hashes confirmados: extensões originais "
              "permanecem byte por byte intactas"
          )
          PY

          (
            cd ipapatch_patched_work
            zip -qry ../Patched_Output.ipa .
          )

          if [ ! -f Patched_Output.ipa ]; then
            echo "❌ Patched_Output.ipa não foi criado"
            exit 1
          fi

          echo "✅ IPA Patch main-only concluído"

      - name: Apply IPA Patch to main app and original plugins
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id != 'com.burbn.instagram' && steps.prepare.outputs.ipapatch == 'true' && steps.prepare.outputs.ipapatch_mode == 'all' }}
        run: |
          echo "🩹 Aplicando IPA Patch"
          echo "Modo: all"
          echo "ℹ️ O app principal e todas as extensões originais serão processados."

          rm -rf ipapatch_all_validate

          ./ipapatch \
            --input Layout_Output.ipa \
            --output Patched_Output.ipa \
            --noconfirm

          if [ ! -f Patched_Output.ipa ]; then
            echo "❌ IPA Patch não gerou Patched_Output.ipa"
            exit 1
          fi

          mkdir -p ipapatch_all_validate
          unzip -q Patched_Output.ipa -d ipapatch_all_validate

          python <<'PY'
          import plistlib
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("ipapatch_all_validate")
          apps = list((work / "Payload").glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal; encontrei {len(apps)}"
              )

          app = apps[0]
          required = "@rpath/zxPluginsInject.dylib"

          def executable_from_bundle(bundle: Path) -> Path:
              plist_path = bundle / "Info.plist"
              if not plist_path.is_file():
                  raise SystemExit(
                      f"❌ Info.plist ausente em {bundle}"
                  )

              with plist_path.open("rb") as f:
                  plist = plistlib.load(f)

              executable_name = plist.get("CFBundleExecutable")
              if not executable_name:
                  raise SystemExit(
                      f"❌ CFBundleExecutable ausente em {bundle}"
                  )

              executable = bundle / executable_name
              if not executable.is_file():
                  raise SystemExit(
                      f"❌ Executável ausente: {executable}"
                  )

              return executable

          main_executable = executable_from_bundle(app)
          main_dependencies = Executable(
              str(main_executable)
          ).get_dependencies()

          if required not in main_dependencies:
              raise SystemExit(
                  "❌ IPA Patch não injetou zxPluginsInject "
                  "no executável principal"
              )

          print(
              "✅ App principal -> @rpath/zxPluginsInject.dylib"
          )

          extensions = []
          for directory_name in ("PlugIns", "Extensions"):
              directory = app / directory_name
              if directory.is_dir():
                  extensions.extend(
                      sorted(directory.glob("*.appex"))
                  )

          for extension in extensions:
              executable = executable_from_bundle(extension)
              dependencies = Executable(
                  str(executable)
              ).get_dependencies()

              if required not in dependencies:
                  raise SystemExit(
                      "❌ IPA Patch não injetou zxPluginsInject em "
                      f"{extension.name}"
                  )

              print(
                  f"✅ {extension.name} -> "
                  "@rpath/zxPluginsInject.dylib"
              )

          print(
              f"✅ Modo all validado em {len(extensions)} extensão(ões)"
          )
          PY

          rm -rf ipapatch_all_validate
          echo "✅ IPA Patch all concluído"

