name: Telegram IPA Injector

on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Tweak/addon opcional; vazio usa o padrão do app"
        required: false
        default: ""
        type: string
      telegram_message_id:
        description: "ID da mensagem temporária enviada pelo bot"
        required: false
        default: ""
        type: string
      callback_url:
        description: "Callback do Worker do bot do Injector"
        required: false
        default: ""
        type: string

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # =========================================================
      # 1. AMBIENTE
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: Lucas25Pedrosa/Bot-Injector-Core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: private-core
          persist-credentials: false

      - name: Checkout shared config
        uses: actions/checkout@v5
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.SHARED_CONFIG_TOKEN }}
          path: shared-config
          persist-credentials: false

      - name: Validate private core
        run: |
          test -f private-core/telegram_download.py
          test -f private-core/telegram_send.py
          test -f private-core/feather_package_transport.py
          test -d private-core/addons
          test -d private-core/config
          test -d private-core/translations
          test -f private-core/scripts/postprocess.py

          echo "✅ Bot-Injector-Core acessado com sucesso"

      - name: Validate shared config
        run: |
          test -f shared-config/custom_emojis.json

          if [ -f shared-config/injector_r2_emojis.json ]; then
            echo "✅ injector_r2_emojis.json disponível"
          else
            echo "⚠️ injector_r2_emojis.json ainda não disponível; fallbacks serão usados"
          fi

          echo "✅ Configuração compartilhada acessada com sucesso"

      - name: Activate private core
        run: |
          rm -rf addons config translations

          cp -a private-core/addons ./addons
          cp -a private-core/config ./config
          cp -a private-core/translations ./translations

          cp private-core/telegram_download.py ./telegram_download.py
          cp private-core/telegram_send.py ./telegram_send.py
          cp private-core/feather_package_transport.py ./feather_package_transport.py

          echo "✅ Bot-Injector-Core ativado"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            tar \
            zip \
            unzip \
            curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon
          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          echo "✅ Dependências instaladas"
          cyan --version

      # =========================================================
      # 2. TELEGRAM -> INPUT.IPA
      # =========================================================

      - name: Download latest IPA from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          INJECTOR_START_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          INJECTOR_CALLBACK_URL: ${{ inputs.callback_url }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
        run: |
          python telegram_download.py

      - name: Validate downloaded IPA
        run: |
          if [ ! -f input.ipa ]; then
            echo "❌ input.ipa não encontrado"
            exit 1
          fi

          if ! unzip -tq input.ipa > /dev/null; then
            echo "❌ input.ipa não é um IPA válido"
            exit 1
          fi

          echo "✅ IPA original válido"
          ls -lh input.ipa

      - name: Private input processing
        id: private_input
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
        run: |
          INPUT_BUNDLE_ID="$(python <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile("input.ipa", "r") as z:
              plist_files = [
                  name
                  for name in z.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]

              if len(plist_files) != 1:
                  raise SystemExit(
                      f"Esperava 1 app principal; encontrei {len(plist_files)}"
                  )

              with z.open(plist_files[0]) as f:
                  info = plistlib.load(f)

          print(info.get("CFBundleIdentifier") or "")
          PY
          )"

          case "$INPUT_BUNDLE_ID" in
            com.alohabrowser.alohabrowser|com.tranzmate.tranzmate1|com.wellocution.iosapp|com.intsig.CamScannerLite)
              echo "🟢 $INPUT_BUNDLE_ID: rota inicial forçada para STANDARD"
              echo "ℹ️ V5 será aplicado somente no Final.ipa"
              echo "processing_route=standard" >> "$GITHUB_OUTPUT"
              echo "bundle_id=$INPUT_BUNDLE_ID" >> "$GITHUB_OUTPUT"
              echo "initial_private_bypassed=true" >> "$GITHUB_OUTPUT"
              rm -f .private-status.json
              ;;
            *)
              python private-core/scripts/postprocess.py input.ipa \
                --status-file .private-status.json \
                --github-output "$GITHUB_OUTPUT"
              ;;
          esac

      # =========================================================
      # 3. DETECTAR APP E TWEAK
      # =========================================================

      - name: Detect app and select addon
        id: prepare
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        env:
          REQUESTED_ADDON: ${{ inputs.addon }}
        run: |
          python <<'PY'
          import json
          import os
          import plistlib
          import sys
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("input.ipa", "r") as z:
              plist_files = [
                  name
                  for name in z.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]

              if len(plist_files) != 1:
                  raise SystemExit(
                      f"❌ Esperava 1 app principal; encontrei {len(plist_files)}"
                  )

              with z.open(plist_files[0]) as f:
                  plist = plistlib.load(f)

          bundle_id = plist.get("CFBundleIdentifier")
          app_name = (
              plist.get("CFBundleDisplayName")
              or plist.get("CFBundleName")
              or "Unknown"
          )

          # CamScanner pode vir com CFBundleDisplayName localizado (ex.: chinês).
          # O nome canônico é usado apenas pelo fluxo do Injector/Telegram e
          # pelo nome do arquivo final; o Info.plist interno do app não é alterado.
          if bundle_id == "com.intsig.CamScannerLite":
              app_name = "CamScanner"

          version = plist.get("CFBundleShortVersionString", "Unknown")
          build = str(plist.get("CFBundleVersion", "Unknown"))

          if not bundle_id:
              raise SystemExit("❌ Bundle ID não encontrado")

          with open("config/addons.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          apps = config.get("apps", {})

          if bundle_id not in apps:
              print()
              print("❌ Aplicativo não cadastrado")
              print(f"Bundle ID: {bundle_id}")
              print()
              print("Aplicativos cadastrados:")

              for bid, data in apps.items():
                  print(f" • {data.get('name')} ({bid})")

              sys.exit(1)

          app_config = apps[bundle_id]
          addons = app_config.get("addons", [])

          if not addons:
              raise SystemExit("❌ Nenhum addon cadastrado")

          requested_name = os.environ.get(
              "REQUESTED_ADDON",
              "",
          ).strip()

          default_name = app_config.get("default_addon")

          if requested_name:
              addon = next(
                  (
                      item
                      for item in addons
                      if item.get("name", "").lower()
                      == requested_name.lower()
                  ),
                  None,
              )

              if addon is None:
                  available = ", ".join(
                      item.get("name", "?")
                      for item in addons
                  )
                  raise SystemExit(
                      "❌ Addon solicitado não encontrado: "
                      f"{requested_name}. Disponíveis: {available}"
                  )

              print(
                  "🎯 Addon solicitado manualmente: "
                  f"{requested_name}"
              )

          elif default_name:
              addon = next(
                  (
                      item
                      for item in addons
                      if item.get("name", "").lower()
                      == default_name.lower()
                  ),
                  None,
              )

              if addon is None:
                  raise SystemExit(
                      f"❌ default_addon inválido: {default_name}"
                  )

              print(
                  "⭐ Usando addon padrão: "
                  f"{default_name}"
              )

          elif len(addons) == 1:
              addon = addons[0]

          else:
              raise SystemExit(
                  "❌ Mais de um addon cadastrado "
                  "e nenhum default_addon definido"
              )

          for item in addon.get("files", []):
              path = item.get("path")

              if not path:
                  raise SystemExit("❌ Componente sem path")

              if not Path(path).exists():
                  raise SystemExit(f"❌ Arquivo ausente: {path}")

          with open(
              "selected_addon.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  addon,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as out:
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"app_name={app_name}\n")
              out.write(f"version={version}\n")
              out.write(f"build={build}\n")
              out.write(f"addon_name={addon.get('name')}\n")
              out.write(
                  "addon_version="
                  f"{str(addon.get('version', '')).strip()}\n"
              )
              ipapatch_enabled = addon.get("ipapatch", False)
              if ipapatch_enabled:
                  ipapatch_mode = addon.get(
                      "ipapatch_mode",
                      "plugins-only",
                  )
              else:
                  ipapatch_mode = "none"

              if (
                  ipapatch_enabled
                  and ipapatch_mode not in {
                      "plugins-only",
                      "main-only",
                      "all",
                  }
              ):
                  raise SystemExit(
                      "❌ ipapatch_mode inválido: "
                      f"{ipapatch_mode}"
                  )

              out.write(
                  "ipapatch="
                  f"{str(ipapatch_enabled).lower()}\n"
              )
              out.write(
                  "ipapatch_mode="
                  f"{ipapatch_mode}\n"
              )
              out.write(
                  "remove_extensions="
                  f"{str(addon.get('remove_extensions', False)).lower()}\n"
              )

          print()
          print("✅ Aplicativo identificado")
          print(f"📱 Nome: {app_name}")
          print(f"📦 Bundle ID: {bundle_id}")
          print(f"🔢 Versão: {version}")
          print(f"🏗️ Build: {build}")
          print(f"🧩 Tweak: {addon.get('name')}")
          print(f"🩹 IPA Patch: {addon.get('ipapatch', False)}")
          print(
              "🩹 Modo IPA Patch: "
              f"{ipapatch_mode}"
          )
          PY

      - name: Preparar progresso - injeção
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
          INJECTOR_EMOJIS_FILE: shared-config/injector_r2_emojis.json
          APP_NAME: ${{ steps.prepare.outputs.app_name }}
          APP_VERSION: ${{ steps.prepare.outputs.version }}
          ADDON_NAME: ${{ steps.prepare.outputs.addon_name }}
          ADDON_VERSION: ${{ steps.prepare.outputs.addon_version }}
        run: |
          cat > .update_injection_progress.py <<'PY'
          import html
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          STATE = Path(
              os.environ.get(
                  "TELEGRAM_PROGRESS_STATE_FILE",
                  ".telegram-progress.json",
              )
          )
          CONFIG = Path(
              os.environ.get(
                  "INJECTOR_EMOJIS_FILE",
                  "shared-config/injector_r2_emojis.json",
              )
          )
          META = Path(".injection-progress-meta.json")


          def load_json(path, default):
              try:
                  loaded = json.loads(path.read_text(encoding="utf-8"))
                  return loaded if isinstance(loaded, dict) else default
              except Exception:
                  return default


          def tg_emoji(custom_id, fallback):
              if not custom_id:
                  return html.escape(fallback)
              return (
                  f'<tg-emoji emoji-id="{html.escape(str(custom_id), quote=True)}">'
                  f'{html.escape(fallback)}'
                  '</tg-emoji>'
              )


          def progress_bar(percent):
              total_blocks = 20
              filled = round(total_blocks * percent / 100)
              filled = max(0, min(total_blocks, filled))
              return "[" + "█" * filled + "░" * (total_blocks - filled) + "]"


          def edit_message(token, chat_id, message_id, text, parse_mode=None):
              payload = {
                  "chat_id": chat_id,
                  "message_id": message_id,
                  "text": text,
                  "disable_web_page_preview": True,
              }
              if parse_mode:
                  payload["parse_mode"] = parse_mode

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return 200 <= response.status < 300
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if "message is not modified" in body.lower():
                      return True
                  raise


          def main():
              if len(sys.argv) != 2:
                  raise SystemExit("Uso: .update_injection_progress.py <percentual>")

              try:
                  percent = float(sys.argv[1])
              except ValueError:
                  raise SystemExit("Percentual inválido")

              percent = max(0.0, min(100.0, percent))
              state = load_json(STATE, {})
              meta = load_json(META, {})
              emojis = load_json(CONFIG, {})

              message_id = int(state.get("message_id") or 0)
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              chat_id = os.environ.get("TELEGRAM_BOT_CHAT_ID", "").strip()

              if not message_id or not token or not chat_id:
                  print("ℹ️ Dados do Telegram incompletos; progresso ignorado.")
                  return

              inject = emojis.get("inject", {})
              inject_id = str(inject.get("custom_emoji_id") or "").strip()
              inject_fallback = str(inject.get("fallback") or "💉")

              app_emoji_id = str(
                  state.get("app_custom_emoji_id")
                  or meta.get("app_custom_emoji_id")
                  or ""
              ).strip()
              app_fallback = str(
                  state.get("app_fallback")
                  or meta.get("app_fallback")
                  or "📱"
              )

              app_name = str(meta.get("app_name") or state.get("app_name") or "Aplicativo")
              app_version = str(meta.get("app_version") or state.get("app_version") or "")
              addon_name = str(meta.get("addon_name") or "tweak")
              addon_version = str(meta.get("addon_version") or "").strip()

              tweak_label = addon_name
              if addon_version and addon_version.lower() not in tweak_label.lower():
                  tweak_label = f"{tweak_label} {addon_version}"

              bar = progress_bar(percent)
              percent_text = f"{percent:.1f}%"

              rich_text = (
                  f"{tg_emoji(inject_id, inject_fallback)} "
                  f"Injetando {html.escape(tweak_label)}\n\n"
                  f"{tg_emoji(app_emoji_id, app_fallback)} "
                  f"{html.escape(app_name)}"
                  + (f" {html.escape(app_version)}" if app_version else "")
                  + f"\n\n{bar} {percent_text}"
              )

              plain_text = (
                  f"{inject_fallback} Injetando {tweak_label}\n\n"
                  f"{app_fallback} {app_name}"
                  + (f" {app_version}" if app_version else "")
                  + f"\n\n{bar} {percent_text}"
              )

              try:
                  edit_message(
                      token, chat_id, message_id, rich_text, "HTML"
                  )
                  print(f"✅ Progresso da injeção: {percent_text}")
              except Exception as exc:
                  print(f"⚠️ Emoji animado não pôde ser usado: {exc}")
                  try:
                      edit_message(token, chat_id, message_id, plain_text)
                      print(f"✅ Progresso da injeção: {percent_text} (fallback)")
                  except Exception as fallback_exc:
                      print(
                          "⚠️ Não foi possível atualizar o progresso: "
                          f"{fallback_exc}"
                      )


          if __name__ == "__main__":
              main()
          PY

          python <<'PY'
          import json
          import os
          from pathlib import Path

          state_path = Path(
              os.environ.get(
                  "TELEGRAM_PROGRESS_STATE_FILE",
                  ".telegram-progress.json",
              )
          )
          state = {}
          if state_path.is_file():
              try:
                  loaded = json.loads(state_path.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      state = loaded
              except Exception:
                  pass

          payload = {
              "app_name": os.environ.get("APP_NAME", "").strip(),
              "app_version": os.environ.get("APP_VERSION", "").strip(),
              "addon_name": os.environ.get("ADDON_NAME", "").strip(),
              "addon_version": os.environ.get("ADDON_VERSION", "").strip(),
              "app_custom_emoji_id": str(state.get("app_custom_emoji_id") or ""),
              "app_fallback": str(state.get("app_fallback") or "📱"),
          }

          Path(".injection-progress-meta.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python .update_injection_progress.py 0

      # =========================================================
      # 4. IPAPATCH
      # =========================================================

      - name: Install IPA Patch
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.ipapatch == 'true' }}
        run: |
          echo "📥 Instalando IPA Patch..."

          curl \
            --location \
            --fail \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch
          ./ipapatch --version

      # =========================================================
      # 5. PREPARAR COMPONENTES
      # =========================================================

      - name: Prepare addon components
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        env:
          BUNDLE_ID: ${{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}
        run: |
          python <<'PY'
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          with open(
              "selected_addon.json",
              "r",
              encoding="utf-8",
          ) as f:
              addon = json.load(f)

          prepared = Path("prepared")

          if prepared.exists():
              shutil.rmtree(prepared)

          bundles = prepared / "bundles"
          appex = prepared / "appex"
          icons = prepared / "icons"
          frameworks = prepared / "frameworks"
          root_files = prepared / "root"
          inject = prepared / "inject"

          for directory in (
              bundles,
              appex,
              icons,
              frameworks,
              root_files,
              inject,
          ):
              directory.mkdir(parents=True)

          inject_files = []

          for item in addon.get("files", []):
              path = Path(item["path"])
              action = item["action"]

              print(f"📦 {path.name} -> {action}")

              if action == "inject":
                  if path.suffix.lower() == ".zip":
                      target = inject / path.stem
                      target.mkdir(parents=True, exist_ok=True)

                      with zipfile.ZipFile(path, "r") as z:
                          z.extractall(target)

                      candidates = [
                          item
                          for item in target.rglob("*")
                          if item.is_file()
                          and item.suffix.lower() in {
                              ".dylib",
                              ".deb",
                          }
                      ]

                      if len(candidates) != 1:
                          raise SystemExit(
                              "❌ ZIP de injeção deve conter "
                              "exatamente um .dylib ou .deb: "
                              f"{path}"
                          )

                      extracted = candidates[0]
                      inject_files.append(str(extracted))
                      print(
                          "   ↳ extraído para injeção: "
                          f"{extracted}"
                      )
                  else:
                      inject_files.append(str(path))

              elif action == "bundle":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(bundles)

                  # Traduções privadas por app/versão.
                  # Convenção:
                  # translations/<app>/<versão>/
                  #     -> <Bundle>.bundle/pt-BR.lproj/
                  addon_version = str(
                      addon.get("version", "")
                  ).strip()

                  path_parts = path.parts
                  app_key = (
                      path_parts[1]
                      if len(path_parts) >= 2
                      and path_parts[0] == "addons"
                      else ""
                  )

                  # Apenas addons com localização validada.
                  # Telegram/Mx foi removido desta rota.
                  translatable_apps = {
                      "x",
                      "facebook",
                      "tiktok",
                  }

                  translation_source = (
                      Path("translations")
                      / app_key
                      / addon_version
                  )

                  if (
                      app_key in translatable_apps
                      and addon_version
                      and translation_source.is_dir()
                  ):
                      bundle_target = (
                          bundles / path.stem
                      )

                      if not bundle_target.is_dir():
                          raise SystemExit(
                              "❌ Bundle alvo da tradução não "
                              f"encontrado: {bundle_target}"
                          )

                      translation_files = [
                          file
                          for file in translation_source.rglob("*")
                          if file.is_file()
                      ]

                      if not translation_files:
                          raise SystemExit(
                              "❌ Pasta de tradução vazia: "
                              f"{translation_source}"
                          )

                      pt_br = (
                          bundle_target / "pt-BR.lproj"
                      )
                      pt_br.mkdir(
                          parents=True,
                          exist_ok=True,
                      )

                      copied_pt_br = 0
                      copied_bundle_root = 0

                      for source in translation_files:
                          relative = source.relative_to(
                              translation_source
                          )

                          destination = pt_br / relative
                          copied_pt_br += 1

                          destination.parent.mkdir(
                              parents=True,
                              exist_ok=True,
                          )
                          shutil.copy2(
                              source,
                              destination,
                          )

                      print(
                          "🇧🇷 Tradução pt-BR aplicada: "
                          f"{app_key}/{addon_version} -> "
                          f"{bundle_target.name} "
                          f"(localização={copied_pt_br}, "
                          f"raiz={copied_bundle_root})"
                      )

              elif action == "appex":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(appex)

              elif action == "icons":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(icons)

              elif action == "frameworks":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(frameworks)

              elif action == "root":
                  with zipfile.ZipFile(path, "r") as z:
                      z.extractall(root_files)

              else:
                  raise SystemExit(
                      f"❌ Ação desconhecida: {action}"
                  )

          # TikTok 46.x+: mantém a entrada do RXTikTok no menu
          # mesmo após o refresh remoto das configurações.
          if os.environ.get("BUNDLE_ID") == "com.zhiliaoapp.musically":
              rx_menu_fix = Path(
                  "addons/tiktok/dylib/RXMenuFix-v1.4.dylib"
              )

              if not rx_menu_fix.is_file():
                  raise SystemExit(
                      "❌ RXMenuFix v1.4 ausente no Core: "
                      f"{rx_menu_fix}"
                  )

              rx_menu_fix_str = str(rx_menu_fix)

              if rx_menu_fix_str not in inject_files:
                  inject_files.append(rx_menu_fix_str)
                  print(
                      "✅ RXMenuFix v1.4 adicionado ao TikTok"
                  )

          with open(
              "inject_files.txt",
              "w",
              encoding="utf-8",
          ) as f:
              for path in inject_files:
                  f.write(path + "\n")

          print()
          print(f"✅ {len(inject_files)} arquivo(s) de injeção")
          print(f"✅ {len(list(bundles.iterdir()))} bundle(s)")
          print(f"✅ {len(list(appex.iterdir()))} appex")
          print(f"✅ {len(list(icons.iterdir()))} ícone(s)")
          print(f"✅ {len(list(frameworks.iterdir()))} framework(s)")
          print(f"✅ {len(list(root_files.iterdir()))} item(ns) de raiz")
          PY

      - name: Progresso da injeção - 20%
        if: ${{ steps.private_input.outputs.processing_route == 'standard' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
        run: |
          python .update_injection_progress.py 20

      # =========================================================
      # 6. INSTAGRAM / REGRAM - PERFIL OFICIAL FOUAD
      # =========================================================

      - name: Install Regram using audited Fouad layout
        id: regram_install
        continue-on-error: true
        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.burbn.instagram' }}
        env:
          APP_VERSION: ${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}
          ADDON_VERSION: ${{ steps.prepare.outputs.addon_version }}
        run: |
          set +e
          python <<'PY' 2>&1 | tee regram-install.log
          import os
          import plistlib
          import shutil
          import subprocess
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("regram_work")

          if work.exists():
              shutil.rmtree(work)

          work.mkdir()

          subprocess.run(
              [
                  "unzip",
                  "-q",
                  "input.ipa",
                  "-d",
                  str(work),
              ],
              check=True,
          )

          apps = list(
              (work / "Payload").glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 .app; encontrei {len(apps)}"
              )

          app = apps[0]
          plist_path = app / "Info.plist"

          with open(plist_path, "rb") as f:
              plist = plistlib.load(f)

          if plist.get("CFBundleIdentifier") != "com.burbn.instagram":
              raise SystemExit(
                  "❌ Perfil Regram acionado para Bundle ID incorreto"
              )

          addon_version = os.environ.get(
              "ADDON_VERSION",
              "",
          ).strip()

          if not addon_version:
              raise SystemExit(
                  "❌ Versão do Regram ausente no addons.json"
              )

          version = plist.get(
              "CFBundleShortVersionString",
              "Unknown",
          )
          build = plist.get(
              "CFBundleVersion",
              "Unknown",
          )

          print(
              f"📱 Instagram {version} "
              f"(build {build})"
          )
          print(
              f"🧩 Regram {addon_version}"
          )

          if (
              version == "443.1.0"
              and str(build) == "1045455915"
              and addon_version == "6.0.1"
          ):
              print(
                  "✅ Base auditada Instagram 443.1.0 / "
                  "Regram 6.0.1 confirmada"
              )
          else:
              print(
                  "ℹ️ Versão/build fora da base auditada. "
                  "Prosseguindo somente se todas as "
                  "validações estruturais do Regram "
                  "continuarem compatíveis."
              )

          # -----------------------------------------------------
          # ARQUIVOS OFICIAIS DO REGRAM
          # -----------------------------------------------------

          inject_paths = [
              Path(line.strip())
              for line in Path(
                  "inject_files.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          inject_by_name = {
              path.name: path
              for path in inject_paths
          }

          required_dylibs = [
              "RegramExtension.dylib",
              "Regram.dylib",
          ]

          for name in required_dylibs:
              source = inject_by_name.get(name)

              if source is None or not source.exists():
                  raise SystemExit(
                      f"❌ Dylib oficial ausente: {name}"
                  )

              shutil.copy2(
                  source,
                  app / name,
              )

              print(
                  f"✅ {name} copiada para a raiz do Instagram.app"
              )

          # -----------------------------------------------------
          # REGRAM.BUNDLE OFICIAL
          # -----------------------------------------------------

          bundle_source = (
              Path("prepared/bundles")
              / "Regram.bundle"
          )

          if not bundle_source.is_dir():
              raise SystemExit(
                  "❌ Regram.bundle oficial não encontrado"
              )

          bundle_info_path = (
              bundle_source
              / "Info.plist"
          )

          if not bundle_info_path.is_file():
              raise SystemExit(
                  "❌ Info.plist do Regram.bundle ausente"
              )

          with bundle_info_path.open("rb") as f:
              bundle_info = plistlib.load(f)

          bundle_package_version = str(
              bundle_info.get(
                  "PackageVersion",
                  "",
              )
          ).strip()

          if (
              bundle_package_version
              != addon_version
          ):
              raise SystemExit(
                  "❌ Versão do payload Regram não corresponde "
                  "ao addons.json: "
                  f"PackageVersion={bundle_package_version!r}, "
                  f"addons.json={addon_version!r}"
              )

          print(
              "✅ Regram.bundle PackageVersion "
              f"{bundle_package_version} confirmado"
          )

          bundle_destination = (
              app / "Regram.bundle"
          )

          if bundle_destination.exists():
              shutil.rmtree(
                  bundle_destination
              )

          shutil.copytree(
              bundle_source,
              bundle_destination,
          )

          print("✅ Regram.bundle oficial adicionado")

          # -----------------------------------------------------
          # 20 ÍCONES OFICIAIS
          # -----------------------------------------------------

          expected_icons = [
              "2010@2x.png",
              "2010@3x.png",
              "2010-iPad@2x.png",
              "2010-iPadPro@2x.png",
              "2011@2x.png",
              "2011@3x.png",
              "2011-iPad@2x.png",
              "2011-iPadPro@2x.png",
              "Regram@2x.png",
              "Regram@3x.png",
              "Regram-iPad@2x.png",
              "Regram-iPadPro@2x.png",
              "Regram2@2x.png",
              "Regram2@3x.png",
              "Regram2-iPad@2x.png",
              "Regram2-iPadPro@2x.png",
              "Regram-Dark@2x.png",
              "Regram-Dark@3x.png",
              "Regram-Dark-iPad@2x.png",
              "Regram-Dark-iPadPro@2x.png",
          ]

          icon_source = Path(
              "prepared/icons"
          )

          for name in expected_icons:
              source = icon_source / name

              if not source.is_file():
                  raise SystemExit(
                      f"❌ Ícone oficial ausente: {name}"
                  )

              shutil.copy2(
                  source,
                  app / name,
              )

          print(
              "✅ 20 ícones oficiais adicionados"
          )

          # -----------------------------------------------------
          # FFMPEGKIT OFICIAL
          # -----------------------------------------------------

          expected_frameworks = [
              "ffmpegkit.framework",
              "libavcodec.framework",
              "libavdevice.framework",
              "libavfilter.framework",
              "libavformat.framework",
              "libavutil.framework",
              "libswresample.framework",
              "libswscale.framework",
          ]

          frameworks_source = Path(
              "prepared/frameworks"
          )

          frameworks_destination = (
              app / "Frameworks"
          )

          frameworks_destination.mkdir(
              exist_ok=True
          )

          for name in expected_frameworks:
              source = (
                  frameworks_source
                  / name
              )

              if not source.is_dir():
                  raise SystemExit(
                      f"❌ Framework oficial ausente: {name}"
                  )

              destination = (
                  frameworks_destination
                  / name
              )

              if destination.exists():
                  if destination.is_dir():
                      shutil.rmtree(
                          destination
                      )
                  else:
                      destination.unlink()

              shutil.copytree(
                  source,
                  destination,
              )

              print(
                  f"✅ Framework instalado: {name}"
              )

          # -----------------------------------------------------
          # INJEÇÃO FORTE LC_LOAD_DYLIB
          # -----------------------------------------------------

          def strong_inject(
              binary: Path,
              dependency: str,
          ) -> None:
              if not binary.is_file():
                  raise RuntimeError(
                      f"Executável não encontrado: {binary}"
                  )

              executable = Executable(
                  str(binary)
              )

              if not Path(
                  executable.idylib
              ).is_file():
                  raise RuntimeError(
                      "insert_dylib do Cyan não encontrado"
                  )

              current_dependencies = (
                  executable.get_dependencies()
              )

              if dependency in current_dependencies:
                  print(
                      f"ℹ️ Dependência já existe em "
                      f"{binary.name}: {dependency}"
                  )
                  return

              entitlements = (
                  binary.parent
                  / f".{binary.name}.regram.entitlements"
              )

              ent_proc = subprocess.run(
                  [
                      executable.ldid,
                      "-e",
                      str(binary),
                  ],
                  capture_output=True,
              )

              entitlements.write_bytes(
                  ent_proc.stdout
              )

              executable.remove_signature()

              result = subprocess.run(
                  [
                      executable.idylib,
                      "--inplace",
                      "--all-yes",
                      dependency,
                      str(binary),
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      "Falha ao adicionar LC_LOAD_DYLIB "
                      f"em {binary}:\n"
                      f"{result.stderr}"
                  )

              if entitlements.stat().st_size > 0:
                  zero_requirements = (
                      Path(
                          executable.install_dir
                      )
                      / "extras"
                      / "zero.requirements"
                  )

                  sign_result = subprocess.run(
                      [
                          executable.ldid,
                          f"-S{entitlements}",
                          "-M",
                          "-Cadhoc",
                          f"-Q{zero_requirements}",
                          str(binary),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if sign_result.returncode != 0:
                      raise RuntimeError(
                          "Falha ao restaurar entitlements "
                          f"em {binary}:\n"
                          f"{sign_result.stderr}"
                      )

              else:
                  if not executable.fakesign():
                      raise RuntimeError(
                          f"Falha ao fazer fakesign em {binary}"
                      )

              entitlements.unlink(
                  missing_ok=True
              )

              verified = Executable(
                  str(binary)
              ).get_dependencies()

              if dependency not in verified:
                  raise RuntimeError(
                      "Dependência não apareceu após "
                      f"a injeção: {dependency}"
                  )

              print(
                  f"✅ LC_LOAD_DYLIB forte: "
                  f"{binary.name} -> {dependency}"
              )

          main_executable_name = plist.get(
              "CFBundleExecutable"
          )

          if not main_executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable do Instagram ausente"
              )

          main_executable = (
              app
              / main_executable_name
          )

          # Mesma ordem observada no IPA do Fouad.
          strong_inject(
              main_executable,
              "@executable_path/RegramExtension.dylib",
          )

          strong_inject(
              main_executable,
              "@executable_path/Regram.dylib",
          )

          # -----------------------------------------------------
          # REGRAMEXTENSION EM TODAS AS EXTENSÕES ORIGINAIS
          # -----------------------------------------------------

          expected_original_extensions = {
              "Extensions/InstagramExtensionLockScreenCamera.appex",
              "PlugIns/InstagramBroadcastSampleHandlerExtension.appex",
              "PlugIns/InstagramNotificationContentExtension.appex",
              "PlugIns/InstagramNotificationExtension.appex",
              "PlugIns/InstagramShareExtension.appex",
              "PlugIns/InstagramWidgetExtension.appex",
              "PlugIns/InstagramWidgetExtensionLiveActivities.appex",
              "PlugIns/InstagramWidgetExtensionLockScreenCameraControl.appex",
          }

          found_original_extensions = set()

          for directory_name in (
              "PlugIns",
              "Extensions",
          ):
              directory = (
                  app
                  / directory_name
              )

              if directory.exists():
                  for extension in sorted(
                      directory.glob(
                          "*.appex"
                      )
                  ):
                      found_original_extensions.add(
                          str(
                              extension.relative_to(
                                  app
                              )
                          )
                      )

          if (
              found_original_extensions
              != expected_original_extensions
          ):
              missing = sorted(
                  expected_original_extensions
                  - found_original_extensions
              )
              unexpected = sorted(
                  found_original_extensions
                  - expected_original_extensions
              )

              print(
                  "❌ Estrutura das extensões do Instagram mudou"
              )

              if missing:
                  print("Ausentes:")
                  for item in missing:
                      print(f" • {item}")

              if unexpected:
                  print("Novas/inesperadas:")
                  for item in unexpected:
                      print(f" • {item}")

              raise SystemExit(
                  "❌ Layout de extensões incompatível com "
                  "o perfil estrutural auditado do Regram"
              )

          original_appex = [
              app / relative
              for relative in sorted(
                  expected_original_extensions
              )
          ]

          print(
              "✅ As 8 extensões auditadas do Instagram "
              "continuam presentes"
          )

          for extension in original_appex:
              extension_plist_path = (
                  extension
                  / "Info.plist"
              )

              if not extension_plist_path.is_file():
                  raise SystemExit(
                      "❌ Info.plist ausente em "
                      f"{extension}"
                  )

              with open(
                  extension_plist_path,
                  "rb",
              ) as f:
                  extension_plist = (
                      plistlib.load(f)
                  )

              executable_name = (
                  extension_plist.get(
                      "CFBundleExecutable"
                  )
              )

              if not executable_name:
                  raise SystemExit(
                      "❌ CFBundleExecutable ausente em "
                      f"{extension.name}"
                  )

              extension_executable = (
                  extension
                  / executable_name
              )

              strong_inject(
                  extension_executable,
                  "@executable_path/../../RegramExtension.dylib",
              )

          print(
              "✅ RegramExtension injetada nas "
              "8 extensões originais"
          )

          # -----------------------------------------------------
          # OPEN IN REGRAM - APPEX OFICIAL
          # -----------------------------------------------------

          appex_source = (
              Path("prepared/appex")
              / "OpenInRegramExtension.appex"
          )

          if not appex_source.is_dir():
              raise SystemExit(
                  "❌ OpenInRegramExtension.appex "
                  "oficial não encontrada"
              )

          plugins = (
              app
              / "PlugIns"
          )

          plugins.mkdir(
              exist_ok=True
          )

          appex_destination = (
              plugins
              / appex_source.name
          )

          if appex_destination.exists():
              shutil.rmtree(
                  appex_destination
              )

          shutil.copytree(
              appex_source,
              appex_destination,
          )

          print(
              "✅ OpenInRegramExtension.appex "
              "adicionada intacta"
          )

          # Validação da ligação interna da appex oficial.
          with open(
              appex_destination
              / "Info.plist",
              "rb",
          ) as f:
              extra_plist = plistlib.load(f)

          extra_executable_name = (
              extra_plist.get(
                  "CFBundleExecutable"
              )
          )

          if not extra_executable_name:
              raise SystemExit(
                  "❌ Executável da OpenInRegramExtension "
                  "não encontrado no Info.plist"
              )

          extra_executable = (
              appex_destination
              / extra_executable_name
          )

          extra_dependencies = Executable(
              str(extra_executable)
          ).get_dependencies()

          required_extra_dependency = (
              "@executable_path/../../"
              "RegramExtension.dylib"
          )

          if required_extra_dependency not in extra_dependencies:
              raise SystemExit(
                  "❌ OpenInRegramExtension não aponta "
                  "para RegramExtension.dylib"
              )

          print(
              "✅ OpenInRegramExtension -> "
              "../../RegramExtension.dylib confirmado"
          )

          # -----------------------------------------------------
          # INFOPLIST - MESMAS ALTERAÇÕES DO FOUAD
          # -----------------------------------------------------

          url_types = plist.get(
              "CFBundleURLTypes",
              [],
          )

          url_target = None

          for item in url_types:
              schemes = item.get(
                  "CFBundleURLSchemes",
                  [],
              )

              if (
                  item.get(
                      "CFBundleURLName"
                  )
                  == "com.burbn.instagram"
                  or "instagram" in schemes
              ):
                  url_target = item
                  break

          if url_target is None:
              raise SystemExit(
                  "❌ Entrada original CFBundleURLTypes "
                  "do Instagram não encontrada"
              )

          schemes = url_target.setdefault(
              "CFBundleURLSchemes",
              [],
          )

          if "regram" not in schemes:
              schemes.append(
                  "regram"
              )

          icon_entries = {
              "2010": {
                  "CFBundleIconFiles": [
                      "2010@2x",
                      "2010@3x",
                      "2010-iPad@2x",
                      "2010-iPadPro@2x",
                  ]
              },
              "2011": {
                  "CFBundleIconFiles": [
                      "2011@2x",
                      "2011@3x",
                      "2011-iPad@2x",
                      "2011-iPadPro@2x",
                  ]
              },
              "Regram": {
                  "CFBundleIconFiles": [
                      "Regram@2x",
                      "Regram@3x",
                      "Regram-iPad@2x",
                      "Regram-iPadPro@2x",
                  ]
              },
              "Regram-2": {
                  "CFBundleIconFiles": [
                      "Regram2@2x",
                      "Regram2@3x",
                      "Regram2-iPad@2x",
                      "Regram2-iPadPro@2x",
                  ]
              },
              "Regram-Dark": {
                  "CFBundleIconFiles": [
                      "Regram-Dark@2x",
                      "Regram-Dark@3x",
                      "Regram-Dark-iPad@2x",
                      "Regram-Dark-iPadPro@2x",
                  ]
              },
          }

          bundle_icons = plist.get(
              "CFBundleIcons"
          )

          if not isinstance(
              bundle_icons,
              dict,
          ):
              raise SystemExit(
                  "❌ CFBundleIcons original não encontrado"
              )

          alternate_icons = (
              bundle_icons.setdefault(
                  "CFBundleAlternateIcons",
                  {},
              )
          )

          alternate_icons.update(
              icon_entries
          )

          # O IPA oficial do Fouad altera apenas CFBundleIcons.
          # Não adicionamos os cinco ícones em CFBundleIcons~ipad.

          app_transport_security = plist.get(
              "NSAppTransportSecurity",
              {},
          )

          if not isinstance(
              app_transport_security,
              dict,
          ):
              app_transport_security = {}

          app_transport_security[
              "NSAllowsArbitraryLoads"
          ] = True

          plist[
              "NSAppTransportSecurity"
          ] = app_transport_security

          plist[
              "UISupportsDocumentBrowser"
          ] = True

          plist[
              "UIRequiredDeviceCapabilities"
          ] = [
              "arm64"
          ]

          # Não removemos DecryptedBy: isso é metadado externo
          # do processo de descriptografia, não parte funcional
          # do Regram.

          with open(
              plist_path,
              "wb",
          ) as f:
              plistlib.dump(
                  plist,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False,
              )

          print("✅ regram:// registrado")
          print(
              "✅ 5 CFBundleAlternateIcons registrados"
          )
          print(
              "✅ Ajustes adicionais de Info.plist "
              "do Fouad aplicados"
          )

          # -----------------------------------------------------
          # VALIDAÇÃO FINAL DO PERFIL REGRAM
          # -----------------------------------------------------

          main_dependencies = Executable(
              str(main_executable)
          ).get_dependencies()

          required_main = [
              "@executable_path/RegramExtension.dylib",
              "@executable_path/Regram.dylib",
          ]

          for dependency in required_main:
              if dependency not in main_dependencies:
                  raise SystemExit(
                      "❌ Dependência principal ausente: "
                      f"{dependency}"
                  )

          expected_final_extensions = (
              expected_original_extensions
              | {
                  "PlugIns/OpenInRegramExtension.appex"
              }
          )

          found_final_extensions = set()

          for directory_name in (
              "PlugIns",
              "Extensions",
          ):
              directory = (
                  app
                  / directory_name
              )

              if directory.exists():
                  for extension in sorted(
                      directory.glob(
                          "*.appex"
                      )
                  ):
                      found_final_extensions.add(
                          str(
                              extension.relative_to(
                                  app
                              )
                          )
                      )

          if (
              found_final_extensions
              != expected_final_extensions
          ):
              raise SystemExit(
                  "❌ Estrutura final de extensões não "
                  "corresponde ao perfil estrutural do Regram"
              )

          print(
              "✅ Estrutura final validada: "
              "8 extensões originais + OpenInRegram"
          )

          # -----------------------------------------------------
          # REEMPACOTAR
          # -----------------------------------------------------

          final_path = (
              Path.cwd()
              / "Final.ipa"
          )

          if final_path.exists():
              final_path.unlink()

          subprocess.run(
              [
                  "zip",
                  "-qry",
                  str(final_path),
                  ".",
              ],
              cwd=work,
              check=True,
          )

          if not final_path.is_file():
              raise SystemExit(
                  "❌ Final.ipa não foi criado"
              )

          print()
          print(
              f"✅ Regram {addon_version} instalado seguindo o "
              "layout oficial auditado do Fouad"
          )
          PY

          regram_status=${PIPESTATUS[0]}
          set -e

          if [ "$regram_status" -ne 0 ]; then
            tail -n 80 regram-install.log > .regram-error.txt
            exit "$regram_status"
          fi

      - name: Alert Regram compatibility failure
        if: ${{ always() && steps.regram_install.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          APP_VERSION: ${{ steps.prepare.outputs.version || steps.private_input.outputs.version }}
          ADDON_VERSION: ${{ steps.prepare.outputs.addon_version }}
        run: |
          python <<'PY'
          import html
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_BOT_CHAT_ID"]
          version = html.escape(
              os.environ.get(
                  "APP_VERSION",
                  "Unknown",
              )
          )
          regram_version = html.escape(
              os.environ.get(
                  "ADDON_VERSION",
                  "Unknown",
              )
          )

          error_path = Path(
              ".regram-error.txt"
          )

          if error_path.is_file():
              raw_error = error_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).strip()
          else:
              raw_error = (
                  "Falha não detalhada durante a "
                  f"aplicação do Regram {regram_version}."
              )

          error_lines = [
              line.strip()
              for line in raw_error.splitlines()
              if line.strip()
          ]

          detail = "\n".join(
              error_lines[-12:]
          )

          if len(detail) > 2200:
              detail = detail[-2200:]

          detail = html.escape(detail)

          message = (
              "<blockquote>"
              f"⚠️ <b>Regram {regram_version} — verificação necessária</b>\n\n"
              f"📱 <b>Instagram</b> <i>{version}</i>\n\n"
              "Não foi possível aplicar integralmente o "
              f"perfil auditado do Regram {regram_version}.\n\n"
              f"<pre>{detail}</pre>\n\n"
              "O IPA não foi publicado. "
              "Verifique manualmente o que mudou nesta versão."
              "</blockquote>"
          )

          url = (
              "https://api.telegram.org/bot"
              + token
              + "/sendMessage"
          )

          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(
                  payload
              ).encode(
                  "utf-8"
              ),
              headers={
                  "Content-Type":
                      "application/json"
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:
              result = json.load(
                  response
              )

          if not result.get("ok"):
              raise RuntimeError(
                  result
              )

          print(
              "✅ Alerta de incompatibilidade do "
              "Regram enviado ao Telegram"
          )
          PY

