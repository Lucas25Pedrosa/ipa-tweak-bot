        if: ${{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id != 'com.burbn.instagram' && steps.prepare.outputs.ipapatch == 'true' && steps.prepare.outputs.ipapatch_mode == 'plugins-only' }}
