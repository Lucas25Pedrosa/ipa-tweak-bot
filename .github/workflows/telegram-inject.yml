        run: |
          python <<'PY'
          import hashlib
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          work = Path("pocketterco_validate")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with zipfile.ZipFile("Final.ipa", "r") as z:
