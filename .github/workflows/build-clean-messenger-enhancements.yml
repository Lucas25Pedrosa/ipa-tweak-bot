name: Build Clean MessengerEnhancements

on:
  push:
    paths:
      - ".github/workflows/build-clean-messenger-enhancements.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract source and remove only Messenger FBLP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/messenger-portuguese.yml')
          text = workflow.read_text(encoding='utf-8')

          source_start = "          cat > build/MessengerEnhancements.m <<'OBJC'\n"
          source_end = "          OBJC\n"
          a = text.index(source_start) + len(source_start)
          b = text.index(source_end, a)
          embedded = text[a:b]

          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          ) + "\n"

          fblp_start = "typedef id (*MPStorageIMP)(\n"
          constructor_start = "__attribute__((constructor))\n"
          a = source.index(fblp_start)
          b = source.index(constructor_start, a)
          source = source[:a] + source[b:]

          old = '''__attribute__((constructor))
          static void MessengerEnhancementsInit(void) {
              if (!MPTryInstallDoDHook()) {
                  MPScheduleDoDProbe();
              }

              dispatch_after(
          '''
          new = '''__attribute__((constructor))
          static void MessengerEnhancementsInit(void) {
              dispatch_after(
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"

          if old not in source:
              raise SystemExit('Constructor FBLP block not found')
          source = source.replace(old, new, 1)

          forbidden = [
              'FBOnDemandResourceStorage',
              'FBOnDemandLocalResourceInfo',
              'MessengerPortuguese',
              'fbt_language_pack.bin',
              'manifest.plist',
              'MPTryInstallDoDHook',
              'MPScheduleDoDProbe',
              'MPStorageReplacement',
              'MPCreateLocalResourceInfo',
          ]
          remaining = [token for token in forbidden if token in source]
          if remaining:
              raise SystemExit(f'FBLP residue in source: {remaining}')

          required = [
              'MPTranslateString',
              'MPTryInstallMSGPlusHooks',
              'MPScheduleMSGPlusProbe',
              'MSGSettingsViewController',
              'MSGMessengerWordmarkView',
              'No Screenshot Detection',
              'Upload videos as voice messages',
              'Upload photos in HD',
              'Watch stories anonymously',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'Expected enhancement missing: {missing}')

          Path('build/MessengerEnhancements.m').write_text(source, encoding='utf-8')
          Path('build/source-report.txt').write_text(
              f'Clean source lines: {len(source.splitlines())}\n'
              f'FBLP references: 0\n',
              encoding='utf-8',
          )
          print(Path('build/source-report.txt').read_text())
          PY

      - name: Compile clean arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -fobjc-arc \
            -fblocks \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -framework UIKit \
            -install_name "@rpath/MessengerEnhancements.dylib" \
            -Wl,-dead_strip \
            build/MessengerEnhancements.m \
            -o build/MessengerEnhancements.dylib

          chmod 755 build/MessengerEnhancements.dylib
          file build/MessengerEnhancements.dylib | tee build/binary-report.txt

          for token in \
            FBOnDemandResourceStorage \
            FBOnDemandLocalResourceInfo \
            MessengerPortuguese \
            fbt_language_pack.bin \
            manifest.plist; do
            if strings build/MessengerEnhancements.dylib | grep -F "$token" >/dev/null; then
              echo "FBLP residue in dylib: $token"
              exit 1
            fi
          done

          strings build/MessengerEnhancements.dylib | grep -F 'MSGSettingsViewController' >/dev/null
          strings build/MessengerEnhancements.dylib | grep -F 'MSGMessengerWordmarkView' >/dev/null

          printf 'Size: ' >> build/binary-report.txt
          wc -c < build/MessengerEnhancements.dylib >> build/binary-report.txt
          printf 'SHA256: ' >> build/binary-report.txt
          shasum -a 256 build/MessengerEnhancements.dylib | awk '{print $1}' >> build/binary-report.txt
          cat build/binary-report.txt

      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: Lucas25Pedrosa/Bot-Injector-Core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: private-core
          persist-credentials: true

      - name: Install clean dylib and source in private core
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p private-core/addons/messenger/dylib
          mkdir -p private-core/addons/messenger/source

          cp build/MessengerEnhancements.dylib \
            private-core/addons/messenger/dylib/MessengerEnhancements.dylib
          cp build/MessengerEnhancements.m \
            private-core/addons/messenger/source/MessengerEnhancements.m

          cd private-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            addons/messenger/dylib/MessengerEnhancements.dylib \
            addons/messenger/source/MessengerEnhancements.m

          git diff --cached --check -- addons/messenger/source/MessengerEnhancements.m

          if git diff --cached --quiet; then
            echo "ℹ️ Core already contains clean MessengerEnhancements"
            exit 0
          fi

          git commit -m "Remove Messenger FBLP from MessengerEnhancements"
          git push origin HEAD:main

      - name: Upload clean dylib and source
        uses: actions/upload-artifact@v4
        with:
          name: MessengerEnhancements-clean
          path: |
            build/MessengerEnhancements.dylib
            build/MessengerEnhancements.m
            build/source-report.txt
            build/binary-report.txt
          if-no-files-found: error
          retention-days: 3
