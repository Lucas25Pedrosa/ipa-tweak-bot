name: Export Messenger Native Locale YML

on:
  push:
    paths:
      - ".github/workflows/export-messenger-native-yml.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build modified workflow copy
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/telegram-inject.yml telegram-inject-messenger-native.yml

          python <<'PY'
          from pathlib import Path

          path = Path("telegram-inject-messenger-native.yml")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "          cp private-core/telegram_messenger_translation.py ./telegram_messenger_translation.py\n",
              "",
              1,
          )

          start = "      # =========================================================\n      # 3A. MESSENGER - PREPARAR TRADUÇÃO PT-BR\n      # =========================================================\n"
          end = "      # =========================================================\n      # 4. IPAPATCH\n      # =========================================================\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("Marcadores da seção 3A/4 não encontrados de forma única")
          a = text.index(start)
          b = text.index(end, a)
          text = text[:a] + end + text[b + len(end):]

          start = "      # =========================================================\n      # 11A. MESSENGER - EMBUTIR TRADUÇÃO PT-BR\n      # =========================================================\n"
          end = "      # =========================================================\n      # 12. VALIDAÇÃO\n      # =========================================================\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("Marcadores da seção 11A/12 não encontrados de forma única")

          dollar = "$"
          replacement_lines = [
              "      # =========================================================",
              "      # 11A. MESSENGER - LIMPEZA DO INFO.PLIST",
              "      # =========================================================",
              "",
              "      - name: Clean Messenger Info.plist",
              "        if: " + dollar + "{{ steps.private_input.outputs.processing_route == 'standard' && steps.prepare.outputs.bundle_id == 'com.facebook.Messenger' }}",
              "        run: |",
              "          python <<'PY'",
              "          import plistlib",
              "          import shutil",
              "          import zipfile",
              "          from pathlib import Path",
              "",
              "          work = Path(\"messenger_info_cleanup\")",
              "",
              "          if work.exists():",
              "              shutil.rmtree(work)",
              "",
              "          work.mkdir()",
              "",
              "          with zipfile.ZipFile(\"Final.ipa\", \"r\") as z:",
              "              z.extractall(work)",
              "",
              "          apps = list((work / \"Payload\").glob(\"*.app\"))",
              "",
              "          if len(apps) != 1:",
              "              raise SystemExit(\"❌ Messenger principal não identificado\")",
              "",
              "          app = apps[0]",
              "          info_path = app / \"Info.plist\"",
              "",
              "          with info_path.open(\"rb\") as f:",
              "              info = plistlib.load(f)",
              "",
              "          if info.get(\"CFBundleIdentifier\") != \"com.facebook.Messenger\":",
              "              raise SystemExit(\"❌ Bundle ID inesperado ao limpar Info.plist\")",
              "",
              "          info.pop(\"UIFileSharingEnabled\", None)",
              "          info.pop(\"LSSupportsOpeningDocumentsInPlace\", None)",
              "",
              "          with info_path.open(\"wb\") as f:",
              "              plistlib.dump(",
              "                  info,",
              "                  f,",
              "                  fmt=plistlib.FMT_BINARY,",
              "                  sort_keys=False,",
              "              )",
              "",
              "          output = Path(\"Final.ipa\")",
              "          output.unlink()",
              "",
              "          with zipfile.ZipFile(",
              "              output,",
              "              \"w\",",
              "              compression=zipfile.ZIP_DEFLATED,",
              "          ) as z:",
              "              for file in work.rglob(\"*\"):",
              "                  if file.is_file():",
              "                      z.write(file, file.relative_to(work))",
              "",
              "          print(\"✅ Chaves de File Sharing removidas\")",
              "          print(\"✅ Messenger seguirá com o idioma nativo do app/iOS\")",
              "          PY",
              "",
          ]
          replacement = "\n".join(replacement_lines) + "\n"
          a = text.index(start)
          b = text.index(end, a)
          text = text[:a] + replacement + end + text[b + len(end):]

          text = text.replace(
              "      - name: Validate Messenger MSGPlusX + pt-BR layout\n",
              "      - name: Validate Messenger MSGPlusX native locale layout\n",
              1,
          )
          text = text.replace("          import hashlib\n", "", 1)
          text = text.replace("          import json\n", "", 1)

          start = "          primary_pack = (\n              app\n              / \"MessengerPortuguese\"\n              / \"fbt_language_pack.bin\"\n          )\n"
          end = "          # As extensões devem receber somente o shim do IPA Patch.\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("Bloco de validação pt-BR não encontrado de forma única")
          a = text.index(start)
          b = text.index(end, a)
          text = text[:a] + end + text[b + len(end):]

          old = "\n".join([
              "          print(",
              "              \"✅ FBLP pt-BR e manifest validados\"",
              "          )",
              "          print(",
              "              \"✅ Versão/build da tradução correspondem ao IPA\"",
              "          )",
              "",
          ])
          new = "\n".join([
              "          print(",
              "              \"✅ Sem tradução FBLP customizada no fluxo\"",
              "          )",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit("Mensagens finais da tradução não encontradas")
          text = text.replace(old, new, 1)

          forbidden = [
              "telegram_messenger_translation.py",
              "Download and prepare Messenger pt-BR translation",
              "Embed Messenger pt-BR translation",
              "messenger_translation/fbt_language_pack.bin",
              "MessengerPortuguese/manifest.plist",
          ]
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f"Referências antigas ainda presentes: {remaining}")

          path.write_text(text, encoding="utf-8")
          PY

          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path("telegram-inject-messenger-native.yml").read_text(encoding="utf-8"))
          print("✅ YAML parseado com sucesso")
          PY

          before=$(wc -l < .github/workflows/telegram-inject.yml)
          after=$(wc -l < telegram-inject-messenger-native.yml)
          printf 'ANTES: %s linhas\nDEPOIS: %s linhas\nDIFERENÇA: %s linhas\n' "$before" "$after" "$((after-before))" | tee line-counts.txt

      - name: Upload modified workflow
        uses: actions/upload-artifact@v4
        with:
          name: telegram-inject-messenger-native
          path: |
            telegram-inject-messenger-native.yml
            line-counts.txt
          if-no-files-found: error
