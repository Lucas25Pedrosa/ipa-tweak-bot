name: One-time Lead deleted-message experiment selfcheck
on:
  push:
    paths:
      - .github/workflows/lead-ab-selfcheck-once.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/Bot-Injector-Core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: private-core
          persist-credentials: false
      - name: Validate A/B source, recipes, YAML and embedded Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pyyaml
          python3 -m py_compile private-core/scripts/validate_lead_experiment.py
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import yaml
          config=json.loads(Path("private-core/config/addons.json").read_text())
          official=Path("private-core/addons/telegram/lead/experimental/Lead.dylib")
          ptbr=Path("private-core/addons/telegram/lead/dylib/Lead.dylib")
          assert hashlib.sha256(official.read_bytes()).hexdigest()=="6fa3c3d9c501e575ccb971ffadacb754a2870844df27c36bb3e6b71944b7d290"
          assert hashlib.sha256(ptbr.read_bytes()).hexdigest()=="6b73542c40d6136dcdc1d2bff6e14d4940dc34cdb5c59d86c7a561f2ccc2b4b8"
          with zipfile.ZipFile("private-core/addons/telegram/lead/experimental/Lead.bundle.zip") as z:
              assert z.testzip() is None
              assert "Lead.bundle/langs.json" in z.namelist()
          with zipfile.ZipFile("private-core/addons/shared/zx-compat/framework/CydiaSubstrate.framework.zip") as z:
              assert z.testzip() is None
              files=[n for n in z.namelist() if n.endswith("/CydiaSubstrate")]
              assert len(files)==1 and files[0]=="CydiaSubstrate.framework/CydiaSubstrate", files
              raw=z.read(files[0])
              print("CydiaSubstrate.framework SHA256:", hashlib.sha256(raw).hexdigest(), "size:",len(raw))
          for app in ("ph.telegra.Telegraph","app.swiftgram.ios"):
              a=next(x for x in config["apps"][app]["addons"] if x["name"]=="Lead")
              assert a["ipapatch_mode"]=="all" and a["ipapatch"] is True
              assert a["files"][0]["path"]=="addons/telegram/lead/experimental/Lead.dylib"
              assert any(x["action"]=="bundle" and x["path"].endswith("Lead.bundle.zip") for x in a["files"])
              assert any(x["action"]=="frameworks" and x["path"].endswith("CydiaSubstrate.framework.zip") for x in a["files"])
              if app=="app.swiftgram.ios":
                  assert any(x["path"].endswith("SwiftgramPro.dylib") for x in a["files"])
          wf=Path(".github/workflows/telegram-inject.yml").read_text()
          assert len(wf.encode())<500*1024
          parsed=yaml.safe_load(wf)
          found=0
          for step in parsed["jobs"]["inject"]["steps"]:
              name=step.get("name","")
              if not any(key in name for key in ("Lead official", "Swiftgram ModClient", "Swiftgram V5", "Swiftgram V6", "Validate experimental")):
                  continue
              run=step.get("run","")
              for m in re.finditer(r"(?ms)^python(?:3)? <<'PY'\n(.*?)^PY$",run):
                  compile(m.group(1),name,"exec")
                  found+=1
                  print("Python inline syntax OK:",name)
          assert found>=2, f"Expected at least 2 inline Python blocks, got {found}"
          assert "private-core/scripts/validate_lead_experiment.py" in wf
          print("PASS: experiment config, binary provenance and workflow syntax")
          PY
