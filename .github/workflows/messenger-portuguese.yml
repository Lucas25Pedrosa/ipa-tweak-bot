name: Messenger 574 Portuguese V2.1 Lazy

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Messenger 574.0.0 + MSGPlusX (.ipa)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-hook:
    name: Build pt-BR V2.1 lazy hook
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Create V2.1 lazy hook source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat > build/MessengerPortugueseV21.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <dispatch/dispatch.h>
          #import <stdarg.h>

          static IMP MPOriginalBundledLoaderIMP = NULL;
          static BOOL MPHookInstalled = NO;
          static NSInteger MPProbeAttempt = 0;
          static const NSInteger MPMaxProbeAttempts = 180;

          static NSString *MPLogPath(void) {
              return [NSHomeDirectory()
                  stringByAppendingPathComponent:
                      @"Documents/MessengerPtBRFix-V21.log"];
          }

          static void MPLog(NSString *format, ...) {
              @autoreleasepool {
                  va_list args;
                  va_start(args, format);

                  NSString *message =
                      [[NSString alloc] initWithFormat:format
                                            arguments:args];

                  va_end(args);

                  NSLog(@"[MessengerPtBRFix-V21] %@", message);

                  NSString *line =
                      [NSString stringWithFormat:
                          @"%@ %@\n",
                          [NSDate date],
                          message];

                  NSData *data =
                      [line dataUsingEncoding:
                          NSUTF8StringEncoding];

                  if (!data) {
                      return;
                  }

                  NSString *path = MPLogPath();
                  NSFileManager *fm =
                      [NSFileManager defaultManager];

                  if (![fm fileExistsAtPath:path]) {
                      [data writeToFile:path atomically:YES];
                      return;
                  }

                  NSFileHandle *handle =
                      [NSFileHandle
                          fileHandleForWritingAtPath:path];

                  if (!handle) {
                      return;
                  }

                  @try {
                      [handle seekToEndOfFile];
                      [handle writeData:data];
                      [handle closeFile];
                  } @catch (__unused NSException *exception) {
                  }
              }
          }

          static NSString *MPPackPath(void) {
              return [[[NSBundle mainBundle] bundlePath]
                  stringByAppendingPathComponent:
                      @"MessengerPortuguese/fbt_language_pack.bin"];
          }

          static BOOL MPValidatePack(NSString *path) {
              NSData *data =
                  [NSData dataWithContentsOfFile:path
                                        options:
                                            NSDataReadingMappedIfSafe
                                          error:nil];

              if (data.length < 8) {
                  return NO;
              }

              const unsigned char *bytes = data.bytes;

              return bytes[4] == 'F' &&
                     bytes[5] == 'B' &&
                     bytes[6] == 'L' &&
                     bytes[7] == 'P';
          }

          static NSString *MPStringFromLocaleObject(id locale) {
              if (!locale) {
                  return @"";
              }

              if ([locale isKindOfClass:[NSString class]]) {
                  return (NSString *)locale;
              }

              NSArray<NSString *> *selectors = @[
                  @"FBLocaleString",
                  @"fbLocale",
                  @"localeIdentifier",
                  @"identifier",
                  @"locale"
              ];

              for (NSString *selectorName in selectors) {
                  SEL selector =
                      NSSelectorFromString(selectorName);

                  if (![locale respondsToSelector:selector]) {
                      continue;
                  }

                  @try {
                      id (*sendObject)(id, SEL) =
                          (id (*)(id, SEL))
                              (void *)objc_msgSend;

                      id value =
                          sendObject(locale, selector);

                      if ([value
                          isKindOfClass:[NSString class]]) {
                          return (NSString *)value;
                      }

                      if (value) {
                          NSString *description =
                              [value description];

                          if (description.length > 0) {
                              return description;
                          }
                      }
                  } @catch (__unused NSException *exception) {
                  }
              }

              @try {
                  return [locale description] ?: @"";
              } @catch (__unused NSException *exception) {
                  return @"";
              }
          }

          static NSString *MPNormalizeLocale(NSString *value) {
              if (!value) {
                  return @"";
              }

              NSString *normalized =
                  [[value
                    stringByReplacingOccurrencesOfString:@"-"
                                              withString:@"_"]
                    lowercaseString];

              normalized =
                  [normalized
                    stringByReplacingOccurrencesOfString:@" "
                                              withString:@""];

              return normalized;
          }

          static BOOL MPCurrentSystemPrefersPtBR(void) {
              NSString *preferred =
                  [[NSLocale preferredLanguages]
                      firstObject];

              NSString *normalized =
                  MPNormalizeLocale(preferred);

              return [normalized hasPrefix:@"pt_br"];
          }

          static BOOL MPIsPtBRLocale(id locale) {
              NSString *raw =
                  MPStringFromLocaleObject(locale);

              NSString *normalized =
                  MPNormalizeLocale(raw);

              if ([normalized hasPrefix:@"pt_br"]) {
                  return YES;
              }

              /*
               * Alguns objetos internos podem imprimir apenas "pt".
               * Só aceitamos nesse caso se o idioma preferido do
               * dispositivo também for Português (Brasil).
               */
              if ([normalized isEqualToString:@"pt"] &&
                  MPCurrentSystemPrefersPtBR()) {
                  return YES;
              }

              return NO;
          }

          static id MPCreateLanguagePack(id fbLocale) {
              NSString *path = MPPackPath();

              if (!MPValidatePack(path)) {
                  MPLog(@"❌ FBLP local inválido/ausente: %@",
                        path);
                  return nil;
              }

              NSData *data =
                  [NSData dataWithContentsOfFile:path
                                        options:
                                            NSDataReadingMappedIfSafe
                                          error:nil];

              if (!data) {
                  MPLog(@"❌ Não foi possível ler FBLP");
                  return nil;
              }

              Class packClass =
                  NSClassFromString(
                      @"FBFlatBufferLanguagePack");

              if (!packClass) {
                  MPLog(@"❌ FBFlatBufferLanguagePack "
                        @"ainda não existe no runtime");
                  return nil;
              }

              SEL initSelector =
                  NSSelectorFromString(
                      @"initWithLanguagePackData:"
                       "fbLocale:"
                       "shouldVerifyBuffer:");

              if (![packClass
                  instancesRespondToSelector:initSelector]) {
                  MPLog(@"❌ Initializer esperado não existe");
                  return nil;
              }

              @try {
                  id (*sendAlloc)(id, SEL) =
                      (id (*)(id, SEL))
                          (void *)objc_msgSend;

                  id allocated =
                      sendAlloc(
                          (id)packClass,
                          sel_registerName("alloc"));

                  id (*sendInit)(
                      id,
                      SEL,
                      id,
                      id,
                      BOOL
                  ) =
                      (id (*)(id, SEL, id, id, BOOL))
                          (void *)objc_msgSend;

                  id pack =
                      sendInit(
                          allocated,
                          initSelector,
                          data,
                          fbLocale,
                          NO);

                  if (pack) {
                      MPLog(@"✅ FBLP pt-BR criado localmente "
                            @"(%lu bytes)",
                            (unsigned long)data.length);
                  } else {
                      MPLog(@"❌ Initializer do FBLP "
                            @"retornou nil");
                  }

                  return pack;
              } @catch (NSException *exception) {
                  MPLog(@"❌ Exceção criando FBLP: %@",
                        exception);
                  return nil;
              }
          }

          static id MPBundledLoaderReplacement(
              id self,
              SEL _cmd,
              id bundle,
              id fbLocale
          ) {
              NSString *localeString =
                  MPStringFromLocaleObject(fbLocale);

              MPLog(@"Loader chamado: locale=%@",
                    localeString);

              if (MPIsPtBRLocale(fbLocale)) {
                  MPLog(@"🇧🇷 Solicitação pt_BR detectada");

                  id localPack =
                      MPCreateLanguagePack(fbLocale);

                  if (localPack) {
                      MPLog(@"✅ Entregando pt-BR local "
                            @"ao Messenger");
                      return localPack;
                  }

                  MPLog(@"⚠️ Falha no pack local; "
                        @"usando loader original");
              }

              if (MPOriginalBundledLoaderIMP) {
                  id (*original)(
                      id,
                      SEL,
                      id,
                      id
                  ) =
                      (id (*)(id, SEL, id, id))
                          MPOriginalBundledLoaderIMP;

                  return original(
                      self,
                      _cmd,
                      bundle,
                      fbLocale);
              }

              MPLog(@"❌ IMP original indisponível");
              return nil;
          }

          static BOOL MPTryInstallHook(void) {
              if (MPHookInstalled) {
                  return YES;
              }

              Class loaderClass =
                  NSClassFromString(
                      @"FBBundledLanguagePackLoader");

              Class packClass =
                  NSClassFromString(
                      @"FBFlatBufferLanguagePack");

              if (!loaderClass || !packClass) {
                  return NO;
              }

              SEL selector =
                  NSSelectorFromString(
                      @"loadLanguagePackFromBundle:"
                       "fbLocale:");

              Method method =
                  class_getInstanceMethod(
                      loaderClass,
                      selector);

              if (!method) {
                  MPLog(@"⚠️ Classe encontrada, mas "
                        @"selector instance ainda ausente");
                  return NO;
              }

              IMP current =
                  method_getImplementation(method);

              if (!current) {
                  MPLog(@"⚠️ IMP original inválida");
                  return NO;
              }

              MPOriginalBundledLoaderIMP = current;

              IMP previous =
                  method_setImplementation(
                      method,
                      (IMP)
                          MPBundledLoaderReplacement);

              if (!previous) {
                  MPLog(@"❌ method_setImplementation "
                        @"não retornou IMP anterior");
                  MPOriginalBundledLoaderIMP = NULL;
                  return NO;
              }

              MPOriginalBundledLoaderIMP = previous;
              MPHookInstalled = YES;

              MPLog(@"✅ Hook lazy instalado em "
                    @"FBBundledLanguagePackLoader");
              MPLog(@"Pack local válido=%@ path=%@",
                    MPValidatePack(MPPackPath())
                        ? @"SIM"
                        : @"NÃO",
                    MPPackPath());

              return YES;
          }

          static void MPScheduleProbe(void);

          static void MPProbeRuntime(void) {
              @autoreleasepool {
                  if (MPHookInstalled) {
                      return;
                  }

                  MPProbeAttempt += 1;

                  BOOL installed =
                      MPTryInstallHook();

                  if (installed) {
                      return;
                  }

                  if (MPProbeAttempt == 1 ||
                      MPProbeAttempt % 10 == 0) {
                      MPLog(@"Aguardando runtime LightSpeed "
                            @"(tentativa %ld/%ld)",
                            (long)MPProbeAttempt,
                            (long)MPMaxProbeAttempts);
                  }

                  if (MPProbeAttempt <
                      MPMaxProbeAttempts) {
                      MPScheduleProbe();
                  } else {
                      MPLog(@"❌ Timeout aguardando "
                            @"FBBundledLanguagePackLoader");
                  }
              }
          }

          static void MPScheduleProbe(void) {
              dispatch_after(
                  dispatch_time(
                      DISPATCH_TIME_NOW,
                      (int64_t)(
                          2.0 *
                          NSEC_PER_SEC)),
                  dispatch_get_main_queue(),
                  ^{
                      MPProbeRuntime();
                  });
          }

          __attribute__((constructor))
          static void MessengerPortugueseV21Init(void) {
              /*
               * IMPORTANTE:
               * não fazemos hook, dlopen ou chamada a classes
               * privadas durante o constructor.
               *
               * Apenas agendamos a primeira verificação para
               * depois que o Messenger já estiver inicializando.
               */
              MPScheduleProbe();
          }
          OBJC

      - name: Compile arm64 iOS dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -fobjc-arc \
            -fblocks \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -install_name "@rpath/MessengerPortugueseV21.dylib" \
            -Wl,-dead_strip \
            build/MessengerPortugueseV21.m \
            -o build/MessengerPortugueseV21.dylib

          chmod 755 build/MessengerPortugueseV21.dylib

          file build/MessengerPortugueseV21.dylib
          shasum -a 256 build/MessengerPortugueseV21.dylib

          file build/MessengerPortugueseV21.dylib \
            | grep -qi arm64

      - name: Upload V2.1 dylib
        uses: actions/upload-artifact@v6
        with:
          name: messenger-portuguese-v21-dylib
          path: build/MessengerPortugueseV21.dylib
          if-no-files-found: error
          retention-days: 3

  patch-messenger:
    name: Inject V2.1 and build IPA
    needs: build-hook
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            file \
            unzip \
            zip

      - name: Install IPA Patch 2.1.3
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --location \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch
          ./ipapatch --version

      - name: Download V2.1 dylib
        uses: actions/download-artifact@v7
        with:
          name: messenger-portuguese-v21-dylib
          path: hook

      - name: Download Messenger and validate Portuguese FBLP
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq input.ipa > /dev/null

          PACK_SOURCE="addons/messenger-portuguese/beb8b2a724c4d86596dd48520bf328cb"

          test -f "$PACK_SOURCE"
          cp "$PACK_SOURCE" portuguese.fblp

          EXPECTED_SHA256="918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2"
          ACTUAL_SHA256="$(sha256sum portuguese.fblp | awk '{print $1}')"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ SHA-256 do FBLP não corresponde"
            echo "Esperado: $EXPECTED_SHA256"
            echo "Atual:    $ACTUAL_SHA256"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          data = Path("portuguese.fblp").read_bytes()

          if len(data) != 1197992:
              raise SystemExit(
                  f"❌ Tamanho inesperado: {len(data)}"
              )

          if data[4:8] != b"FBLP":
              raise SystemExit(
                  f"❌ Identificador FBLP inválido: "
                  f"{data[:8]!r}"
              )

          print("✅ FBLP pt-BR 574 validado")
          PY

      - name: Extract and validate Messenger 574 MSGPlusX
        id: messenger
        shell: bash
        run: |
          set -euo pipefail

          rm -rf baseline
          mkdir -p baseline

          unzip -q input.ipa -d baseline

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("baseline/Payload")
          apps = list(payload.glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app; encontrei {len(apps)}"
              )

          app = apps[0]

          plist_path = app / "Info.plist"

          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          executable = info.get("CFBundleExecutable")
          version = str(
              info.get("CFBundleShortVersionString", "")
          )
          build = str(
              info.get("CFBundleVersion", "")
          )
          bundle_id = str(
              info.get("CFBundleIdentifier", "")
          )

          if not executable:
              raise SystemExit(
                  "❌ CFBundleExecutable ausente"
              )

          if version != "574.0.0":
              raise SystemExit(
                  "❌ Workflow exclusivo para Messenger "
                  f"574.0.0; encontrado {version!r}"
              )

          required = [
              app / executable,
              app / "Frameworks"
                    / "LightSpeedEngine.framework"
                    / "LightSpeedEngine",
              app / "Frameworks"
                    / "MSGPlusX.dylib",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Arquivo obrigatório ausente: "
                      f"{path}"
                  )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as out:
              out.write(f"app_name={app.name}\n")
              out.write(f"executable={executable}\n")
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"version={version}\n")
              out.write(f"build={build}\n")

          print("✅ Messenger alvo validado")
          print(f"App: {app.name}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Versão: {version}")
          print(f"Build: {build}")
          PY

      - name: Enable Documents access for V2.1 log
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path(
              "baseline/Payload"
          ) / os.environ["APP_NAME"]

          plist_path = app / "Info.plist"

          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True

          with plist_path.open("wb") as f:
              plistlib.dump(
                  info,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False,
              )

          print(
              "✅ File Sharing habilitado para "
              "recuperar MessengerPtBRFix-V21.log"
          )
          PY

      - name: Create isolated IPA for main injection
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf isolated
          cp -a baseline isolated

          APP="isolated/Payload/$APP_NAME"

          # Só no IPA temporário do ipapatch.
          rm -rf "$APP/PlugIns"

          (
            cd isolated
            zip -qry9 ../isolated-input.ipa Payload
          )

          unzip -tq isolated-input.ipa > /dev/null

          echo "✅ IPA temporário preparado"

      - name: Inject V2.1 dylib into main Messenger executable
        shell: bash
        run: |
          set -euo pipefail

          test -f hook/MessengerPortugueseV21.dylib

          chmod 755 \
            hook/MessengerPortugueseV21.dylib

          ./ipapatch \
            --input isolated-input.ipa \
            --output isolated-patched.ipa \
            --dylib hook/MessengerPortugueseV21.dylib \
            --noconfirm

          unzip -tq isolated-patched.ipa > /dev/null

          echo "✅ V2.1 injetada no main executable"

      - name: Merge patched main into untouched original structure
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf patched
          mkdir -p patched

          unzip -q \
            isolated-patched.ipa \
            -d patched

          PATCHED_APP="patched/Payload/$APP_NAME"
          FINAL_APP="baseline/Payload/$APP_NAME"

          cp \
            "$PATCHED_APP/$EXECUTABLE" \
            "$FINAL_APP/$EXECUTABLE"

          chmod 755 \
            "$FINAL_APP/$EXECUTABLE"

          mkdir -p \
            "$FINAL_APP/Frameworks"

          cp \
            hook/MessengerPortugueseV21.dylib \
            "$FINAL_APP/Frameworks/MessengerPortugueseV21.dylib"

          chmod 755 \
            "$FINAL_APP/Frameworks/MessengerPortugueseV21.dylib"

          echo "✅ Main substituído"
          echo "✅ PlugIns originais preservados"

      - name: Embed exact Messenger 574 pt-BR language pack
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"

          mkdir -p \
            "$APP/MessengerPortuguese"

          mkdir -p \
            "$APP/pt.lproj"

          cp \
            portuguese.fblp \
            "$APP/MessengerPortuguese/fbt_language_pack.bin"

          cp \
            portuguese.fblp \
            "$APP/pt.lproj/fbt_language_pack.bin"

          chmod 644 \
            "$APP/MessengerPortuguese/fbt_language_pack.bin" \
            "$APP/pt.lproj/fbt_language_pack.bin"

          echo "✅ FBLP pt-BR incorporado"

      - name: Validate V2.1 final structure
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"
          MAIN="$APP/$EXECUTABLE"
          DYLIB="$APP/Frameworks/MessengerPortugueseV21.dylib"
          PACK="$APP/MessengerPortuguese/fbt_language_pack.bin"

          test -f "$MAIN"
          test -f "$DYLIB"
          test -f "$PACK"
          test -f \
            "$APP/pt.lproj/fbt_language_pack.bin"

          test -d \
            "$APP/PlugIns"

          sha256sum "$PACK" \
            | grep -F \
              "918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2"

          strings "$MAIN" \
            | grep -F \
              "MessengerPortugueseV21.dylib" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "FBBundledLanguagePackLoader" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "loadLanguagePackFromBundle:fbLocale:" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "MessengerPtBRFix-V21.log" \
            > /dev/null

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path(
              "baseline/Payload"
          ) / os.environ["APP_NAME"]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("UIFileSharingEnabled") is not True:
              raise SystemExit(
                  "❌ UIFileSharingEnabled não foi aplicado"
              )

          print("✅ Estrutura V2.1 validada")
          PY

      - name: Build final V2.1 IPA
        shell: bash
        run: |
          set -euo pipefail

          (
            cd baseline
            zip -qry9 \
              ../Messenger-574-MSGPlusX-Portuguese-V2.1.ipa \
              Payload
          )

          unzip -tq \
            Messenger-574-MSGPlusX-Portuguese-V2.1.ipa \
            > /dev/null

          ls -lh \
            Messenger-574-MSGPlusX-Portuguese-V2.1.ipa

          sha256sum \
            Messenger-574-MSGPlusX-Portuguese-V2.1.ipa

          echo "✅ IPA V2.1 final criado"

      - name: Upload final V2.1 IPA
        uses: actions/upload-artifact@v6
        with:
          name: Messenger-574-MSGPlusX-Portuguese-V2.1
          path: Messenger-574-MSGPlusX-Portuguese-V2.1.ipa
          if-no-files-found: error
          retention-days: 3
