name: Messenger 574 Final pt-BR + MSGPlusX

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Messenger 574.0.0 já com MSGPlusX (.ipa)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-enhancements:
    name: Build MessengerEnhancements
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Create final production tweak source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat > build/MessengerEnhancements.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <dispatch/dispatch.h>

          static NSString *MPTranslateString(id value) {
              if (!value ||
                  ![value isKindOfClass:[NSString class]]) {
                  return value;
              }

              NSString *string = (NSString *)value;

              static NSDictionary<NSString *, NSString *> *map;
              static dispatch_once_t onceToken;

              dispatch_once(&onceToken, ^{
                  map = @{
                      @"New Version Available : %@":
                          @"Nova versão disponível: %@",
                      @"Update":
                          @"Atualizar",
                      @"Cancel":
                          @"Cancelar",
                      @"Upload video to voice message":
                          @"Enviar vídeo como mensagem de voz",
                      @"Record":
                          @"Gravar",
                      @"Upload Video":
                          @"Enviar vídeo",
                      @"Export failed":
                          @"Falha ao exportar",
                      @"Recorder not found":
                          @"Gravador não encontrado",
                      @"Do you want to call?":
                          @"Deseja fazer a chamada?",
                      @"Failed to save photo":
                          @"Falha ao salvar a foto",
                      @"Photo saved":
                          @"Foto salva",

                      @"Chat":
                          @"Chat",
                      @"Support densor":
                          @"Apoiar DeNsor",
                      @"TABS":
                          @"ABAS",
                      @"Confirmation":
                          @"Confirmação",

                      @"View Photos Unlimited":
                          @"Ver fotos ilimitadamente",
                      @"View 'view once' photos more than once":
                          @"Veja fotos de visualização única mais de uma vez",

                      @"View Videos Unlimited":
                          @"Ver vídeos ilimitadamente",
                      @"View 'view once' videos more than once":
                          @"Veja vídeos de visualização única mais de uma vez",

                      @"Read Chats Anonymously":
                          @"Ler conversas anonimamente",
                      @"Read chats without marking them as read":
                          @"Leia conversas sem marcá-las como lidas",

                      @"Download photos [HD]":
                          @"Baixar fotos [HD]",
                      @"Long-press to save 'view once' photos":
                          @"Mantenha pressionado para salvar fotos de visualização única",

                      @"Download videos":
                          @"Baixar vídeos",
                      @"Long-press to save 'view once' videos":
                          @"Mantenha pressionado para salvar vídeos de visualização única",

                      @"Loop videos":
                          @"Repetir vídeos",

                      @"No Screenshot Detection":
                          @"Sem detecção de captura de tela",

                      @"Upload videos as voice messages":
                          @"Enviar vídeos como mensagens de voz",
                      @"Videos will be sent as 'voice messages'":
                          @"Os vídeos serão enviados como mensagens de voz",

                      @"Upload photos in HD":
                          @"Enviar fotos em HD",
                      @"Photos will be uploaded in HD quality":
                          @"As fotos serão enviadas em qualidade HD",

                      @"Watch stories anonymously":
                          @"Ver stories anonimamente",
                      @"Watch without marking them as seen":
                          @"Veja stories sem marcá-los como visualizados",

                      @"Remove Tray Stories":
                          @"Remover bandeja de stories",
                      @"Hides Stories Tray In Main Feed":
                          @"Oculta a bandeja de stories no feed principal",

                      @"Call Confirmation":
                          @"Confirmação de chamada",
                      @"Show alert before calling someone":
                          @"Mostrar um alerta antes de fazer uma chamada",

                      @"Hide Reply Bar":
                          @"Ocultar barra de resposta",
                      @"Hide reply bar in stoires":
                          @"Ocultar a barra de resposta nos stories",

                      @"Hide 'Stories' tab":
                          @"Ocultar aba “Stories”",
                      @"Hide 'Menu' tab":
                          @"Ocultar aba “Menu”",
                      @"Hide 'Notifications' tab":
                          @"Ocultar aba “Notificações”",
                      @"Hide 'Chats' tab":
                          @"Ocultar aba “Conversas”",

                      @"More by DeNsor":
                          @"Mais de DeNsor",

                      @"MSGPlusX [Read this]":
                          @"MSGPlusX [Leia isto]",

                      @"Disables the 'You took a screenshot' notification in chats":
                          @"Desativa a notificação de captura de tela nas conversas",

                      @"Uploading videos as voice messages works amazingly on jailbroken devices and with sideload methods, but on LiveContainer you may not be able to play the voice messages you upload. However, other people can still play them on their side.":
                          @"O envio de vídeos como mensagens de voz funciona muito bem em dispositivos com jailbreak e por sideload. No LiveContainer, talvez você não consiga reproduzir as mensagens de voz enviadas, mas as outras pessoas ainda poderão reproduzi-las normalmente.",

                      @"Default":
                          @"Padrão"
                  };
              });

              NSString *translated = map[string];

              if (translated) {
                  return translated;
              }

              static NSArray<NSArray<NSString *> *> *prefixes;
              static dispatch_once_t prefixOnce;

              dispatch_once(&prefixOnce, ^{
                  prefixes = @[
                      @[@"New Version Available : ",
                        @"Nova versão disponível: "],
                      @[@"iOS Version : ",
                        @"Versão do iOS: "],
                      @[@"Device : ",
                        @"Dispositivo: "],
                      @[@"Messenger Version : ",
                        @"Versão do Messenger: "],
                      @[@"MSGPlusX Version : ",
                        @"Versão do MSGPlusX: "],
                      @[@"Bundle : ",
                        @"Bundle: "],
                      @[@"Status : ",
                        @"Status: "]
                  ];
              });

              for (NSArray<NSString *> *pair in prefixes) {
                  NSString *source = pair[0];
                  NSString *destination = pair[1];

                  if ([string hasPrefix:source]) {
                      return [
                          destination stringByAppendingString:
                              [string substringFromIndex:source.length]
                      ];
                  }
              }

              return string;
          }

          typedef id (*MPLabelIMP)(
              id,
              SEL,
              id,
              id,
              id
          );

          typedef id (*MPSectionIMP)(
              id,
              SEL,
              id
          );

          typedef id (*MPSwitchIMP)(
              id,
              SEL,
              id,
              id,
              id,
              BOOL,
              SEL
          );

          typedef id (*MPNewButtonIMP)(
              id,
              SEL,
              id,
              id,
              SEL,
              id
          );

          typedef id (*MPButtonIMP)(
              id,
              SEL,
              id,
              id,
              SEL,
              id,
              id
          );

          static MPLabelIMP MPOrigLabel = NULL;
          static MPSectionIMP MPOrigSection = NULL;
          static MPSwitchIMP MPOrigSwitch = NULL;
          static MPNewButtonIMP MPOrigNewButton = NULL;
          static MPButtonIMP MPOrigButton = NULL;

          static id MPLabelReplacement(
              id self,
              SEL _cmd,
              id title,
              id detail,
              id key
          ) {
              return MPOrigLabel(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  MPTranslateString(detail),
                  key
              );
          }

          static id MPSectionReplacement(
              id self,
              SEL _cmd,
              id title
          ) {
              return MPOrigSection(
                  self,
                  _cmd,
                  MPTranslateString(title)
              );
          }

          static id MPSwitchReplacement(
              id self,
              SEL _cmd,
              id title,
              id detail,
              id key,
              BOOL defaultValue,
              SEL action
          ) {
              return MPOrigSwitch(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  MPTranslateString(detail),
                  key,
                  defaultValue,
                  action
              );
          }

          static id MPNewButtonReplacement(
              id self,
              SEL _cmd,
              id title,
              id detail,
              SEL action,
              id color
          ) {
              return MPOrigNewButton(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  MPTranslateString(detail),
                  action,
                  color
              );
          }

          static id MPButtonReplacement(
              id self,
              SEL _cmd,
              id title,
              id detail,
              SEL action,
              id color,
              id image
          ) {
              return MPOrigButton(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  MPTranslateString(detail),
                  action,
                  color,
                  image
              );
          }

          typedef id (*MPAlertControllerIMP)(
              id,
              SEL,
              id,
              id,
              NSInteger
          );

          typedef id (*MPAlertActionIMP)(
              id,
              SEL,
              id,
              NSInteger,
              id
          );

          static MPAlertControllerIMP MPOrigAlertController = NULL;
          static MPAlertActionIMP MPOrigAlertAction = NULL;

          static id MPAlertControllerReplacement(
              id self,
              SEL _cmd,
              id title,
              id message,
              NSInteger style
          ) {
              return MPOrigAlertController(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  MPTranslateString(message),
                  style
              );
          }

          static id MPAlertActionReplacement(
              id self,
              SEL _cmd,
              id title,
              NSInteger style,
              id handler
          ) {
              return MPOrigAlertAction(
                  self,
                  _cmd,
                  MPTranslateString(title),
                  style,
                  handler
              );
          }

          typedef void (*MPWordmarkLayoutIMP)(
              id,
              SEL
          );

          static MPWordmarkLayoutIMP MPOrigWordmarkLayout = NULL;

          static void MPSetHidden(
              id object,
              BOOL hidden
          ) {
              if (!object ||
                  ![object respondsToSelector:
                      @selector(setHidden:)]) {
                  return;
              }

              ((void (*)(id, SEL, BOOL))
                  (void *)objc_msgSend)(
                      object,
                      @selector(setHidden:),
                      hidden
                  );
          }

          static void MPWordmarkLayoutReplacement(
              id self,
              SEL _cmd
          ) {
              if (MPOrigWordmarkLayout) {
                  MPOrigWordmarkLayout(
                      self,
                      _cmd
                  );
              }

              id customLabel =
                  ((id (*)(id, SEL, NSInteger))
                      (void *)objc_msgSend)(
                          self,
                          @selector(viewWithTag:),
                          (NSInteger)0x26B7
                      );

              Ivar imageIvar =
                  class_getInstanceVariable(
                      object_getClass(self),
                      "_imageView"
                  );

              id originalImageView = nil;

              if (imageIvar) {
                  originalImageView =
                      object_getIvar(
                          self,
                          imageIvar
                      );
              }

              if (originalImageView) {
                  MPSetHidden(
                      originalImageView,
                      NO
                  );

                  MPSetHidden(
                      customLabel,
                      YES
                  );
              } else if (customLabel) {
                  MPSetHidden(
                      customLabel,
                      NO
                  );

                  if ([customLabel respondsToSelector:
                      @selector(setText:)]) {
                      ((void (*)(id, SEL, id))
                          (void *)objc_msgSend)(
                              customLabel,
                              @selector(setText:),
                              @"messenger"
                          );
                  }
              }
          }

          static BOOL MPMSGPlusHooksInstalled = NO;
          static NSInteger MPMSGPlusProbeAttempt = 0;

          static BOOL MPHookInstanceMethod(
              Class cls,
              const char *selectorName,
              IMP replacement,
              IMP *original,
              unsigned int expectedArguments
          ) {
              if (!cls ||
                  !selectorName ||
                  !replacement ||
                  !original) {
                  return NO;
              }

              SEL selector =
                  sel_registerName(
                      selectorName
                  );

              Method method =
                  class_getInstanceMethod(
                      cls,
                      selector
                  );

              if (!method) {
                  return NO;
              }

              if (method_getNumberOfArguments(method) !=
                  expectedArguments) {
                  return NO;
              }

              IMP previous =
                  method_setImplementation(
                      method,
                      replacement
                  );

              if (!previous) {
                  return NO;
              }

              *original = previous;
              return YES;
          }

          static BOOL MPHookClassMethod(
              Class cls,
              const char *selectorName,
              IMP replacement,
              IMP *original,
              unsigned int expectedArguments
          ) {
              if (!cls) {
                  return NO;
              }

              SEL selector =
                  sel_registerName(
                      selectorName
                  );

              Method method =
                  class_getClassMethod(
                      cls,
                      selector
                  );

              if (!method) {
                  return NO;
              }

              if (method_getNumberOfArguments(method) !=
                  expectedArguments) {
                  return NO;
              }

              IMP previous =
                  method_setImplementation(
                      method,
                      replacement
                  );

              if (!previous) {
                  return NO;
              }

              *original = previous;
              return YES;
          }

          static BOOL MPTryInstallMSGPlusHooks(void) {
              if (MPMSGPlusHooksInstalled) {
                  return YES;
              }

              Class settingsClass =
                  objc_getClass(
                      "MSGSettingsViewController"
                  );

              Class wordmarkClass =
                  objc_getClass(
                      "MSGMessengerWordmarkView"
                  );

              if (!settingsClass ||
                  !wordmarkClass) {
                  return NO;
              }

              BOOL ok = YES;

              if (!MPOrigLabel) {
                  ok = MPHookInstanceMethod(
                      settingsClass,
                      "labelTitle:detailTitle:key:",
                      (IMP)MPLabelReplacement,
                      (IMP *)&MPOrigLabel,
                      5
                  ) && ok;
              }

              if (!MPOrigSection) {
                  ok = MPHookInstanceMethod(
                      settingsClass,
                      "Section:",
                      (IMP)MPSectionReplacement,
                      (IMP *)&MPOrigSection,
                      3
                  ) && ok;
              }

              if (!MPOrigSwitch) {
                  ok = MPHookInstanceMethod(
                      settingsClass,
                      "switchTitle:detailTitle:key:"
                      "defaultValue:Action:",
                      (IMP)MPSwitchReplacement,
                      (IMP *)&MPOrigSwitch,
                      7
                  ) && ok;
              }

              if (!MPOrigNewButton) {
                  ok = MPHookInstanceMethod(
                      settingsClass,
                      "newbutton:detailTitle:"
                      "action:color:",
                      (IMP)MPNewButtonReplacement,
                      (IMP *)&MPOrigNewButton,
                      6
                  ) && ok;
              }

              if (!MPOrigButton) {
                  ok = MPHookInstanceMethod(
                      settingsClass,
                      "button:detailTitle:"
                      "action:color:image:",
                      (IMP)MPButtonReplacement,
                      (IMP *)&MPOrigButton,
                      7
                  ) && ok;
              }

              if (!MPOrigWordmarkLayout) {
                  ok = MPHookInstanceMethod(
                      wordmarkClass,
                      "layoutSubviews",
                      (IMP)MPWordmarkLayoutReplacement,
                      (IMP *)&MPOrigWordmarkLayout,
                      2
                  ) && ok;
              }

              Class alertControllerClass =
                  objc_getClass(
                      "UIAlertController"
                  );

              if (!MPOrigAlertController &&
                  alertControllerClass) {
                  MPHookClassMethod(
                      alertControllerClass,
                      "alertControllerWithTitle:"
                      "message:preferredStyle:",
                      (IMP)MPAlertControllerReplacement,
                      (IMP *)&MPOrigAlertController,
                      5
                  );
              }

              Class alertActionClass =
                  objc_getClass(
                      "UIAlertAction"
                  );

              if (!MPOrigAlertAction &&
                  alertActionClass) {
                  MPHookClassMethod(
                      alertActionClass,
                      "actionWithTitle:"
                      "style:handler:",
                      (IMP)MPAlertActionReplacement,
                      (IMP *)&MPOrigAlertAction,
                      5
                  );
              }

              if (ok &&
                  MPOrigLabel &&
                  MPOrigSection &&
                  MPOrigSwitch &&
                  MPOrigNewButton &&
                  MPOrigButton &&
                  MPOrigWordmarkLayout) {
                  MPMSGPlusHooksInstalled = YES;
                  return YES;
              }

              return NO;
          }

          static void MPScheduleMSGPlusProbe(void);

          static void MPMSGPlusProbe(void) {
              if (MPMSGPlusHooksInstalled) {
                  return;
              }

              MPMSGPlusProbeAttempt += 1;

              if (MPTryInstallMSGPlusHooks()) {
                  return;
              }

              if (MPMSGPlusProbeAttempt < 400) {
                  MPScheduleMSGPlusProbe();
              }
          }

          static void MPScheduleMSGPlusProbe(void) {
              NSTimeInterval delay =
                  MPMSGPlusProbeAttempt < 100
                      ? 0.025
                      : 0.100;

              dispatch_after(
                  dispatch_time(
                      DISPATCH_TIME_NOW,
                      (int64_t)(
                          delay * NSEC_PER_SEC
                      )
                  ),
                  dispatch_get_global_queue(
                      QOS_CLASS_USER_INITIATED,
                      0
                  ),
                  ^{
                      MPMSGPlusProbe();
                  }
              );
          }

          typedef id (*MPStorageIMP)(
              id,
              SEL,
              id,
              id,
              id,
              BOOL
          );

          static MPStorageIMP MPOriginalStorageIMP = NULL;
          static BOOL MPDoDHookInstalled = NO;
          static NSInteger MPDoDProbeAttempt = 0;
          static const NSInteger MPMaxDoDProbeAttempts = 500;

          static NSString *MPPackDirectory(void) {
              return [
                  [[NSBundle mainBundle] bundlePath]
                  stringByAppendingPathComponent:
                      @"MessengerPortuguese"
              ];
          }

          static NSString *MPPackPath(void) {
              return [
                  MPPackDirectory()
                  stringByAppendingPathComponent:
                      @"fbt_language_pack.bin"
              ];
          }

          static NSDictionary *MPManifest(void) {
              NSString *path = [
                  MPPackDirectory()
                  stringByAppendingPathComponent:
                      @"manifest.plist"
              ];

              NSDictionary *manifest =
                  [NSDictionary
                      dictionaryWithContentsOfFile:path];

              return manifest ?: @{};
          }

          static BOOL MPValidatePack(void) {
              NSData *data =
                  [NSData
                      dataWithContentsOfFile:
                          MPPackPath()
                      options:
                          NSDataReadingMappedIfSafe
                      error:
                          nil];

              if (data.length < 8) {
                  return NO;
              }

              const unsigned char *bytes =
                  data.bytes;

              return (
                  bytes[4] == 'F' &&
                  bytes[5] == 'B' &&
                  bytes[6] == 'L' &&
                  bytes[7] == 'P'
              );
          }

          static NSString *MPSafeString(id value) {
              if (!value) {
                  return @"";
              }

              if ([value
                  isKindOfClass:[NSString class]]) {
                  return value;
              }

              return [value description] ?: @"";
          }

          static NSString *MPNormalize(
              NSString *value
          ) {
              if (!value) {
                  return @"";
              }

              return [[
                  value
                  stringByReplacingOccurrencesOfString:
                      @"-"
                  withString:
                      @"_"
              ] lowercaseString];
          }

          static BOOL MPIsLanguagePackRequest(
              id resourceName
          ) {
              NSString *name =
                  [[MPSafeString(resourceName)
                    lowercaseString]
                    stringByTrimmingCharactersInSet:
                        [NSCharacterSet
                            whitespaceAndNewlineCharacterSet]];

              return (
                  [name
                      containsString:
                          @"fbt_language_pack"] ||
                  [name
                      containsString:
                          @"language_pack"]
              );
          }

          static BOOL MPIsPtBRFlavor(
              id flavor
          ) {
              NSString *normalized =
                  MPNormalize(
                      MPSafeString(flavor)
                  );

              if ([normalized
                  containsString:@"pt_br"]) {
                  return YES;
              }

              if ([normalized
                  isEqualToString:@"pt"]) {
                  NSString *preferred =
                      MPNormalize(
                          [[NSLocale
                              preferredLanguages]
                              firstObject]
                      );

                  return [
                      preferred
                      hasPrefix:@"pt_br"
                  ];
              }

              return NO;
          }

          static NSNumber *MPBuildNumber(void) {
              id value =
                  MPManifest()[
                      @"BuildNumber"
                  ];

              if ([value
                  isKindOfClass:[NSNumber class]]) {
                  return value;
              }

              if ([value
                  isKindOfClass:[NSString class]]) {
                  long long parsed =
                      [(NSString *)value
                          longLongValue];

                  if (parsed > 0) {
                      return @(parsed);
                  }
              }

              NSString *bundleBuild =
                  [[NSBundle mainBundle]
                      objectForInfoDictionaryKey:
                          @"CFBundleVersion"];

              return @(
                  [bundleBuild longLongValue]
              );
          }

          static NSString *MPContentHash(void) {
              id value =
                  MPManifest()[
                      @"ContentHash"
                  ];

              if ([value
                  isKindOfClass:[NSString class]]) {
                  return value;
              }

              return @"";
          }

          static NSString *MPChecksum(void) {
              id value =
                  MPManifest()[
                      @"Checksum"
                  ];

              if ([value
                  isKindOfClass:[NSString class]]) {
                  return value;
              }

              return @"";
          }

          static id MPCreateLocalResourceInfo(void) {
              if (!MPValidatePack()) {
                  return nil;
              }

              Class infoClass =
                  NSClassFromString(
                      @"FBOnDemandLocalResourceInfo"
                  );

              if (!infoClass) {
                  return nil;
              }

              NSString *path =
                  MPPackPath();

              NSNumber *buildNumber =
                  MPBuildNumber();

              NSString *contentHash =
                  MPContentHash();

              NSString *checksum =
                  MPChecksum();

              SEL init5 =
                  NSSelectorFromString(
                      @"initWithBuildNumber:"
                       "resourcePath:"
                       "contentHash:"
                       "checksum:"
                       "clientProvidedHashVerified:"
                  );

              if ([infoClass
                  instancesRespondToSelector:init5]) {
                  id allocated =
                      ((id (*)(id, SEL))
                          (void *)objc_msgSend)(
                              (id)infoClass,
                              sel_registerName("alloc")
                          );

                  id info =
                      ((id (*)(
                          id,
                          SEL,
                          id,
                          id,
                          id,
                          id,
                          BOOL
                      ))(void *)objc_msgSend)(
                          allocated,
                          init5,
                          buildNumber,
                          path,
                          contentHash,
                          checksum,
                          YES
                      );

                  if (info) {
                      return info;
                  }
              }

              SEL init3 =
                  NSSelectorFromString(
                      @"initWithBuildNumber:"
                       "resourcePath:"
                       "checksum:"
                  );

              if ([infoClass
                  instancesRespondToSelector:init3]) {
                  id allocated =
                      ((id (*)(id, SEL))
                          (void *)objc_msgSend)(
                              (id)infoClass,
                              sel_registerName("alloc")
                          );

                  return ((id (*)(
                      id,
                      SEL,
                      id,
                      id,
                      id
                  ))(void *)objc_msgSend)(
                      allocated,
                      init3,
                      buildNumber,
                      path,
                      checksum
                  );
              }

              return nil;
          }

          static id MPStorageReplacement(
              id self,
              SEL _cmd,
              id resourceName,
              id flavor,
              id fetchType,
              BOOL requiresClientProvidedHashVerified
          ) {
              if (
                  MPIsLanguagePackRequest(
                      resourceName
                  ) &&
                  MPIsPtBRFlavor(
                      flavor
                  )
              ) {
                  id localInfo =
                      MPCreateLocalResourceInfo();

                  if (localInfo) {
                      return localInfo;
                  }
              }

              if (!MPOriginalStorageIMP) {
                  return nil;
              }

              return MPOriginalStorageIMP(
                  self,
                  _cmd,
                  resourceName,
                  flavor,
                  fetchType,
                  requiresClientProvidedHashVerified
              );
          }

          static BOOL MPTryInstallDoDHook(void) {
              if (MPDoDHookInstalled) {
                  return YES;
              }

              Class storageClass =
                  objc_getClass(
                      "FBOnDemandResourceStorage"
                  );

              if (!storageClass) {
                  return NO;
              }

              SEL selector =
                  sel_registerName(
                      "_fetchMostRecentResourceWithName:"
                      "flavor:"
                      "fetchType:"
                      "requiresClientProvidedHashVerified:"
                  );

              Method method =
                  class_getInstanceMethod(
                      storageClass,
                      selector
                  );

              if (!method) {
                  return NO;
              }

              if (method_getNumberOfArguments(method) != 6) {
                  return NO;
              }

              const char *types =
                  method_getTypeEncoding(method);

              if (!types) {
                  return NO;
              }

              char returnType[16] = {0};
              char arg2[16] = {0};
              char arg3[16] = {0};
              char arg4[16] = {0};
              char arg5[16] = {0};

              method_getReturnType(
                  method,
                  returnType,
                  sizeof(returnType)
              );

              method_getArgumentType(
                  method,
                  2,
                  arg2,
                  sizeof(arg2)
              );

              method_getArgumentType(
                  method,
                  3,
                  arg3,
                  sizeof(arg3)
              );

              method_getArgumentType(
                  method,
                  4,
                  arg4,
                  sizeof(arg4)
              );

              method_getArgumentType(
                  method,
                  5,
                  arg5,
                  sizeof(arg5)
              );

              if (
                  returnType[0] != '@' ||
                  arg2[0] != '@' ||
                  arg3[0] != '@' ||
                  arg4[0] != '@' ||
                  (
                      arg5[0] != 'B' &&
                      arg5[0] != 'c' &&
                      arg5[0] != 'C'
                  )
              ) {
                  return NO;
              }

              IMP previous =
                  method_setImplementation(
                      method,
                      (IMP)MPStorageReplacement
                  );

              if (!previous) {
                  return NO;
              }

              MPOriginalStorageIMP =
                  (MPStorageIMP)previous;

              MPDoDHookInstalled = YES;

              return YES;
          }

          static NSTimeInterval MPDoDDelay(
              NSInteger attempt
          ) {
              if (attempt <= 100) {
                  return 0.005;
              }

              if (attempt <= 150) {
                  return 0.010;
              }

              if (attempt <= 200) {
                  return 0.020;
              }

              if (attempt <= 260) {
                  return 0.050;
              }

              return 0.250;
          }

          static void MPScheduleDoDProbe(void);

          static void MPDoDProbe(void) {
              if (MPDoDHookInstalled) {
                  return;
              }

              MPDoDProbeAttempt += 1;

              if (MPTryInstallDoDHook()) {
                  return;
              }

              if (MPDoDProbeAttempt <
                  MPMaxDoDProbeAttempts) {
                  MPScheduleDoDProbe();
              }
          }

          static void MPScheduleDoDProbe(void) {
              NSInteger nextAttempt =
                  MPDoDProbeAttempt + 1;

              NSTimeInterval delay =
                  MPDoDDelay(
                      nextAttempt
                  );

              dispatch_after(
                  dispatch_time(
                      DISPATCH_TIME_NOW,
                      (int64_t)(
                          delay * NSEC_PER_SEC
                      )
                  ),
                  dispatch_get_global_queue(
                      QOS_CLASS_USER_INTERACTIVE,
                      0
                  ),
                  ^{
                      MPDoDProbe();
                  }
              );
          }

          __attribute__((constructor))
          static void MessengerEnhancementsInit(void) {
              if (!MPTryInstallDoDHook()) {
                  MPScheduleDoDProbe();
              }

              dispatch_after(
                  dispatch_time(
                      DISPATCH_TIME_NOW,
                      (int64_t)(
                          0.100 * NSEC_PER_SEC
                      )
                  ),
                  dispatch_get_global_queue(
                      QOS_CLASS_USER_INITIATED,
                      0
                  ),
                  ^{
                      if (!MPTryInstallMSGPlusHooks()) {
                          MPScheduleMSGPlusProbe();
                      }
                  }
              );
          }
          OBJC

      - name: Compile production arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(
            xcrun --sdk iphoneos --show-sdk-path
          )"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -fobjc-arc \
            -fblocks \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -framework UIKit \
            -install_name "@rpath/MessengerEnhancements.dylib" \
            -Wl,-dead_strip \
            build/MessengerEnhancements.m \
            -o build/MessengerEnhancements.dylib

          chmod 755 \
            build/MessengerEnhancements.dylib

          file \
            build/MessengerEnhancements.dylib

          file \
            build/MessengerEnhancements.dylib \
            | grep -qi arm64

          if strings \
            build/MessengerEnhancements.dylib \
            | grep -E \
              'NSLog|Documents/' \
              > /dev/null; then
            echo "❌ Resíduo de diagnóstico encontrado na dylib final"
            exit 1
          fi

          strings \
            build/MessengerEnhancements.dylib \
            | grep -F \
              "MSGSettingsViewController" \
            > /dev/null

          strings \
            build/MessengerEnhancements.dylib \
            | grep -F \
              "FBOnDemandResourceStorage" \
            > /dev/null

          shasum -a 256 \
            build/MessengerEnhancements.dylib

      - name: Upload production dylib
        uses: actions/upload-artifact@v6
        with:
          name: messenger-enhancements-final-dylib
          path: build/MessengerEnhancements.dylib
          if-no-files-found: error
          retention-days: 3

  patch-messenger:
    name: Build final Messenger IPA
    needs: build-enhancements
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            file \
            unzip \
            zip

      - name: Install IPA Patch 2.1.3
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --location \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch
          ./ipapatch --version

      - name: Download production dylib
        uses: actions/download-artifact@v7
        with:
          name: messenger-enhancements-final-dylib
          path: hook

      - name: Download Messenger IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq \
            input.ipa \
            > /dev/null

          echo "✅ IPA recebido"

      - name: Load and validate Messenger 574 pt-BR pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          PACK_SOURCE="addons/messenger-portuguese/beb8b2a724c4d86596dd48520bf328cb"
          CONTENT_HASH="beb8b2a724c4d86596dd48520bf328cb"
          EXPECTED_SHA256="918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2"

          test -f "$PACK_SOURCE"

          cp \
            "$PACK_SOURCE" \
            portuguese.fblp

          ACTUAL_SHA256="$(
            sha256sum portuguese.fblp \
              | awk '{print $1}'
          )"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ SHA-256 do FBLP inesperado"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          data = Path(
              "portuguese.fblp"
          ).read_bytes()

          if len(data) < 8:
              raise SystemExit(
                  "❌ FBLP pequeno demais"
              )

          if data[4:8] != b"FBLP":
              raise SystemExit(
                  "❌ Identificador FBLP inválido"
              )

          print(
              f"✅ FBLP válido: {len(data)} bytes"
          )
          PY

          {
            echo "content_hash=$CONTENT_HASH"
            echo "checksum=$ACTUAL_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Extract and validate Messenger with MSGPlusX
        id: messenger
        shell: bash
        run: |
          set -euo pipefail

          rm -rf baseline
          mkdir -p baseline

          unzip -q \
            input.ipa \
            -d baseline

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("baseline/Payload")
          apps = list(
              payload.glob("*.app")
          )

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app; encontrei {len(apps)}"
              )

          app = apps[0]

          with (
              app / "Info.plist"
          ).open("rb") as f:
              info = plistlib.load(f)

          executable = info.get(
              "CFBundleExecutable"
          )

          version = str(
              info.get(
                  "CFBundleShortVersionString",
                  "",
              )
          )

          build = str(
              info.get(
                  "CFBundleVersion",
                  "",
              )
          )

          bundle_id = str(
              info.get(
                  "CFBundleIdentifier",
                  "",
              )
          )

          if bundle_id != "com.facebook.Messenger":
              raise SystemExit(
                  "❌ IPA não é o Messenger"
              )

          if version != "574.0.0":
              raise SystemExit(
                  "❌ Este teste usa o pack do Messenger "
                  f"574.0.0; encontrado {version!r}"
              )

          if build != "1037058507":
              raise SystemExit(
                  "❌ Build inesperado: "
                  f"{build!r}"
              )

          required = [
              app / executable,
              app / "Frameworks"
                    / "MSGPlusX.dylib",
              app / "Frameworks"
                    / "Sideload Keychain Fix.dylib",
              app / "Frameworks"
                    / "CydiaSubstrate.framework"
                    / "CydiaSubstrate",
              app / "Frameworks"
                    / "LightSpeedCore.framework"
                    / "LightSpeedCore",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Componente obrigatório ausente: {path}"
                  )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as out:
              out.write(
                  f"app_name={app.name}\n"
              )
              out.write(
                  f"executable={executable}\n"
              )
              out.write(
                  f"version={version}\n"
              )
              out.write(
                  f"build={build}\n"
              )

          print(
              "✅ Messenger 574 + MSGPlusX validado"
          )
          PY

      - name: Remove debug file-sharing settings
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = (
              Path("baseline/Payload")
              / os.environ["APP_NAME"]
          )

          plist_path = (
              app / "Info.plist"
          )

          with plist_path.open(
              "rb"
          ) as f:
              info = plistlib.load(f)

          info.pop(
              "UIFileSharingEnabled",
              None,
          )

          info.pop(
              "LSSupportsOpeningDocumentsInPlace",
              None,
          )

          with plist_path.open(
              "wb"
          ) as f:
              plistlib.dump(
                  info,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False,
              )

          print(
              "✅ Chaves de debug/File Sharing removidas"
          )
          PY

      - name: Create isolated IPA for main injection
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf isolated
          cp -a \
            baseline \
            isolated

          APP="isolated/Payload/$APP_NAME"

          rm -rf "$APP/PlugIns"
          rm -rf "$APP/Extensions"

          (
            cd isolated
            zip -qry9 \
              ../isolated-input.ipa \
              Payload
          )

          unzip -tq \
            isolated-input.ipa \
            > /dev/null

          echo "✅ IPA temporário preparado"

      - name: Inject MessengerEnhancements into main executable
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            hook/MessengerEnhancements.dylib

          chmod 755 \
            hook/MessengerEnhancements.dylib

          ./ipapatch \
            --input isolated-input.ipa \
            --output isolated-patched.ipa \
            --dylib hook/MessengerEnhancements.dylib \
            --noconfirm

          unzip -tq \
            isolated-patched.ipa \
            > /dev/null

          echo "✅ MessengerEnhancements injetada"

      - name: Merge patched main into original Messenger
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf patched
          mkdir -p patched

          unzip -q \
            isolated-patched.ipa \
            -d patched

          PATCHED_APP="patched/Payload/$APP_NAME"
          FINAL_APP="baseline/Payload/$APP_NAME"

          cp \
            "$PATCHED_APP/$EXECUTABLE" \
            "$FINAL_APP/$EXECUTABLE"

          chmod 755 \
            "$FINAL_APP/$EXECUTABLE"

          mkdir -p \
            "$FINAL_APP/Frameworks"

          cp \
            hook/MessengerEnhancements.dylib \
            "$FINAL_APP/Frameworks/MessengerEnhancements.dylib"

          chmod 755 \
            "$FINAL_APP/Frameworks/MessengerEnhancements.dylib"

          echo "✅ Executável principal atualizado"
          echo "✅ Estrutura original de extensões preservada"

      - name: Embed pt-BR FBLP and dynamic manifest
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          APP_BUILD: ${{ steps.messenger.outputs.build }}
          CONTENT_HASH: ${{ steps.pack.outputs.content_hash }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"

          mkdir -p \
            "$APP/MessengerPortuguese"

          mkdir -p \
            "$APP/pt.lproj"

          cp \
            portuguese.fblp \
            "$APP/MessengerPortuguese/fbt_language_pack.bin"

          cp \
            portuguese.fblp \
            "$APP/pt.lproj/fbt_language_pack.bin"

          chmod 644 \
            "$APP/MessengerPortuguese/fbt_language_pack.bin" \
            "$APP/pt.lproj/fbt_language_pack.bin"

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = (
              Path("baseline/Payload")
              / os.environ["APP_NAME"]
          )

          manifest = {
              "Locale": "pt_BR",
              "BuildNumber": int(
                  os.environ["APP_BUILD"]
              ),
              "ContentHash":
                  os.environ["CONTENT_HASH"],
              "Checksum":
                  os.environ["CHECKSUM"],
          }

          path = (
              app
              / "MessengerPortuguese"
              / "manifest.plist"
          )

          with path.open("wb") as f:
              plistlib.dump(
                  manifest,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False,
              )

          print(
              "✅ Manifest dinâmico criado"
          )
          PY

      - name: Validate production structure
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"
          MAIN="$APP/$EXECUTABLE"
          DYLIB="$APP/Frameworks/MessengerEnhancements.dylib"
          PACK="$APP/MessengerPortuguese/fbt_language_pack.bin"
          MANIFEST="$APP/MessengerPortuguese/manifest.plist"

          test -f "$MAIN"
          test -f "$DYLIB"
          test -f "$PACK"
          test -f "$MANIFEST"
          test -f "$APP/Frameworks/MSGPlusX.dylib"
          test -f "$APP/Frameworks/Sideload Keychain Fix.dylib"
          test -f "$APP/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"

          strings "$MAIN" \
            | grep -F \
              "MessengerEnhancements.dylib" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "FBOnDemandResourceStorage" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "MSGSettingsViewController" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "MSGMessengerWordmarkView" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "Ver stories anonimamente" \
            > /dev/null

          if strings "$DYLIB" \
            | grep -E \
              'NSLog|Documents/' \
              > /dev/null; then
            echo "❌ Resíduo de debug encontrado"
            exit 1
          fi

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = (
              Path("baseline/Payload")
              / os.environ["APP_NAME"]
          )

          with (
              app / "Info.plist"
          ).open("rb") as f:
              info = plistlib.load(f)

          forbidden = [
              "UIFileSharingEnabled",
              "LSSupportsOpeningDocumentsInPlace",
          ]

          for key in forbidden:
              if key in info:
                  raise SystemExit(
                      f"❌ Chave de debug presente: {key}"
                  )

          manifest_path = (
              app
              / "MessengerPortuguese"
              / "manifest.plist"
          )

          with manifest_path.open(
              "rb"
          ) as f:
              manifest = plistlib.load(f)

          required = {
              "Locale",
              "BuildNumber",
              "ContentHash",
              "Checksum",
          }

          missing = (
              required
              - set(manifest)
          )

          if missing:
              raise SystemExit(
                  f"❌ Manifest incompleto: {sorted(missing)}"
              )

          print(
              "✅ Estrutura final de produção validada"
          )
          PY

      - name: Build final production IPA
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="Messenger-574-MSGPlusX-ptBR-Final.ipa"

          (
            cd baseline
            zip -qry9 \
              "../$OUTPUT" \
              Payload
          )

          unzip -tq \
            "$OUTPUT" \
            > /dev/null

          ls -lh \
            "$OUTPUT"

          sha256sum \
            "$OUTPUT"

          echo "✅ IPA final criado"

      - name: Upload final Messenger IPA
        uses: actions/upload-artifact@v6
        with:
          name: Messenger-574-MSGPlusX-ptBR-Final
          path: Messenger-574-MSGPlusX-ptBR-Final.ipa
          if-no-files-found: error
          retention-days: 3
