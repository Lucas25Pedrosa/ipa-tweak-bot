name: Messenger 574 Portuguese V2.2 DoD Local

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Messenger 574.0.0 + MSGPlusX (.ipa)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-hook:
    name: Build pt-BR V2.2 DoD hook
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Create V2.2 hook source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat > build/MessengerPortugueseV22.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <dispatch/dispatch.h>
          #import <stdarg.h>

          static IMP MPOriginalStorageIMP = NULL;
          static BOOL MPHookInstalled = NO;
          static NSInteger MPProbeAttempt = 0;
          static const NSInteger MPMaxProbeAttempts = 300;

          static NSString * const MPContentHash =
              @"beb8b2a724c4d86596dd48520bf328cb";

          static NSString * const MPSHA256 =
              @"918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2";

          static NSString *MPLogPath(void) {
              return [NSHomeDirectory()
                  stringByAppendingPathComponent:
                      @"Documents/MessengerPtBRFix-V22.log"];
          }

          static void MPLog(NSString *format, ...) {
              @autoreleasepool {
                  va_list args;
                  va_start(args, format);

                  NSString *message =
                      [[NSString alloc] initWithFormat:format
                                            arguments:args];

                  va_end(args);

                  NSLog(@"[MessengerPtBRFix-V22] %@", message);

                  NSString *line =
                      [NSString stringWithFormat:
                          @"%@ %@\n",
                          [NSDate date],
                          message];

                  NSData *data =
                      [line dataUsingEncoding:NSUTF8StringEncoding];

                  if (!data) {
                      return;
                  }

                  NSString *path = MPLogPath();
                  NSFileManager *fm =
                      [NSFileManager defaultManager];

                  if (![fm fileExistsAtPath:path]) {
                      [data writeToFile:path atomically:YES];
                      return;
                  }

                  NSFileHandle *handle =
                      [NSFileHandle fileHandleForWritingAtPath:path];

                  if (!handle) {
                      return;
                  }

                  @try {
                      [handle seekToEndOfFile];
                      [handle writeData:data];
                      [handle closeFile];
                  } @catch (__unused NSException *exception) {
                  }
              }
          }

          static NSString *MPPackPath(void) {
              return [[[NSBundle mainBundle] bundlePath]
                  stringByAppendingPathComponent:
                      @"MessengerPortuguese/fbt_language_pack.bin"];
          }

          static BOOL MPValidatePack(NSString *path) {
              NSData *data =
                  [NSData dataWithContentsOfFile:path
                                        options:NSDataReadingMappedIfSafe
                                          error:nil];

              if (data.length != 1197992) {
                  return NO;
              }

              if (data.length < 8) {
                  return NO;
              }

              const unsigned char *bytes = data.bytes;

              return bytes[4] == 'F' &&
                     bytes[5] == 'B' &&
                     bytes[6] == 'L' &&
                     bytes[7] == 'P';
          }

          static NSString *MPSafeString(id value) {
              if (!value) {
                  return @"";
              }

              if ([value isKindOfClass:[NSString class]]) {
                  return (NSString *)value;
              }

              @try {
                  return [value description] ?: @"";
              } @catch (__unused NSException *exception) {
                  return @"";
              }
          }

          static NSString *MPNormalize(NSString *value) {
              if (!value) {
                  return @"";
              }

              NSString *result =
                  [[value
                    stringByReplacingOccurrencesOfString:@"-"
                                              withString:@"_"]
                    lowercaseString];

              result =
                  [result
                    stringByReplacingOccurrencesOfString:@" "
                                              withString:@""];

              return result;
          }

          static BOOL MPIsLanguagePackRequest(id resourceName) {
              NSString *name =
                  [MPSafeString(resourceName) lowercaseString];

              return [name containsString:@"fbt_language_pack"] ||
                     [name containsString:@"language_pack"];
          }

          static BOOL MPIsPtBRFlavor(id flavor) {
              NSString *normalized =
                  MPNormalize(MPSafeString(flavor));

              if ([normalized containsString:@"pt_br"]) {
                  return YES;
              }

              /*
               * Alguns objetos internos podem usar apenas "pt".
               * Só aceitamos esse caso quando o idioma preferido
               * do dispositivo é pt-BR.
               */
              if ([normalized isEqualToString:@"pt"]) {
                  NSString *preferred =
                      MPNormalize(
                          [[NSLocale preferredLanguages] firstObject]);

                  return [preferred hasPrefix:@"pt_br"];
              }

              return NO;
          }

          static NSNumber *MPBuildNumber(void) {
              NSString *build =
                  [[[NSBundle mainBundle]
                    objectForInfoDictionaryKey:@"CFBundleVersion"]
                    description];

              long long value =
                  [build longLongValue];

              if (value <= 0) {
                  value = 1037058507LL;
              }

              return @(value);
          }

          static id MPSafeValueForKey(id object, NSString *key) {
              if (!object || !key) {
                  return nil;
              }

              @try {
                  return [object valueForKey:key];
              } @catch (__unused NSException *exception) {
                  return nil;
              }
          }

          static id MPCreateLocalResourceInfo(void) {
              NSString *path = MPPackPath();

              if (!MPValidatePack(path)) {
                  MPLog(@"❌ FBLP ausente ou inválido: %@", path);
                  return nil;
              }

              Class infoClass =
                  NSClassFromString(@"FBOnDemandLocalResourceInfo");

              if (!infoClass) {
                  MPLog(@"❌ FBOnDemandLocalResourceInfo "
                        @"não existe no runtime");
                  return nil;
              }

              NSNumber *buildNumber =
                  MPBuildNumber();

              /*
               * Preferimos o initializer mais completo do
               * Messenger 574. Todos os argumentos, exceto o
               * último BOOL, são objetos Objective-C.
               */
              SEL init5 =
                  NSSelectorFromString(
                      @"initWithBuildNumber:"
                       "resourcePath:"
                       "contentHash:"
                       "checksum:"
                       "clientProvidedHashVerified:");

              if ([infoClass instancesRespondToSelector:init5]) {
                  @try {
                      id (*sendAlloc)(id, SEL) =
                          (id (*)(id, SEL))(void *)objc_msgSend;

                      id allocated =
                          sendAlloc(
                              (id)infoClass,
                              sel_registerName("alloc"));

                      id (*sendInit5)(
                          id,
                          SEL,
                          id,
                          id,
                          id,
                          id,
                          BOOL
                      ) =
                          (id (*)(id, SEL, id, id, id, id, BOOL))
                              (void *)objc_msgSend;

                      id info =
                          sendInit5(
                              allocated,
                              init5,
                              buildNumber,
                              path,
                              MPContentHash,
                              MPSHA256,
                              YES);

                      if (info) {
                          MPLog(@"✅ FBOnDemandLocalResourceInfo "
                                @"criado pelo initializer de 5 args");

                          MPLog(@"   buildNumber=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"buildNumber"));

                          MPLog(@"   resourcePath=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"resourcePath"));

                          MPLog(@"   contentHash=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"contentHash"));

                          MPLog(@"   checksum=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"checksum"));

                          return info;
                      }
                  } @catch (NSException *exception) {
                      MPLog(@"⚠️ Exceção no initializer 5 args: %@",
                            exception);
                  }
              }

              /*
               * Fallback existente no mesmo Messenger 574.
               */
              SEL init3 =
                  NSSelectorFromString(
                      @"initWithBuildNumber:"
                       "resourcePath:"
                       "checksum:");

              if ([infoClass instancesRespondToSelector:init3]) {
                  @try {
                      id (*sendAlloc)(id, SEL) =
                          (id (*)(id, SEL))(void *)objc_msgSend;

                      id allocated =
                          sendAlloc(
                              (id)infoClass,
                              sel_registerName("alloc"));

                      id (*sendInit3)(
                          id,
                          SEL,
                          id,
                          id,
                          id
                      ) =
                          (id (*)(id, SEL, id, id, id))
                              (void *)objc_msgSend;

                      id info =
                          sendInit3(
                              allocated,
                              init3,
                              buildNumber,
                              path,
                              MPSHA256);

                      if (info) {
                          MPLog(@"✅ FBOnDemandLocalResourceInfo "
                                @"criado pelo initializer de 3 args");

                          MPLog(@"   buildNumber=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"buildNumber"));

                          MPLog(@"   resourcePath=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"resourcePath"));

                          MPLog(@"   checksum=%@",
                                MPSafeValueForKey(
                                    info,
                                    @"checksum"));

                          return info;
                      }
                  } @catch (NSException *exception) {
                      MPLog(@"⚠️ Exceção no initializer 3 args: %@",
                            exception);
                  }
              }

              MPLog(@"❌ Não foi possível construir "
                    @"FBOnDemandLocalResourceInfo");

              return nil;
          }

          static id MPStorageReplacement(
              id self,
              SEL _cmd,
              id resourceName,
              id flavor,
              id fetchType,
              BOOL requiresClientProvidedHashVerified
          ) {
              BOOL languagePack =
                  MPIsLanguagePackRequest(resourceName);

              BOOL ptBR =
                  MPIsPtBRFlavor(flavor);

              if (languagePack || ptBR) {
                  MPLog(@"DoD storage query:");
                  MPLog(@"   resourceName=%@",
                        MPSafeString(resourceName));
                  MPLog(@"   flavor=%@",
                        MPSafeString(flavor));
                  MPLog(@"   fetchType=%@",
                        MPSafeString(fetchType));
                  MPLog(@"   requiresClientHash=%@",
                        requiresClientProvidedHashVerified
                            ? @"YES"
                            : @"NO");
              }

              /*
               * Só alteramos exatamente o pacote de idioma pt-BR.
               */
              if (languagePack && ptBR) {
                  MPLog(@"🇧🇷 Requisição DoD pt-BR detectada");

                  id localInfo =
                      MPCreateLocalResourceInfo();

                  if (localInfo) {
                      MPLog(@"✅ Respondendo ao DoD com "
                            @"o FBLP local");
                      return localInfo;
                  }

                  MPLog(@"⚠️ Falha criando localInfo; "
                        @"usando storage original");
              }

              if (MPOriginalStorageIMP) {
                  id (*original)(
                      id,
                      SEL,
                      id,
                      id,
                      id,
                      BOOL
                  ) =
                      (id (*)(id, SEL, id, id, id, BOOL))
                          MPOriginalStorageIMP;

                  return original(
                      self,
                      _cmd,
                      resourceName,
                      flavor,
                      fetchType,
                      requiresClientProvidedHashVerified);
              }

              MPLog(@"❌ IMP original do storage indisponível");
              return nil;
          }

          static BOOL MPMethodSignatureLooksSafe(Method method) {
              if (!method) {
                  return NO;
              }

              unsigned int count =
                  method_getNumberOfArguments(method);

              const char *types =
                  method_getTypeEncoding(method);

              MPLog(@"Storage method typeEncoding=%s args=%u",
                    types ?: "(null)",
                    count);

              /*
               * self + _cmd + quatro argumentos = 6.
               */
              if (count != 6 || !types) {
                  return NO;
              }

              char returnType[32] = {0};
              method_getReturnType(
                  method,
                  returnType,
                  sizeof(returnType));

              if (returnType[0] != '@') {
                  MPLog(@"❌ Return type inesperado: %s",
                        returnType);
                  return NO;
              }

              char arg2[32] = {0};
              char arg3[32] = {0};
              char arg4[32] = {0};
              char arg5[32] = {0};

              method_getArgumentType(
                  method,
                  2,
                  arg2,
                  sizeof(arg2));

              method_getArgumentType(
                  method,
                  3,
                  arg3,
                  sizeof(arg3));

              method_getArgumentType(
                  method,
                  4,
                  arg4,
                  sizeof(arg4));

              method_getArgumentType(
                  method,
                  5,
                  arg5,
                  sizeof(arg5));

              MPLog(@"Storage arg types: %s %s %s %s",
                    arg2,
                    arg3,
                    arg4,
                    arg5);

              if (arg2[0] != '@' ||
                  arg3[0] != '@' ||
                  arg4[0] != '@') {
                  MPLog(@"❌ Três primeiros argumentos "
                        @"não são objetos");
                  return NO;
              }

              if (arg5[0] != 'B' &&
                  arg5[0] != 'c' &&
                  arg5[0] != 'C') {
                  MPLog(@"❌ Último argumento não parece BOOL: %s",
                        arg5);
                  return NO;
              }

              return YES;
          }

          static BOOL MPTryInstallHook(void) {
              if (MPHookInstalled) {
                  return YES;
              }

              Class storageClass =
                  NSClassFromString(@"FBOnDemandResourceStorage");

              Class infoClass =
                  NSClassFromString(@"FBOnDemandLocalResourceInfo");

              if (!storageClass || !infoClass) {
                  return NO;
              }

              SEL selector =
                  NSSelectorFromString(
                      @"_fetchMostRecentResourceWithName:"
                       "flavor:"
                       "fetchType:"
                       "requiresClientProvidedHashVerified:");

              Method method =
                  class_getInstanceMethod(
                      storageClass,
                      selector);

              if (!method) {
                  return NO;
              }

              if (!MPMethodSignatureLooksSafe(method)) {
                  MPLog(@"❌ Assinatura do storage não corresponde "
                        @"ao ABI esperado; hook NÃO instalado");
                  return NO;
              }

              IMP current =
                  method_getImplementation(method);

              if (!current) {
                  return NO;
              }

              IMP previous =
                  method_setImplementation(
                      method,
                      (IMP)MPStorageReplacement);

              if (!previous) {
                  MPLog(@"❌ method_setImplementation falhou");
                  return NO;
              }

              MPOriginalStorageIMP = previous;
              MPHookInstalled = YES;

              MPLog(@"✅ Hook DoD instalado em:");
              MPLog(@"   FBOnDemandResourceStorage");
              MPLog(@"   _fetchMostRecentResourceWithName:"
                    @"flavor:fetchType:"
                    @"requiresClientProvidedHashVerified:");

              MPLog(@"Pack local válido=%@",
                    MPValidatePack(MPPackPath())
                        ? @"SIM"
                        : @"NÃO");

              MPLog(@"Pack path=%@",
                    MPPackPath());

              MPLog(@"Build=%@",
                    MPBuildNumber());

              return YES;
          }

          static void MPScheduleProbe(void);

          static void MPProbeRuntime(void) {
              @autoreleasepool {
                  if (MPHookInstalled) {
                      return;
                  }

                  MPProbeAttempt += 1;

                  if (MPTryInstallHook()) {
                      return;
                  }

                  if (MPProbeAttempt == 1 ||
                      MPProbeAttempt % 15 == 0) {
                      MPLog(@"Aguardando DoD runtime "
                            @"(tentativa %ld/%ld)",
                            (long)MPProbeAttempt,
                            (long)MPMaxProbeAttempts);
                  }

                  if (MPProbeAttempt <
                      MPMaxProbeAttempts) {
                      MPScheduleProbe();
                  } else {
                      MPLog(@"❌ Timeout aguardando "
                            @"FBOnDemandResourceStorage");
                  }
              }
          }

          static void MPScheduleProbe(void) {
              dispatch_after(
                  dispatch_time(
                      DISPATCH_TIME_NOW,
                      (int64_t)(2.0 * NSEC_PER_SEC)),
                  dispatch_get_main_queue(),
                  ^{
                      MPProbeRuntime();
                  });
          }

          __attribute__((constructor))
          static void MessengerPortugueseV22Init(void) {
              /*
               * Nenhum hook, dlopen ou chamada a classe privada
               * acontece dentro do constructor.
               */
              MPScheduleProbe();
          }
          OBJC

      - name: Compile arm64 iOS dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -fobjc-arc \
            -fblocks \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -install_name "@rpath/MessengerPortugueseV22.dylib" \
            -Wl,-dead_strip \
            build/MessengerPortugueseV22.m \
            -o build/MessengerPortugueseV22.dylib

          chmod 755 build/MessengerPortugueseV22.dylib

          file build/MessengerPortugueseV22.dylib
          shasum -a 256 build/MessengerPortugueseV22.dylib

          file build/MessengerPortugueseV22.dylib \
            | grep -qi arm64

      - name: Upload V2.2 dylib
        uses: actions/upload-artifact@v6
        with:
          name: messenger-portuguese-v22-dylib
          path: build/MessengerPortugueseV22.dylib
          if-no-files-found: error
          retention-days: 3

  patch-messenger:
    name: Inject V2.2 and build IPA
    needs: build-hook
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            file \
            unzip \
            zip

      - name: Install IPA Patch 2.1.3
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --location \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch
          ./ipapatch --version

      - name: Download V2.2 dylib
        uses: actions/download-artifact@v7
        with:
          name: messenger-portuguese-v22-dylib
          path: hook

      - name: Download Messenger and validate pt-BR FBLP
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq input.ipa > /dev/null

          PACK_SOURCE="addons/messenger-portuguese/beb8b2a724c4d86596dd48520bf328cb"

          test -f "$PACK_SOURCE"

          cp \
            "$PACK_SOURCE" \
            portuguese.fblp

          EXPECTED_SHA256="918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2"

          ACTUAL_SHA256="$(
            sha256sum portuguese.fblp \
              | awk '{print $1}'
          )"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ SHA-256 do FBLP não corresponde"
            echo "Esperado: $EXPECTED_SHA256"
            echo "Atual:    $ACTUAL_SHA256"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          data = Path("portuguese.fblp").read_bytes()

          if len(data) != 1197992:
              raise SystemExit(
                  f"❌ Tamanho inesperado: {len(data)}"
              )

          if data[4:8] != b"FBLP":
              raise SystemExit(
                  f"❌ Identificador FBLP inválido: "
                  f"{data[:8]!r}"
              )

          print("✅ FBLP pt-BR do Messenger 574 validado")
          PY

      - name: Extract and validate Messenger 574 MSGPlusX
        id: messenger
        shell: bash
        run: |
          set -euo pipefail

          rm -rf baseline
          mkdir -p baseline

          unzip -q \
            input.ipa \
            -d baseline

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("baseline/Payload")
          apps = list(payload.glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app; encontrei {len(apps)}"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          executable = info.get("CFBundleExecutable")
          version = str(
              info.get("CFBundleShortVersionString", "")
          )
          build = str(
              info.get("CFBundleVersion", "")
          )
          bundle_id = str(
              info.get("CFBundleIdentifier", "")
          )

          if not executable:
              raise SystemExit(
                  "❌ CFBundleExecutable ausente"
              )

          if version != "574.0.0":
              raise SystemExit(
                  "❌ Workflow exclusivo para Messenger "
                  f"574.0.0; encontrado {version!r}"
              )

          if build != "1037058507":
              raise SystemExit(
                  "❌ Build inesperado do Messenger 574: "
                  f"{build!r}"
              )

          required = [
              app / executable,
              app / "Frameworks"
                    / "LightSpeedCore.framework"
                    / "LightSpeedCore",
              app / "Frameworks"
                    / "MSGPlusX.dylib",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(
                      f"❌ Arquivo obrigatório ausente: {path}"
                  )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as out:
              out.write(f"app_name={app.name}\n")
              out.write(f"executable={executable}\n")
              out.write(f"bundle_id={bundle_id}\n")
              out.write(f"version={version}\n")
              out.write(f"build={build}\n")

          print("✅ Messenger alvo validado")
          print(f"App: {app.name}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Versão: {version}")
          print(f"Build: {build}")
          PY

      - name: Enable Documents access for V2.2 log
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = (
              Path("baseline/Payload")
              / os.environ["APP_NAME"]
          )

          plist_path = app / "Info.plist"

          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True

          with plist_path.open("wb") as f:
              plistlib.dump(
                  info,
                  f,
                  fmt=plistlib.FMT_BINARY,
                  sort_keys=False,
              )

          print("✅ File Sharing habilitado para o log V2.2")
          PY

      - name: Create isolated IPA for main injection
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf isolated
          cp -a baseline isolated

          APP="isolated/Payload/$APP_NAME"

          # Apenas no IPA temporário usado pelo ipapatch.
          rm -rf "$APP/PlugIns"

          (
            cd isolated
            zip -qry9 \
              ../isolated-input.ipa \
              Payload
          )

          unzip -tq \
            isolated-input.ipa \
            > /dev/null

          echo "✅ IPA temporário preparado"

      - name: Inject V2.2 dylib into main Messenger executable
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            hook/MessengerPortugueseV22.dylib

          chmod 755 \
            hook/MessengerPortugueseV22.dylib

          ./ipapatch \
            --input isolated-input.ipa \
            --output isolated-patched.ipa \
            --dylib hook/MessengerPortugueseV22.dylib \
            --noconfirm

          unzip -tq \
            isolated-patched.ipa \
            > /dev/null

          echo "✅ V2.2 injetada no main executable"

      - name: Merge patched main into original structure
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf patched
          mkdir -p patched

          unzip -q \
            isolated-patched.ipa \
            -d patched

          PATCHED_APP="patched/Payload/$APP_NAME"
          FINAL_APP="baseline/Payload/$APP_NAME"

          cp \
            "$PATCHED_APP/$EXECUTABLE" \
            "$FINAL_APP/$EXECUTABLE"

          chmod 755 \
            "$FINAL_APP/$EXECUTABLE"

          mkdir -p \
            "$FINAL_APP/Frameworks"

          cp \
            hook/MessengerPortugueseV22.dylib \
            "$FINAL_APP/Frameworks/MessengerPortugueseV22.dylib"

          chmod 755 \
            "$FINAL_APP/Frameworks/MessengerPortugueseV22.dylib"

          echo "✅ Main substituído"
          echo "✅ PlugIns originais preservados"

      - name: Embed exact Messenger 574 pt-BR pack
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"

          mkdir -p \
            "$APP/MessengerPortuguese"

          mkdir -p \
            "$APP/pt.lproj"

          cp \
            portuguese.fblp \
            "$APP/MessengerPortuguese/fbt_language_pack.bin"

          cp \
            portuguese.fblp \
            "$APP/pt.lproj/fbt_language_pack.bin"

          chmod 644 \
            "$APP/MessengerPortuguese/fbt_language_pack.bin" \
            "$APP/pt.lproj/fbt_language_pack.bin"

          echo "✅ FBLP pt-BR incorporado"

      - name: Validate V2.2 final structure
        env:
          APP_NAME: ${{ steps.messenger.outputs.app_name }}
          EXECUTABLE: ${{ steps.messenger.outputs.executable }}
        shell: bash
        run: |
          set -euo pipefail

          APP="baseline/Payload/$APP_NAME"
          MAIN="$APP/$EXECUTABLE"
          DYLIB="$APP/Frameworks/MessengerPortugueseV22.dylib"
          PACK="$APP/MessengerPortuguese/fbt_language_pack.bin"

          test -f "$MAIN"
          test -f "$DYLIB"
          test -f "$PACK"
          test -f \
            "$APP/pt.lproj/fbt_language_pack.bin"

          test -d "$APP/PlugIns"

          sha256sum "$PACK" \
            | grep -F \
              "918418eeeb9df288275def88220c2ecba0f2ab47f174c73c12cff55a44cd96e2"

          strings "$MAIN" \
            | grep -F \
              "MessengerPortugueseV22.dylib" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "FBOnDemandResourceStorage" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "_fetchMostRecentResourceWithName:" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "FBOnDemandLocalResourceInfo" \
            > /dev/null

          strings "$DYLIB" \
            | grep -F \
              "MessengerPtBRFix-V22.log" \
            > /dev/null

          python3 <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = (
              Path("baseline/Payload")
              / os.environ["APP_NAME"]
          )

          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)

          if info.get("UIFileSharingEnabled") is not True:
              raise SystemExit(
                  "❌ UIFileSharingEnabled ausente"
              )

          print("✅ Estrutura V2.2 validada")
          PY

      - name: Build final V2.2 IPA
        shell: bash
        run: |
          set -euo pipefail

          (
            cd baseline
            zip -qry9 \
              ../Messenger-574-MSGPlusX-Portuguese-V2.2.ipa \
              Payload
          )

          unzip -tq \
            Messenger-574-MSGPlusX-Portuguese-V2.2.ipa \
            > /dev/null

          ls -lh \
            Messenger-574-MSGPlusX-Portuguese-V2.2.ipa

          sha256sum \
            Messenger-574-MSGPlusX-Portuguese-V2.2.ipa

          echo "✅ IPA V2.2 final criado"

      - name: Upload final V2.2 IPA
        uses: actions/upload-artifact@v6
        with:
          name: Messenger-574-MSGPlusX-Portuguese-V2.2
          path: Messenger-574-MSGPlusX-Portuguese-V2.2.ipa
          if-no-files-found: error
          retention-days: 3
