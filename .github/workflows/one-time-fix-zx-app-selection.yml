name: One-time fix zx app selection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-zx-app-selection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch zx-compat main app selection
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/telegram-inject.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          start_marker = '          apps = list((work / "Payload").glob("*.app"))'
          end_marker = '          def bundle_executable(bundle: Path) -> Path:'

          starts = [i for i, line in enumerate(lines) if line.rstrip('\n') == start_marker]
          ends = [i for i, line in enumerate(lines) if line.rstrip('\n') == end_marker]

          if len(starts) != 1:
              raise SystemExit(f'Esperava 1 início do bloco zx-compat; encontrei {len(starts)}')
          if len(ends) != 1 or ends[0] <= starts[0]:
              raise SystemExit('Fim do bloco zx-compat não localizado de forma segura')

          start = starts[0]
          end = ends[0]

          new_block = [
              '          app_candidates = sorted((work / "Payload").glob("*.app"))\n',
              '          matching_apps = []\n',
              '\n',
              '          for candidate in app_candidates:\n',
              '              candidate_info_path = candidate / "Info.plist"\n',
              '              if not candidate_info_path.is_file():\n',
              '                  continue\n',
              '              try:\n',
              '                  with candidate_info_path.open("rb") as f:\n',
              '                      candidate_info = plistlib.load(f)\n',
              '              except Exception:\n',
              '                  continue\n',
              '              if candidate_info.get("CFBundleIdentifier") == BUNDLE_ID:\n',
              '                  matching_apps.append((candidate, candidate_info))\n',
              '\n',
              '          if len(matching_apps) != 1:\n',
              '              raise SystemExit(\n',
              '                  "❌ zx-compat: esperava 1 .app correspondente ao Bundle ID "\n',
              '                  f"{BUNDLE_ID}; encontrei {len(matching_apps)} entre "\n',
              '                  f"{len(app_candidates)} candidato(s)"\n',
              '              )\n',
              '\n',
              '          app, info = matching_apps[0]\n',
              '          info_path = app / "Info.plist"\n',
              '\n',
              '          actual_bundle_id = info.get("CFBundleIdentifier")\n',
              '          if actual_bundle_id != BUNDLE_ID:\n',
              '              raise SystemExit(\n',
              '                  "❌ zx-compat: Bundle ID do IPA diverge do selecionado: "\n',
              '                  f"{actual_bundle_id!r} != {BUNDLE_ID!r}"\n',
              '              )\n',
              '\n',
          ]

          lines[start:end] = new_block
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          git diff --check
          grep -F 'matching_apps = []' .github/workflows/telegram-inject.yml
          grep -F '"com.facebook.Facebook"' .github/workflows/telegram-inject.yml
          grep -F '"com.facebook.Messenger"' .github/workflows/telegram-inject.yml
          grep -F '"ph.telegra.Telegraph"' .github/workflows/telegram-inject.yml

      - name: Commit fix
        run: |
          if git diff --quiet -- .github/workflows/telegram-inject.yml; then
            echo "No change needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/telegram-inject.yml
          git commit -m "Fix zx-compat main app selection"
          git push
