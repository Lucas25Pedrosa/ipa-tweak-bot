name: One-time fix zx app selection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-zx-app-selection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch downstream main app selection
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/telegram-inject.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          def step_bounds(name):
              marker = f'      - name: {name}'
              starts = [i for i, line in enumerate(lines) if line.rstrip('\n') == marker]
              if len(starts) != 1:
                  raise SystemExit(f'Esperava 1 etapa {name!r}; encontrei {len(starts)}')
              start = starts[0]
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
              return start, end

          def find_in_step(name, exact):
              start, end = step_bounds(name)
              hits = [i for i in range(start, end) if lines[i].rstrip('\n') == exact]
              if len(hits) != 1:
                  raise SystemExit(f'Esperava 1 ocorrência em {name!r}: {exact!r}; encontrei {len(hits)}')
              return hits[0]

          def resolver_block(bundle_expr, label):
              return [
                  '          app_candidates = sorted((work / "Payload").glob("*.app"))\n',
                  '          matching_apps = []\n',
                  '\n',
                  '          for candidate in app_candidates:\n',
                  '              candidate_info_path = candidate / "Info.plist"\n',
                  '              if not candidate_info_path.is_file():\n',
                  '                  continue\n',
                  '              try:\n',
                  '                  with candidate_info_path.open("rb") as f:\n',
                  '                      candidate_info = plistlib.load(f)\n',
                  '              except Exception:\n',
                  '                  continue\n',
                  f'              if candidate_info.get("CFBundleIdentifier") == {bundle_expr}:\n',
                  '                  matching_apps.append(candidate)\n',
                  '\n',
                  '          if len(matching_apps) != 1:\n',
                  '              raise SystemExit(\n',
                  f'                  "❌ {label}: esperava 1 .app correspondente ao Bundle ID "\n',
                  f'                  f"{{{bundle_expr}}}; encontrei {{len(matching_apps)}} entre "\n',
                  '                  f"{len(app_candidates)} candidato(s)"\n',
                  '              )\n',
                  '\n',
                  '          app = matching_apps[0]\n',
                  '\n',
              ]

          step = 'Add root files, frameworks, bundles and extra extensions'
          start, end = step_bounds(step)
          if not any(line.rstrip('\n') == '        env:' for line in lines[start:end]):
              if_index = next(i for i in range(start, end) if lines[i].startswith('        if: '))
              lines[if_index + 1:if_index + 1] = [
                  '        env:\n',
                  '          BUNDLE_ID: $' + '{{ steps.prepare.outputs.bundle_id || steps.private_input.outputs.bundle_id }}\n',
              ]

          start, end = step_bounds(step)
          import_json = find_in_step(step, '          import json')
          block_text = ''.join(lines[start:end])
          additions = []
          if '          import os\n' not in block_text:
              additions.append('          import os\n')
          if '          import plistlib\n' not in block_text:
              additions.append('          import plistlib\n')
          if additions:
              lines[import_json + 1:import_json + 1] = additions

          select_start = find_in_step(step, '          apps = list(')
          select_end = find_in_step(step, '          root_source = Path(')
          lines[select_start:select_end] = [
              '          bundle_id = os.environ.get("BUNDLE_ID", "").strip()\n',
              '\n',
          ] + resolver_block('bundle_id', 'Empacotamento')

          step = 'Apply Info.plist changes'
          select_start = find_in_step(step, '          apps = list(')
          select_end = find_in_step(step, '          plist_path = app / "Info.plist"')
          lines[select_start:select_end] = resolver_block('bundle_id', 'Info.plist')

          step = 'Validate zx-compat final layout'
          select_start = find_in_step(step, '          apps = list((work / "Payload").glob("*.app"))')
          select_end = find_in_step(step, '          info_path = app / "Info.plist"')
          lines[select_start:select_end] = resolver_block('BUNDLE_ID', 'zx-compat final')

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          git diff --check
          grep -F '❌ Empacotamento: esperava 1 .app correspondente ao Bundle ID' .github/workflows/telegram-inject.yml
          grep -F '❌ Info.plist: esperava 1 .app correspondente ao Bundle ID' .github/workflows/telegram-inject.yml
          grep -F '❌ zx-compat final: esperava 1 .app correspondente ao Bundle ID' .github/workflows/telegram-inject.yml

      - name: Commit fix
        run: |
          if git diff --quiet -- .github/workflows/telegram-inject.yml; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/telegram-inject.yml
          git commit -m "Handle auxiliary top-level apps in zx route"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
          git push
