name: Apply Swiftgram main-only Lead workflow safely

on:
  push:
    paths:
      - '.github/workflows/apply-swiftgram-main-only-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify current workflow
        run: |
          ACTUAL="$(git hash-object .github/workflows/telegram-inject.yml)"
          EXPECTED="8dd9b24af3d69411fd7305e6c181e51e54cc3376"
          echo "Current workflow blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply Swiftgram main-only formula
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/telegram-inject.yml')
          text = path.read_text(encoding='utf-8')

          old = '          echo "💉 Lead 2.0: aplicando fórmula oficial do desenvolvedor"\n'
          new = '          echo "💉 Lead 2.0: aplicando layout específico do aplicativo"\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected 1 Lead label, found {text.count(old)}')
          text = text.replace(old, new, 1)

          start_marker = '          notification_services = []\n'
          end_marker = '          print(\n              "✅ Lead 2.0 PT-BR copiado como "\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Lead notification block markers not found')

          old_segment = text[start:end]
          indented = ''.join(
              ('    ' + line if line.strip() else line)
              for line in old_segment.splitlines(keepends=True)
          )

          telegram_branch = (
              '          if EXPECTED_BUNDLE_ID == "ph.telegra.Telegraph":\n'
              + indented
              + '              formula_label = (\n'
                '                  "app principal + Notification Service Extension"\n'
                '              )\n'
          )

          swiftgram_branch = '''          else:\n              # Swiftgram: Lead deve existir somente no executável principal.\n              for directory_name in (\n                  "PlugIns",\n                  "Extensions",\n              ):\n                  directory = app / directory_name\n                  if not directory.is_dir():\n                      continue\n\n                  for extension in sorted(\n                      directory.glob("*.appex")\n                  ):\n                      extension_info_path = extension / "Info.plist"\n                      if not extension_info_path.is_file():\n                          continue\n\n                      with extension_info_path.open("rb") as f:\n                          extension_info = plistlib.load(f)\n\n                      extension_executable_name = (\n                          extension_info.get("CFBundleExecutable")\n                      )\n                      if not extension_executable_name:\n                          continue\n\n                      extension_executable = (\n                          extension / extension_executable_name\n                      )\n                      if not extension_executable.is_file():\n                          continue\n\n                      existing = linked_dylibs(\n                          bytearray(extension_executable.read_bytes())\n                      )\n                      if any(\n                          Path(dependency).name.lower()\n                          == INTERNAL_DYLIB_NAME.lower()\n                          for dependency in existing\n                      ):\n                          raise SystemExit(\n                              "❌ Swiftgram + Lead: Lead já está ligado "\n                              f"indevidamente em {extension.name}"\n                          )\n\n              formula_label = "somente app principal"\n\n'''

          text = text[:start] + telegram_branch + swiftgram_branch + text[end:]

          old = '''          print(\n              "✅ Fórmula do desenvolvedor aplicada: "\n              "app principal + Notification Service Extension"\n          )\n'''
          new = '''          print(\n              "✅ Fórmula aplicada: "\n              f"{formula_label}"\n          )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected 1 formula print block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''          nse_lead_load = (\n              "@executable_path/../../Frameworks/Lead.dylib"\n          )\n          if nse_lead_load not in nse_deps:\n              raise SystemExit(\n                  "❌ Swiftgram + Lead/Cyan: load oficial do Lead sumiu da NSE"\n              )\n'''
          new = '''          if any(\n              Path(dep).name.lower() == "lead.dylib"\n              for dep in nse_deps\n          ):\n              raise SystemExit(\n                  "❌ Swiftgram + Lead/Cyan: Lead atingiu indevidamente a NSE"\n              )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected 1 Cyan NSE Lead check, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '          print("✅ Lead oficial preservado no principal e na NSE")\n'
          new = '          print("✅ Lead permanece somente no executável principal")\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected 1 Cyan Lead status line, found {text.count(old)}')
          text = text.replace(old, new, 1)

          start_marker = '      - name: Validate Swiftgram Lead final layout\n'
          end_marker = '      - name: Validate RustTikTok final layout\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Swiftgram final validator markers not found')
          text = text[:start] + '\n' + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

          ACTUAL="$(git hash-object .github/workflows/telegram-inject.yml)"
          EXPECTED="dc35f56c6dcdc8f5c400e4bebc69cffe0c116d1f"
          echo "Updated workflow blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit update and remove helpers
        run: |
          rm -f .github/workflows/apply-swiftgram-main-only.yml
          rm -f .github/workflows/apply-swiftgram-main-only-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Swiftgram Lead formula to main-only'
          git push origin HEAD:main
