name: Facebook Notification Fix - V2 Diagnostic

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Facebook + Glow .ipa (antes da assinatura do Feather)"
        required: true
        default: "https://pub-4c58191013f0429aab20e217182b7f04.r2.dev/Facebook/Facebook%20-%20574.0.0.ipa"
        type: string

permissions:
  contents: read

jobs:
  build-fix:
    name: Build diagnostic dylib
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Create no-op diagnostic source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          cat > build/FacebookNotificationFix.m <<'OBJC'
          #import <Foundation/Foundation.h>

          /*
           * Facebook Notification Fix - V2 DIAGNOSTIC
           *
           * Esta versão é intencionalmente NO-OP:
           * - não faz swizzle;
           * - não altera App Groups;
           * - não toca em Keychain;
           * - não intercepta CFPreferences;
           * - apenas comprova que o mesmo dylib pode ser carregado
           *   pelo Facebook principal e pela NotificationServiceExtension.
           */

          __attribute__((constructor))
          static void FacebookNotificationFixDiagnosticInit(void) {
              @autoreleasepool {
                  NSString *bundleID = [[NSBundle mainBundle] bundleIdentifier];
                  NSString *processName = [[NSProcessInfo processInfo] processName];

                  NSLog(
                      @"[FBNotifDiag] dylib carregado | bundle=%@ | processo=%@",
                      bundleID ?: @"unknown.bundle",
                      processName ?: @"unknown.process"
                  );
              }
          }
          OBJC

          echo "✅ Fonte de diagnóstico criada"
          wc -l build/FacebookNotificationFix.m

      - name: Compile iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "📱 iPhoneOS SDK: $SDK_PATH"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -install_name "@rpath/FacebookNotificationFix.dylib" \
            -Wl,-dead_strip \
            build/FacebookNotificationFix.m \
            -o build/FacebookNotificationFix.dylib

          chmod 755 build/FacebookNotificationFix.dylib

          echo
          echo "✅ Dylib compilado"
          file build/FacebookNotificationFix.dylib
          ls -lh build/FacebookNotificationFix.dylib
          shasum -a 256 build/FacebookNotificationFix.dylib

          file build/FacebookNotificationFix.dylib \
            | grep -qi "arm64" \
            || {
              echo "❌ Dylib não é arm64"
              exit 1
            }

      - name: Inspect dylib load commands
        shell: bash
        run: |
          set -euo pipefail

          xcrun otool -L build/FacebookNotificationFix.dylib
          xcrun otool -l build/FacebookNotificationFix.dylib \
            | grep -A3 -E 'LC_ID_DYLIB|LC_BUILD_VERSION|LC_VERSION_MIN' \
            || true

      - name: Upload diagnostic dylib
        uses: actions/upload-artifact@v4
        with:
          name: facebook-notification-fix-v2-dylib
          path: build/FacebookNotificationFix.dylib
          if-no-files-found: error
          retention-days: 3

  patch-facebook:
    name: Patch Facebook IPA
    needs: build-fix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            curl \
            file \
            unzip \
            zip

          python -m pip install --upgrade pip

          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          echo
          echo "✅ Dependências instaladas"
          cyan --version

      - name: Download diagnostic dylib
        uses: actions/download-artifact@v4
        with:
          name: facebook-notification-fix-v2-dylib
          path: fix

      - name: Validate downloaded dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f fix/FacebookNotificationFix.dylib

          chmod 755 fix/FacebookNotificationFix.dylib

          file fix/FacebookNotificationFix.dylib
          ls -lh fix/FacebookNotificationFix.dylib
          sha256sum fix/FacebookNotificationFix.dylib

          file fix/FacebookNotificationFix.dylib \
            | grep -qi "arm64" \
            || {
              echo "❌ Dylib baixado não é arm64"
              exit 1
            }

      - name: Download Facebook IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$IPA_URL" ]; then
            echo "❌ ipa_url vazio"
            exit 1
          fi

          echo "📥 Baixando Facebook IPA..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          if ! unzip -tq input.ipa > /dev/null; then
            echo "❌ Arquivo baixado não é um IPA/ZIP válido"
            exit 1
          fi

          echo
          echo "✅ IPA válido"
          ls -lh input.ipa
          sha256sum input.ipa

      - name: Extract and identify Facebook targets
        id: identify
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work

          unzip -q input.ipa -d work

          python <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("work/Payload")
          apps = list(payload.glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal; encontrei {len(apps)}"
              )

          app = apps[0]
          app_plist_path = app / "Info.plist"

          with app_plist_path.open("rb") as f:
              app_plist = plistlib.load(f)

          bundle_id = app_plist.get("CFBundleIdentifier")
          executable_name = app_plist.get("CFBundleExecutable")
          version = app_plist.get(
              "CFBundleShortVersionString",
              "Unknown",
          )

          if bundle_id != "com.facebook.Facebook":
              raise SystemExit(
                  "❌ O IPA não é o Facebook esperado. "
                  f"Bundle ID encontrado: {bundle_id}"
              )

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable ausente no Facebook"
              )

          main_executable = app / executable_name

          if not main_executable.is_file():
              raise SystemExit(
                  f"❌ Executável principal não encontrado: {main_executable}"
              )

          plugins = app / "PlugIns"

          if not plugins.is_dir():
              raise SystemExit(
                  "❌ Diretório PlugIns não encontrado"
              )

          candidates = []

          for appex in sorted(plugins.glob("*.appex")):
              plist_path = appex / "Info.plist"

              if not plist_path.is_file():
                  continue

              try:
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
              except Exception:
                  continue

              ext = plist.get("NSExtension") or {}
              point = ext.get("NSExtensionPointIdentifier")
              bid = plist.get("CFBundleIdentifier", "")
              exe = plist.get("CFBundleExecutable")

              is_notification_service = (
                  point == "com.apple.usernotifications.service"
                  or "NotificationServiceExtension" in bid
                  or appex.name == "NotificationServiceExtension.appex"
              )

              if is_notification_service and exe:
                  binary = appex / exe

                  if binary.is_file():
                      candidates.append(
                          (
                              appex,
                              binary,
                              bid,
                              point,
                          )
                      )

          if len(candidates) != 1:
              print("Extensões encontradas:")
              for appex in sorted(plugins.glob("*.appex")):
                  print(f" - {appex.name}")

              raise SystemExit(
                  "❌ Esperava exatamente 1 NotificationServiceExtension; "
                  f"encontrei {len(candidates)}"
              )

          notification_appex, notification_executable, ext_bid, ext_point = (
              candidates[0]
          )

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as out:
              out.write(f"app_path={app}\n")
              out.write(f"main_executable={main_executable}\n")
              out.write(
                  "notification_appex="
                  f"{notification_appex}\n"
              )
              out.write(
                  "notification_executable="
                  f"{notification_executable}\n"
              )
              out.write(f"version={version}\n")

          print()
          print("✅ Facebook identificado")
          print(f"📦 Bundle ID: {bundle_id}")
          print(f"🔢 Versão: {version}")
          print(f"▶️ Executável principal: {main_executable}")
          print()
          print("✅ NotificationServiceExtension identificada")
          print(f"📦 Bundle ID: {ext_bid}")
          print(f"🧩 Extension point: {ext_point}")
          print(f"▶️ Executável: {notification_executable}")
          PY

      - name: Copy diagnostic dylib into Facebook Frameworks
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORKS="$APP_PATH/Frameworks"

          mkdir -p "$FRAMEWORKS"

          cp \
            fix/FacebookNotificationFix.dylib \
            "$FRAMEWORKS/FacebookNotificationFix.dylib"

          chmod 755 \
            "$FRAMEWORKS/FacebookNotificationFix.dylib"

          echo "✅ Dylib copiado para:"
          echo "$FRAMEWORKS/FacebookNotificationFix.dylib"

          file \
            "$FRAMEWORKS/FacebookNotificationFix.dylib"

      - name: Inject diagnostic dylib into Facebook and NotificationServiceExtension
        env:
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          targets = [
              (
                  "Facebook principal",
                  Path(os.environ["MAIN_EXECUTABLE"]),
                  "@rpath/FacebookNotificationFix.dylib",
              ),
              (
                  "NotificationServiceExtension",
                  Path(os.environ["NOTIFICATION_EXECUTABLE"]),
                  "@executable_path/../../Frameworks/FacebookNotificationFix.dylib",
              ),
          ]

          for label, binary, dependency in targets:
              print()
              print("=" * 72)
              print(f"🎯 {label}")
              print(f"Binário: {binary}")
              print(f"Dependência: {dependency}")

              if not binary.is_file():
                  raise SystemExit(
                      f"❌ Binário não encontrado: {binary}"
                  )

              before = Executable(
                  str(binary)
              ).get_dependencies()

              print(
                  "Dependência já existia antes:",
                  dependency in before,
              )

              if dependency not in before:
                  executable = Executable(str(binary))

                  if not Path(executable.idylib).is_file():
                      raise SystemExit(
                          "❌ insert_dylib do Cyan não encontrado: "
                          f"{executable.idylib}"
                      )

                  # A assinatura Mach-O antiga ficará inválida após alterar
                  # os load commands. O IPA será assinado no Feather depois.
                  executable.remove_signature()

                  result = subprocess.run(
                      [
                          executable.idylib,
                          "--inplace",
                          "--all-yes",
                          dependency,
                          str(binary),
                      ],
                      text=True,
                      capture_output=True,
                  )

                  if result.stdout:
                      print(result.stdout)

                  if result.stderr:
                      print(result.stderr)

                  if result.returncode != 0:
                      raise SystemExit(
                          "❌ insert_dylib falhou em "
                          f"{label}: código {result.returncode}"
                      )

              after = Executable(
                  str(binary)
              ).get_dependencies()

              if dependency not in after:
                  raise SystemExit(
                      f"❌ Dependência não encontrada após injeção em {label}"
                  )

              print(f"✅ Injeção validada em {label}")

          print()
          print("✅ Os dois executáveis carregam o dylib diagnóstico")
          PY

      - name: Validate that V1 hooks are absent from diagnostic dylib
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          DYLIB="$APP_PATH/Frameworks/FacebookNotificationFix.dylib"

          echo "🔎 Procurando símbolos/strings proibidos da V1..."

          FORBIDDEN=(
            "SecItemCopyMatching"
            "SecItemAdd"
            "SecItemUpdate"
            "SecItemDelete"
            "CFPreferencesCopyAppValue"
            "CFPreferencesSetAppValue"
            "containerURLForSecurityApplicationGroupIdentifier"
            "initWithSuiteName"
            "method_exchangeImplementations"
            "T84QZS65DQ"
            "group.com.facebook"
          )

          for token in "${FORBIDDEN[@]}"; do
            if grep -aFq "$token" "$DYLIB"; then
              echo "❌ A V2 diagnóstico contém token proibido: $token"
              exit 1
            fi
          done

          echo "✅ Nenhum hook da V1 está presente"

      - name: Validate Mach-O dependencies
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          app = Path(os.environ["APP_PATH"])
          main = Path(os.environ["MAIN_EXECUTABLE"])
          extension = Path(
              os.environ["NOTIFICATION_EXECUTABLE"]
          )
          dylib = (
              app
              / "Frameworks"
              / "FacebookNotificationFix.dylib"
          )

          if not dylib.is_file():
              raise SystemExit(
                  "❌ FacebookNotificationFix.dylib ausente"
              )

          main_required = (
              "@rpath/FacebookNotificationFix.dylib"
          )

          extension_required = (
              "@executable_path/../../Frameworks/"
              "FacebookNotificationFix.dylib"
          )

          main_deps = Executable(
              str(main)
          ).get_dependencies()

          ext_deps = Executable(
              str(extension)
          ).get_dependencies()

          if main_required not in main_deps:
              raise SystemExit(
                  "❌ Dependência diagnóstico ausente no Facebook"
              )

          if extension_required not in ext_deps:
              raise SystemExit(
                  "❌ Dependência diagnóstico ausente na extensão"
              )

          print("✅ Facebook principal:")
          print(f"   {main_required}")

          print("✅ NotificationServiceExtension:")
          print(f"   {extension_required}")

          print("✅ Dylib físico:")
          print(f"   {dylib}")
          PY

      - name: Create diagnostic report
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_APPEX: ${{ steps.identify.outputs.notification_appex }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
          APP_VERSION: ${{ steps.identify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          python <<'PY'
          import hashlib
          import os
          from pathlib import Path

          app = Path(os.environ["APP_PATH"])
          dylib = (
              app
              / "Frameworks"
              / "FacebookNotificationFix.dylib"
          )

          digest = hashlib.sha256(
              dylib.read_bytes()
          ).hexdigest()

          report_lines = [
              "Facebook Notification Fix - V2 Diagnostic",
              "",
              "Facebook version:",
              f"  {os.environ['APP_VERSION']}",
              "",
              "Main executable:",
              f"  {os.environ['MAIN_EXECUTABLE']}",
              "",
              "Notification appex:",
              f"  {os.environ['NOTIFICATION_APPEX']}",
              "",
              "Notification executable:",
              f"  {os.environ['NOTIFICATION_EXECUTABLE']}",
              "",
              "Injected dylib:",
              f"  {dylib}",
              "",
              "Dylib SHA-256:",
              f"  {digest}",
              "",
              "V2 behavior:",
              "  - NO App Group remapping",
              "  - NO Keychain hooks",
              "  - NO CFPreferences hooks",
              "  - NO Objective-C method swizzling",
              "  - constructor only logs bundle/process information",
              "",
              "Purpose:",
              "  Determine whether simply loading a custom dylib in both the Facebook",
              "  main process and NotificationServiceExtension is stable.",
              "",
              "IMPORTANT:",
              "  This IPA is intentionally unsigned after Mach-O patching.",
              "  Sign it with Feather before installation.",
              "",
          ]
          report = "\n".join(report_lines)
          Path(
              "output/facebook-notification-fix-v2-report.txt"
          ).write_text(
              report,
              encoding="utf-8",
          )

          print(report)
          PY

      - name: Repack test IPA
        env:
          APP_VERSION: ${{ steps.identify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_NAME="Facebook-${APP_VERSION}-NotifFix-V2-Diagnostic.ipa"

          rm -f "output/$OUTPUT_NAME"

          (
            cd work
            zip -qry -y "../output/$OUTPUT_NAME" Payload
          )

          if ! unzip -tq "output/$OUTPUT_NAME" > /dev/null; then
            echo "❌ IPA final inválido"
            exit 1
          fi

          echo
          echo "✅ IPA de diagnóstico criado"
          ls -lh "output/$OUTPUT_NAME"
          sha256sum "output/$OUTPUT_NAME"

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: facebook-notification-fix-v2-diagnostic
          path: |
            output/*.ipa
            output/facebook-notification-fix-v2-report.txt
          if-no-files-found: error
          retention-days: 3
