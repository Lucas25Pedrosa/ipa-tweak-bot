name: Facebook Notification Fix - V3 Weak Loader

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Facebook + Glow .ipa (antes da assinatura do Feather)"
        required: true
        default: "https://pub-4c58191013f0429aab20e217182b7f04.r2.dev/Facebook/Facebook%20-%20574.0.0.ipa"
        type: string

permissions:
  contents: read

jobs:
  build-fix:
    name: Build minimal diagnostic dylib
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Create minimal C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat > build/FacebookNotificationFix.c <<'C'
          /*
           * Facebook Notification Fix - V3 WEAK LOADER
           *
           * Diagnóstico deliberadamente mínimo:
           * - C puro;
           * - sem Foundation;
           * - sem Objective-C;
           * - sem hooks;
           * - sem App Groups;
           * - sem Keychain;
           * - sem CFPreferences.
           *
           * Existe apenas um constructor C que altera uma variável local.
           * Se o dylib carregar, nenhum framework de alto nível é tocado.
           */

          static volatile int g_fb_notification_fix_loaded = 0;

          __attribute__((constructor))
          static void FBNotificationFixLoaderDiagnosticInit(void) {
              g_fb_notification_fix_loaded = 1;
          }

          __attribute__((visibility("default")))
          int FBNotificationFixDiagnosticMarker(void) {
              return g_fb_notification_fix_loaded;
          }
          C

          echo "✅ Fonte mínima criada"
          wc -l build/FacebookNotificationFix.c

      - name: Compile iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "📱 iPhoneOS SDK: $SDK_PATH"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios14.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -isysroot "$SDK_PATH" \
            -install_name "@rpath/FacebookNotificationFix.dylib" \
            -Wl,-dead_strip \
            build/FacebookNotificationFix.c \
            -o build/FacebookNotificationFix.dylib

          chmod 755 build/FacebookNotificationFix.dylib

          echo
          echo "✅ Dylib compilado"
          file build/FacebookNotificationFix.dylib
          ls -lh build/FacebookNotificationFix.dylib
          shasum -a 256 build/FacebookNotificationFix.dylib

          file build/FacebookNotificationFix.dylib \
            | grep -qi "arm64" \
            || {
              echo "❌ Dylib não é arm64"
              exit 1
            }

      - name: Validate minimal dylib dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "🔎 Dependências do dylib:"
          xcrun otool -L build/FacebookNotificationFix.dylib

          if xcrun otool -L build/FacebookNotificationFix.dylib \
            | grep -Eq 'Foundation|CoreFoundation|Security|UIKit|libobjc'; then
            echo "❌ O dylib mínimo trouxe dependência de framework/ObjC inesperada"
            exit 1
          fi

          echo "✅ Dylib é C puro e mínimo"

      - name: Upload diagnostic dylib
        uses: actions/upload-artifact@v4
        with:
          name: facebook-notification-fix-v3-dylib
          path: build/FacebookNotificationFix.dylib
          if-no-files-found: error
          retention-days: 3

  patch-facebook:
    name: Patch Facebook IPA with weak loader
    needs: build-fix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            curl \
            file \
            unzip \
            zip

          python -m pip install --upgrade pip
          pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

          echo
          echo "✅ Dependências instaladas"
          cyan --version

      - name: Download diagnostic dylib
        uses: actions/download-artifact@v4
        with:
          name: facebook-notification-fix-v3-dylib
          path: fix

      - name: Validate downloaded dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f fix/FacebookNotificationFix.dylib
          chmod 755 fix/FacebookNotificationFix.dylib
          file fix/FacebookNotificationFix.dylib
          sha256sum fix/FacebookNotificationFix.dylib

      - name: Download Facebook IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$IPA_URL" ]; then
            echo "❌ ipa_url vazio"
            exit 1
          fi

          echo "📥 Baixando Facebook IPA..."
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq input.ipa > /dev/null
          echo "✅ IPA válido"
          ls -lh input.ipa
          sha256sum input.ipa

      - name: Extract and identify Facebook targets
        id: identify
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work
          unzip -q input.ipa -d work

          python <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("work/Payload")
          apps = list(payload.glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal; encontrei {len(apps)}"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              app_plist = plistlib.load(f)

          bundle_id = app_plist.get("CFBundleIdentifier")
          executable_name = app_plist.get("CFBundleExecutable")
          version = app_plist.get("CFBundleShortVersionString", "Unknown")

          if bundle_id != "com.facebook.Facebook":
              raise SystemExit(
                  f"❌ IPA não é Facebook: {bundle_id}"
              )

          if not executable_name:
              raise SystemExit("❌ CFBundleExecutable ausente")

          main_executable = app / executable_name
          if not main_executable.is_file():
              raise SystemExit(
                  f"❌ Executável principal ausente: {main_executable}"
              )

          plugins = app / "PlugIns"
          candidates = []

          for appex in sorted(plugins.glob("*.appex")):
              plist_path = appex / "Info.plist"
              if not plist_path.is_file():
                  continue

              try:
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
              except Exception:
                  continue

              extension = plist.get("NSExtension") or {}
              point = extension.get("NSExtensionPointIdentifier")
              bid = plist.get("CFBundleIdentifier", "")
              exe = plist.get("CFBundleExecutable")

              if not exe:
                  continue

              is_notification_service = (
                  point == "com.apple.usernotifications.service"
                  or "NotificationServiceExtension" in bid
                  or appex.name == "NotificationServiceExtension.appex"
              )

              binary = appex / exe
              if is_notification_service and binary.is_file():
                  candidates.append((appex, binary, bid, point))

          if len(candidates) != 1:
              raise SystemExit(
                  "❌ Esperava 1 NotificationServiceExtension; "
                  f"encontrei {len(candidates)}"
              )

          notification_appex, notification_executable, ext_bid, ext_point = (
              candidates[0]
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"app_path={app}\n")
              out.write(f"main_executable={main_executable}\n")
              out.write(f"notification_appex={notification_appex}\n")
              out.write(f"notification_executable={notification_executable}\n")
              out.write(f"version={version}\n")

          print("✅ Facebook identificado")
          print(f"Bundle ID: {bundle_id}")
          print(f"Versão: {version}")
          print(f"Main: {main_executable}")
          print(f"NSE bundle: {ext_bid}")
          print(f"NSE point: {ext_point}")
          print(f"NSE executable: {notification_executable}")
          PY

      - name: Copy minimal dylib into Facebook Frameworks
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORKS="$APP_PATH/Frameworks"
          mkdir -p "$FRAMEWORKS"

          cp \
            fix/FacebookNotificationFix.dylib \
            "$FRAMEWORKS/FacebookNotificationFix.dylib"

          chmod 755 "$FRAMEWORKS/FacebookNotificationFix.dylib"

          echo "✅ Dylib copiado"
          file "$FRAMEWORKS/FacebookNotificationFix.dylib"

      - name: Inject dylib and convert both load commands to WEAK
        env:
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import struct
          import subprocess
          from pathlib import Path

          from cyan.tbhtypes.executable import Executable

          LC_LOAD_DYLIB = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018
          MH_MAGIC_64 = 0xFEEDFACF

          targets = [
              (
                  "Facebook principal",
                  Path(os.environ["MAIN_EXECUTABLE"]),
                  "@rpath/FacebookNotificationFix.dylib",
              ),
              (
                  "NotificationServiceExtension",
                  Path(os.environ["NOTIFICATION_EXECUTABLE"]),
                  "@executable_path/../../Frameworks/FacebookNotificationFix.dylib",
              ),
          ]

          def read_dylib_commands(path: Path):
              data = path.read_bytes()

              if len(data) < 32:
                  raise RuntimeError(f"Mach-O muito pequeno: {path}")

              magic = struct.unpack_from("<I", data, 0)[0]
              if magic != MH_MAGIC_64:
                  raise RuntimeError(
                      f"Esperava Mach-O 64-bit thin em {path}; magic={magic:#x}"
                  )

              ncmds = struct.unpack_from("<I", data, 16)[0]
              offset = 32
              commands = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", data, offset)

                  if cmdsize < 8 or offset + cmdsize > len(data):
                      raise RuntimeError(
                          f"Load command inválido em {path} @ {offset}"
                      )

                  if cmd in (LC_LOAD_DYLIB, LC_LOAD_WEAK_DYLIB):
                      name_offset = struct.unpack_from("<I", data, offset + 8)[0]
                      start = offset + name_offset
                      end_limit = offset + cmdsize
                      end = data.find(b"\0", start, end_limit)

                      if end == -1:
                          end = end_limit

                      name = data[start:end].decode("utf-8", errors="replace")
                      commands.append((offset, cmd, name))

                  offset += cmdsize

              return commands

          def convert_dependency_to_weak(path: Path, dependency: str):
              commands = read_dylib_commands(path)
              matches = [item for item in commands if item[2] == dependency]

              if len(matches) != 1:
                  raise RuntimeError(
                      f"Esperava 1 load command para {dependency} em {path}; "
                      f"encontrei {len(matches)}"
                  )

              offset, cmd, _ = matches[0]

              if cmd == LC_LOAD_WEAK_DYLIB:
                  print(f"ℹ️ {dependency} já era WEAK em {path}")
                  return

              if cmd != LC_LOAD_DYLIB:
                  raise RuntimeError(
                      f"Load command inesperado {cmd:#x} para {dependency}"
                  )

              with path.open("r+b") as f:
                  f.seek(offset)
                  f.write(struct.pack("<I", LC_LOAD_WEAK_DYLIB))

              verified = [
                  item
                  for item in read_dylib_commands(path)
                  if item[2] == dependency
              ]

              if len(verified) != 1 or verified[0][1] != LC_LOAD_WEAK_DYLIB:
                  raise RuntimeError(
                      f"Falha ao converter {dependency} para WEAK em {path}"
                  )

              print(f"✅ WEAK: {dependency}")

          for label, binary, dependency in targets:
              print()
              print("=" * 72)
              print(f"🎯 {label}")
              print(f"Binário: {binary}")
              print(f"Dependência: {dependency}")

              if not binary.is_file():
                  raise SystemExit(f"❌ Binário ausente: {binary}")

              existing = Executable(str(binary)).get_dependencies()

              if dependency not in existing:
                  executable = Executable(str(binary))

                  if not Path(executable.idylib).is_file():
                      raise SystemExit(
                          f"❌ insert_dylib ausente: {executable.idylib}"
                      )

                  executable.remove_signature()

                  result = subprocess.run(
                      [
                          executable.idylib,
                          "--inplace",
                          "--all-yes",
                          dependency,
                          str(binary),
                      ],
                      text=True,
                      capture_output=True,
                  )

                  if result.stdout:
                      print(result.stdout)
                  if result.stderr:
                      print(result.stderr)

                  if result.returncode != 0:
                      raise SystemExit(
                          f"❌ insert_dylib falhou em {label}: {result.returncode}"
                      )

              if dependency not in Executable(str(binary)).get_dependencies():
                  raise SystemExit(
                      f"❌ Dependência não apareceu após injeção em {label}"
                  )

              convert_dependency_to_weak(binary, dependency)

          print()
          print("✅ Ambos os load commands foram convertidos para WEAK")
          PY

      - name: Validate weak load commands and baseline tweaks
        env:
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import struct
          from pathlib import Path

          LC_LOAD_DYLIB = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018
          MH_MAGIC_64 = 0xFEEDFACF

          checks = [
              (
                  Path(os.environ["MAIN_EXECUTABLE"]),
                  "@rpath/FacebookNotificationFix.dylib",
              ),
              (
                  Path(os.environ["NOTIFICATION_EXECUTABLE"]),
                  "@executable_path/../../Frameworks/FacebookNotificationFix.dylib",
              ),
          ]

          def find_cmd(path, wanted):
              data = path.read_bytes()
              if struct.unpack_from("<I", data, 0)[0] != MH_MAGIC_64:
                  raise RuntimeError(f"Mach-O não suportado: {path}")

              ncmds = struct.unpack_from("<I", data, 16)[0]
              offset = 32
              found = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", data, offset)

                  if cmd in (LC_LOAD_DYLIB, LC_LOAD_WEAK_DYLIB):
                      nameoff = struct.unpack_from("<I", data, offset + 8)[0]
                      start = offset + nameoff
                      end = data.find(b"\0", start, offset + cmdsize)
                      if end == -1:
                          end = offset + cmdsize
                      name = data[start:end].decode("utf-8", errors="replace")
                      if name == wanted:
                          found.append(cmd)

                  offset += cmdsize

              return found

          for path, dependency in checks:
              cmds = find_cmd(path, dependency)
              if cmds != [LC_LOAD_WEAK_DYLIB]:
                  raise SystemExit(
                      f"❌ {dependency} não está WEAK em {path}: {cmds}"
                  )
              print(f"✅ WEAK confirmado: {path.name} -> {dependency}")

          print("✅ Validação estrutural V3 concluída")
          PY

          echo
          echo "🔎 Main custom deps:"
          strings "$MAIN_EXECUTABLE" \
            | grep -E 'Glow\.dylib|FacebookNotificationFix\.dylib|CydiaSubstrate' \
            | sort -u \
            || true

          echo
          echo "🔎 NSE custom deps:"
          strings "$NOTIFICATION_EXECUTABLE" \
            | grep -E 'zxPluginsInject\.dylib|FacebookNotificationFix\.dylib' \
            | sort -u \
            || true

      - name: Repack V3 diagnostic IPA
        env:
          APP_VERSION: ${{ steps.identify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          OUTPUT_NAME="Facebook-${APP_VERSION}-NotificationFix-V3-WeakLoader-UNSIGNED.ipa"

          (
            cd work
            zip -qry9 "../output/$OUTPUT_NAME" Payload
          )

          unzip -tq "output/$OUTPUT_NAME" > /dev/null

          cat > output/facebook-notification-fix-v3-report.txt <<'REPORT'
          Facebook Notification Fix - V3 WEAK LOADER

          Objetivo deste build:
          - testar somente a carga do dylib;
          - dylib C puro, sem Foundation/ObjC/hooks;
          - load command WEAK no Facebook principal;
          - load command WEAK na NotificationServiceExtension;
          - Glow e zxPluginsInject permanecem intactos.

          IMPORTANTE:
          Este IPA está sem assinatura após a alteração Mach-O.
          Assine no Feather antes de instalar.

          Resultado esperado do teste:
          - se o Facebook abrir, a V2 caiu por causa da carga obrigatória
            e/ou inicialização Foundation da V2;
          - se ainda cair, precisamos do crash log do iOS porque até uma
            dependência WEAK e um dylib C mínimo estarão envolvidos.
          REPORT

          echo "✅ IPA V3 criado"
          ls -lh "output/$OUTPUT_NAME"
          sha256sum "output/$OUTPUT_NAME"

      - name: Upload V3 test IPA
        uses: actions/upload-artifact@v4
        with:
          name: facebook-notification-fix-v3-weak-loader
          path: |
            output/*.ipa
            output/facebook-notification-fix-v3-report.txt
          if-no-files-found: error
          retention-days: 3
