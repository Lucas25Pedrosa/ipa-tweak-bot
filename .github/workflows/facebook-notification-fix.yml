name: Facebook Notification Fix - V6 Safe Pass-Through Probe

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direto para o Facebook + Glow .ipa (antes da assinatura do Feather)"
        required: true
        default: "https://pub-4c58191013f0429aab20e217182b7f04.r2.dev/Facebook/Facebook%20-%20574.0.0.ipa"
        type: string

permissions:
  contents: read

jobs:
  build-fix:
    name: Build narrow UserNotifications probe
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Create safe pass-through probe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat > build/FacebookNotificationFix.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <UserNotifications/UserNotifications.h>
          #import <objc/runtime.h>

          /*
           * Facebook Notification Fix - V6 SAFE PASS-THROUGH PROBE
           *
           * Objetivo:
           * - manter exatamente o mesmo loader estável do IPA Patch;
           * - carregar somente na NotificationServiceExtension;
           * - interceptar o método de entrada da FBNotificationService;
           * - NÃO embrulhar o contentHandler;
           * - NÃO alterar request;
           * - NÃO alterar content;
           * - NÃO alterar App Groups;
           * - NÃO alterar Keychain;
           * - NÃO alterar CFPreferences;
           * - NÃO alterar o Facebook principal.
           *
           * O hook simplesmente chama o método original com os MESMOS
           * argumentos recebidos.
           *
           * Interpretação:
           * - se as notificações visíveis voltarem, o problema da V5 era
           *   especificamente o wrapper do contentHandler;
           * - se continuarem sem aparecer, o simples hook desse método já
           *   interfere e devemos abandonar esse ponto de interceptação.
           */

          typedef void (^FBV6ContentHandler)(UNNotificationContent *content);

          typedef void (*FBV6ReceiveIMP)(
              id self,
              SEL _cmd,
              UNNotificationRequest *request,
              FBV6ContentHandler contentHandler
          );

          static FBV6ReceiveIMP gFBV6OriginalReceive = NULL;
          static BOOL gFBV6Installed = NO;

          static void FBV6Receive(
              id self,
              SEL _cmd,
              UNNotificationRequest *request,
              FBV6ContentHandler contentHandler
          ) {
              FBV6ReceiveIMP original = gFBV6OriginalReceive;

              if (!original) {
                  return;
              }

              original(
                  self,
                  _cmd,
                  request,
                  contentHandler
              );
          }

          static void FBV6InstallHook(void) {
              if (gFBV6Installed) {
                  return;
              }

              Class targetClass =
                  objc_getClass("FBNotificationService");

              if (!targetClass) {
                  return;
              }

              SEL selector = sel_registerName(
                  "didReceiveNotificationRequest:withContentHandler:"
              );

              Method method =
                  class_getInstanceMethod(
                      targetClass,
                      selector
                  );

              if (!method) {
                  return;
              }

              IMP originalIMP =
                  method_getImplementation(method);

              if (!originalIMP) {
                  return;
              }

              const char *types =
                  method_getTypeEncoding(method);

              gFBV6OriginalReceive =
                  (FBV6ReceiveIMP)originalIMP;

              if (!class_addMethod(
                      targetClass,
                      selector,
                      (IMP)FBV6Receive,
                      types
                  )) {
                  method_setImplementation(
                      method,
                      (IMP)FBV6Receive
                  );
              }

              gFBV6Installed = YES;
          }

          __attribute__((constructor))
          static void FBV6Init(void) {
              @autoreleasepool {
                  NSString *bundleID =
                      [[NSBundle mainBundle] bundleIdentifier];

                  if (![bundleID isEqualToString:
                          @"com.facebook.Facebook.NotificationServiceExtension"]) {
                      return;
                  }

                  FBV6InstallHook();
              }
          }
          OBJC

          echo "✅ Fonte V6 criada"
          wc -l build/FacebookNotificationFix.m

      - name: Compile iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "📱 iPhoneOS SDK: $SDK_PATH"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios14.0 \
            -arch arm64 \
            -dynamiclib \
            -Os \
            -fobjc-arc \
            -fblocks \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -framework UserNotifications \
            -install_name "@rpath/FacebookNotificationFix.dylib" \
            -Wl,-dead_strip \
            build/FacebookNotificationFix.m \
            -o build/FacebookNotificationFix.dylib

          chmod 755 build/FacebookNotificationFix.dylib

          echo
          echo "✅ Dylib compilado"
          file build/FacebookNotificationFix.dylib
          ls -lh build/FacebookNotificationFix.dylib
          shasum -a 256 build/FacebookNotificationFix.dylib

          file build/FacebookNotificationFix.dylib \
            | grep -qi "arm64" \
            || {
              echo "❌ Dylib não é arm64"
              exit 1
            }

      - name: Validate V6 dylib dependencies and scope
        shell: bash
        run: |
          set -euo pipefail

          echo "🔎 Dependências do dylib:"
          xcrun otool -L build/FacebookNotificationFix.dylib

          xcrun otool -L build/FacebookNotificationFix.dylib \
            | grep -F "Foundation.framework/Foundation" \
            > /dev/null

          xcrun otool -L build/FacebookNotificationFix.dylib \
            | grep -F "UserNotifications.framework/UserNotifications" \
            > /dev/null

          if strings build/FacebookNotificationFix.dylib \
            | grep -Eq \
              'SecItem|CFPreferences|containerURLForSecurityApplicationGroupIdentifier|T84QZS65DQ|group\.com\.facebook'; then
            echo "❌ V6 contém hook/identificador fora do escopo"
            exit 1
          fi

          strings build/FacebookNotificationFix.dylib \
            | grep -F "FBNotificationService" \
            > /dev/null

          strings build/FacebookNotificationFix.dylib \
            | grep -F "didReceiveNotificationRequest:withContentHandler:" \
            > /dev/null

          echo "✅ V6 contém somente o hook pass-through de UserNotifications"

      - name: Upload V6 probe dylib
        uses: actions/upload-artifact@v6
        with:
          name: facebook-notification-fix-v6-pass-through-dylib
          path: build/FacebookNotificationFix.dylib
          if-no-files-found: error
          retention-days: 3

  patch-facebook:
    name: Patch NSE via stable IPA Patch loader
    needs: build-fix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            file \
            unzip \
            zip

          echo "✅ Dependências instaladas"

      - name: Install IPA Patch 2.1.3
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --location \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            --output ipapatch \
            https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.linux-amd64

          chmod +x ipapatch

          echo "✅ IPA Patch instalado"
          ./ipapatch --version

      - name: Download V6 probe dylib
        uses: actions/download-artifact@v7
        with:
          name: facebook-notification-fix-v6-pass-through-dylib
          path: fix

      - name: Validate downloaded dylib
        shell: bash
        run: |
          set -euo pipefail

          test -f fix/FacebookNotificationFix.dylib
          chmod 755 fix/FacebookNotificationFix.dylib

          file fix/FacebookNotificationFix.dylib
          sha256sum fix/FacebookNotificationFix.dylib

          file fix/FacebookNotificationFix.dylib \
            | grep -qi "arm64" \
            || {
              echo "❌ Dylib baixado não é arm64"
              exit 1
            }

      - name: Download Facebook IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$IPA_URL" ]; then
            echo "❌ ipa_url vazio"
            exit 1
          fi

          echo "📥 Baixando Facebook IPA..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output input.ipa \
            "$IPA_URL"

          unzip -tq input.ipa > /dev/null

          echo "✅ IPA válido"
          ls -lh input.ipa
          sha256sum input.ipa

      - name: Extract baseline IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf baseline
          mkdir -p baseline
          unzip -q input.ipa -d baseline

          echo "✅ IPA extraído"

      - name: Identify Facebook and NotificationServiceExtension
        id: identify
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import plistlib
          from pathlib import Path

          payload = Path("baseline/Payload")
          apps = list(payload.glob("*.app"))

          if len(apps) != 1:
              raise SystemExit(
                  f"❌ Esperava 1 app principal; encontrei {len(apps)}"
              )

          app = apps[0]

          with (app / "Info.plist").open("rb") as f:
              app_plist = plistlib.load(f)

          bundle_id = app_plist.get("CFBundleIdentifier")
          executable_name = app_plist.get("CFBundleExecutable")
          version = app_plist.get(
              "CFBundleShortVersionString",
              "Unknown",
          )

          if bundle_id != "com.facebook.Facebook":
              raise SystemExit(
                  f"❌ IPA não é Facebook: {bundle_id}"
              )

          if not executable_name:
              raise SystemExit(
                  "❌ CFBundleExecutable ausente no Facebook"
              )

          main_executable = app / executable_name

          if not main_executable.is_file():
              raise SystemExit(
                  f"❌ Executável principal ausente: {main_executable}"
              )

          plugins = app / "PlugIns"

          if not plugins.is_dir():
              raise SystemExit(
                  "❌ Diretório PlugIns ausente"
              )

          candidates = []

          for appex in sorted(plugins.glob("*.appex")):
              plist_path = appex / "Info.plist"

              if not plist_path.is_file():
                  continue

              try:
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
              except Exception:
                  continue

              extension = plist.get("NSExtension") or {}
              point = extension.get(
                  "NSExtensionPointIdentifier"
              )
              principal_class = extension.get(
                  "NSExtensionPrincipalClass"
              )
              bid = plist.get(
                  "CFBundleIdentifier",
                  "",
              )
              exe = plist.get("CFBundleExecutable")

              if not exe:
                  continue

              if (
                  point == "com.apple.usernotifications.service"
                  and principal_class != "FBNotificationService"
              ):
                  raise SystemExit(
                      "❌ Principal class inesperada na NSE: "
                      f"{principal_class}"
                  )

              is_notification_service = (
                  point == "com.apple.usernotifications.service"
                  or "NotificationServiceExtension" in bid
                  or appex.name
                  == "NotificationServiceExtension.appex"
              )

              binary = appex / exe

              if (
                  is_notification_service
                  and binary.is_file()
              ):
                  candidates.append(
                      (
                          appex,
                          binary,
                          bid,
                          point,
                          exe,
                      )
                  )

          if len(candidates) != 1:
              print("Extensões encontradas:")

              for appex in sorted(
                  plugins.glob("*.appex")
              ):
                  print(f" - {appex.name}")

              raise SystemExit(
                  "❌ Esperava 1 NotificationServiceExtension; "
                  f"encontrei {len(candidates)}"
              )

          (
              notification_appex,
              notification_executable,
              ext_bid,
              ext_point,
              ext_executable_name,
          ) = candidates[0]

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as out:
              out.write(
                  f"app_path={app}\n"
              )
              out.write(
                  f"main_executable={main_executable}\n"
              )
              out.write(
                  "notification_appex="
                  f"{notification_appex}\n"
              )
              out.write(
                  "notification_executable="
                  f"{notification_executable}\n"
              )
              out.write(
                  "notification_executable_name="
                  f"{ext_executable_name}\n"
              )
              out.write(
                  f"version={version}\n"
              )

          print()
          print("✅ Facebook identificado")
          print(f"Bundle ID: {bundle_id}")
          print(f"Versão: {version}")
          print(f"Main: {main_executable}")
          print()
          print(
              "✅ NotificationServiceExtension identificada"
          )
          print(f"Bundle ID: {ext_bid}")
          print(f"Extension point: {ext_point}")
          print("Principal class: FBNotificationService")
          print(
              f"Executável: {notification_executable}"
          )
          PY

      - name: Validate stable baseline before V4
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import struct
          from pathlib import Path

          LC_LOAD_DYLIB = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018
          MH_MAGIC_64 = 0xFEEDFACF

          main = Path(
              os.environ["MAIN_EXECUTABLE"]
          )
          nse = Path(
              os.environ["NOTIFICATION_EXECUTABLE"]
          )
          app = Path(
              os.environ["APP_PATH"]
          )

          def dependencies(path: Path):
              data = path.read_bytes()

              if len(data) < 32:
                  raise RuntimeError(
                      f"Mach-O pequeno: {path}"
                  )

              magic = struct.unpack_from(
                  "<I",
                  data,
                  0,
              )[0]

              if magic != MH_MAGIC_64:
                  raise RuntimeError(
                      "Esperava Mach-O arm64 thin: "
                      f"{path} magic={magic:#x}"
                  )

              ncmds = struct.unpack_from(
                  "<I",
                  data,
                  16,
              )[0]

              offset = 32
              result = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      data,
                      offset,
                  )

                  if (
                      cmdsize < 8
                      or offset + cmdsize > len(data)
                  ):
                      raise RuntimeError(
                          f"Load command inválido em {path}"
                      )

                  if cmd in (
                      LC_LOAD_DYLIB,
                      LC_LOAD_WEAK_DYLIB,
                  ):
                      nameoff = struct.unpack_from(
                          "<I",
                          data,
                          offset + 8,
                      )[0]

                      start = offset + nameoff
                      end = data.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )

                      if end == -1:
                          end = offset + cmdsize

                      name = data[
                          start:end
                      ].decode(
                          "utf-8",
                          errors="replace",
                      )

                      result.append(
                          (cmd, name)
                      )

                  offset += cmdsize

              return result

          main_deps = dependencies(main)
          nse_deps = dependencies(nse)

          if not any(
              "Glow.dylib" in name
              for _, name in main_deps
          ):
              raise SystemExit(
                  "❌ Glow não encontrado no Facebook principal"
              )

          if not any(
              name == "@rpath/zxPluginsInject.dylib"
              for _, name in nse_deps
          ):
              raise SystemExit(
                  "❌ Baseline não contém "
                  "@rpath/zxPluginsInject.dylib na NSE"
              )

          if any(
              "FacebookNotificationFix.dylib" in name
              for _, name in main_deps + nse_deps
          ):
              raise SystemExit(
                  "❌ Baseline já contém "
                  "FacebookNotificationFix.dylib"
              )

          zx = (
              app
              / "Frameworks"
              / "zxPluginsInject.dylib"
          )

          if not zx.is_file():
              raise SystemExit(
                  "❌ Frameworks/zxPluginsInject.dylib ausente"
              )

          nse_bytes = nse.read_bytes()

          if b"FBNotificationService" not in nse_bytes:
              raise SystemExit(
                  "❌ FBNotificationService não encontrada na NSE"
              )

          if (
              b"didReceiveNotificationRequest:withContentHandler:"
              not in nse_bytes
          ):
              raise SystemExit(
                  "❌ Selector de UserNotifications não encontrado na NSE"
              )

          print(
              "✅ Baseline validada: "
              "Glow no main + zxPluginsInject na NSE + "
              "FBNotificationService presente"
          )
          PY

      - name: Build isolated IPA containing only NotificationServiceExtension
        env:
          NOTIFICATION_APPEX: ${{ steps.identify.outputs.notification_appex }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf isolated isolated-preserved-plugins
          cp -a baseline isolated
          mkdir -p isolated-preserved-plugins

          ISOLATED_NOTIFICATION_APPEX="$(
            python - <<'PY'
          import os
          from pathlib import Path

          original = Path(
              os.environ["NOTIFICATION_APPEX"]
          )
          rel = original.relative_to("baseline")
          print(Path("isolated") / rel)
          PY
          )"

          PLUGINS_DIR="$(
            dirname "$ISOLATED_NOTIFICATION_APPEX"
          )"

          echo "🔎 Mantendo somente:"
          echo "$ISOLATED_NOTIFICATION_APPEX"

          shopt -s nullglob

          for appex in "$PLUGINS_DIR"/*.appex; do
            if [ "$appex" = "$ISOLATED_NOTIFICATION_APPEX" ]; then
              continue
            fi

            mv \
              "$appex" \
              isolated-preserved-plugins/
          done

          remaining=("$PLUGINS_DIR"/*.appex)

          if [ "${#remaining[@]}" -ne 1 ]; then
            echo "❌ Esperava exatamente 1 appex no IPA isolado"
            printf '%s\n' "${remaining[@]}"
            exit 1
          fi

          echo "✅ Somente NotificationServiceExtension ficou no IPA isolado"

          (
            cd isolated
            zip -qry9 ../isolated-input.ipa Payload
          )

          unzip -tq isolated-input.ipa > /dev/null
          ls -lh isolated-input.ipa

      - name: Patch isolated NotificationServiceExtension using IPA Patch custom dylib
        shell: bash
        run: |
          set -euo pipefail

          echo "🩹 Aplicando o MESMO injetor do IPA Patch"
          echo "🩹 Modo: plugins-only"
          echo "🧩 Dylib custom: FacebookNotificationFix.dylib (probe V6)"

          ./ipapatch \
            --input isolated-input.ipa \
            --output isolated-patched.ipa \
            --dylib fix/FacebookNotificationFix.dylib \
            --plugins-only \
            --noconfirm

          test -f isolated-patched.ipa
          unzip -tq isolated-patched.ipa > /dev/null

          echo "✅ IPA Patch concluiu a injeção isolada"
          ls -lh isolated-patched.ipa
          sha256sum isolated-patched.ipa

      - name: Extract patched NotificationServiceExtension
        shell: bash
        run: |
          set -euo pipefail

          rm -rf isolated-patched
          mkdir -p isolated-patched
          unzip -q isolated-patched.ipa -d isolated-patched

          echo "✅ IPA isolado patchado extraído"

      - name: Copy only IPA Patch-patched NSE binary back to full baseline
        env:
          NOTIFICATION_APPEX: ${{ steps.identify.outputs.notification_appex }}
          NOTIFICATION_EXECUTABLE_NAME: ${{ steps.identify.outputs.notification_executable_name }}
          APP_PATH: ${{ steps.identify.outputs.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          PATCHED_NSE_BINARY="$(
            python - <<'PY'
          import os
          from pathlib import Path

          original_appex = Path(
              os.environ["NOTIFICATION_APPEX"]
          )

          rel_appex = original_appex.relative_to(
              "baseline"
          )

          patched_appex = (
              Path("isolated-patched")
              / rel_appex
          )

          binary = (
              patched_appex
              / os.environ[
                  "NOTIFICATION_EXECUTABLE_NAME"
              ]
          )

          print(binary)
          PY
          )"

          ORIGINAL_NSE_BINARY="$(
            python - <<'PY'
          import os
          from pathlib import Path

          appex = Path(
              os.environ["NOTIFICATION_APPEX"]
          )

          print(
              appex
              / os.environ[
                  "NOTIFICATION_EXECUTABLE_NAME"
              ]
          )
          PY
          )"

          if [ ! -f "$PATCHED_NSE_BINARY" ]; then
            echo "❌ Binário NSE patchado ausente:"
            echo "$PATCHED_NSE_BINARY"
            exit 1
          fi

          if [ ! -f "$ORIGINAL_NSE_BINARY" ]; then
            echo "❌ Binário NSE baseline ausente:"
            echo "$ORIGINAL_NSE_BINARY"
            exit 1
          fi

          cp \
            "$PATCHED_NSE_BINARY" \
            "$ORIGINAL_NSE_BINARY"

          chmod 755 "$ORIGINAL_NSE_BINARY"

          mkdir -p "$APP_PATH/Frameworks"

          cp \
            fix/FacebookNotificationFix.dylib \
            "$APP_PATH/Frameworks/FacebookNotificationFix.dylib"

          chmod 755 \
            "$APP_PATH/Frameworks/FacebookNotificationFix.dylib"

          echo "✅ Apenas o executável da NSE foi substituído"
          echo "✅ Dylib custom copiado para Frameworks"

      - name: Validate V6 structure
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_APPEX: ${{ steps.identify.outputs.notification_appex }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import plistlib
          import struct
          from pathlib import Path

          LC_LOAD_DYLIB = 0x0000000C
          LC_LOAD_WEAK_DYLIB = 0x80000018
          MH_MAGIC_64 = 0xFEEDFACF

          app = Path(os.environ["APP_PATH"])
          main = Path(
              os.environ["MAIN_EXECUTABLE"]
          )
          nse = Path(
              os.environ["NOTIFICATION_EXECUTABLE"]
          )
          target_appex = Path(
              os.environ["NOTIFICATION_APPEX"]
          )

          fix = (
              app
              / "Frameworks"
              / "FacebookNotificationFix.dylib"
          )

          if not fix.is_file():
              raise SystemExit(
                  "❌ FacebookNotificationFix.dylib "
                  "ausente em Frameworks"
              )

          def dependencies(path: Path):
              data = path.read_bytes()

              if len(data) < 32:
                  raise RuntimeError(
                      f"Mach-O pequeno: {path}"
                  )

              magic = struct.unpack_from(
                  "<I",
                  data,
                  0,
              )[0]

              if magic != MH_MAGIC_64:
                  raise RuntimeError(
                      f"Mach-O não suportado: {path}"
                  )

              ncmds = struct.unpack_from(
                  "<I",
                  data,
                  16,
              )[0]

              offset = 32
              result = []

              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from(
                      "<II",
                      data,
                      offset,
                  )

                  if (
                      cmdsize < 8
                      or offset + cmdsize > len(data)
                  ):
                      raise RuntimeError(
                          f"Load command inválido em {path}"
                      )

                  if cmd in (
                      LC_LOAD_DYLIB,
                      LC_LOAD_WEAK_DYLIB,
                  ):
                      nameoff = struct.unpack_from(
                          "<I",
                          data,
                          offset + 8,
                      )[0]

                      start = offset + nameoff
                      end = data.find(
                          b"\0",
                          start,
                          offset + cmdsize,
                      )

                      if end == -1:
                          end = offset + cmdsize

                      name = data[
                          start:end
                      ].decode(
                          "utf-8",
                          errors="replace",
                      )

                      result.append(
                          (cmd, name)
                      )

                  offset += cmdsize

              return result

          main_deps = dependencies(main)
          nse_deps = dependencies(nse)

          custom = (
              "@rpath/FacebookNotificationFix.dylib"
          )

          main_custom = [
              cmd
              for cmd, name in main_deps
              if name == custom
          ]

          if main_custom:
              raise SystemExit(
                  "❌ O Facebook principal foi alterado "
                  "pelo V4; isso não deveria acontecer"
              )

          nse_custom = [
              cmd
              for cmd, name in nse_deps
              if name == custom
          ]

          if nse_custom != [
              LC_LOAD_WEAK_DYLIB
          ]:
              raise SystemExit(
                  "❌ A NSE não contém exatamente 1 "
                  "LC_LOAD_WEAK_DYLIB para o fix: "
                  f"{nse_custom}"
              )

          zx = [
              cmd
              for cmd, name in nse_deps
              if name
              == "@rpath/zxPluginsInject.dylib"
          ]

          if not zx:
              raise SystemExit(
                  "❌ zxPluginsInject deixou de existir "
                  "na NSE"
              )

          if not any(
              "Glow.dylib" in name
              for _, name in main_deps
          ):
              raise SystemExit(
                  "❌ Glow deixou de existir no main"
              )

          plugins = app / "PlugIns"

          for appex in sorted(
              plugins.glob("*.appex")
          ):
              if appex == target_appex:
                  continue

              plist_path = appex / "Info.plist"

              if not plist_path.is_file():
                  continue

              try:
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
              except Exception:
                  continue

              exe = plist.get(
                  "CFBundleExecutable"
              )

              if not exe:
                  continue

              binary = appex / exe

              if not binary.is_file():
                  continue

              deps = dependencies(binary)

              if any(
                  name == custom
                  for _, name in deps
              ):
                  raise SystemExit(
                      "❌ Fix apareceu em outra extensão: "
                      f"{appex.name}"
                  )

          print("✅ V6 validada:")
          print(
              " - Facebook principal: sem fix"
          )
          print(
              " - NotificationServiceExtension: "
              "probe WEAK via IPA Patch"
          )
          print(
              " - zxPluginsInject original preservado"
          )
          print(
              " - Glow original preservado"
          )
          print(
              " - demais extensões: sem fix"
          )
          PY

      - name: Show final hashes
        env:
          APP_PATH: ${{ steps.identify.outputs.app_path }}
          MAIN_EXECUTABLE: ${{ steps.identify.outputs.main_executable }}
          NOTIFICATION_EXECUTABLE: ${{ steps.identify.outputs.notification_executable }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🔎 SHA main:"
          sha256sum "$MAIN_EXECUTABLE"

          echo
          echo "🔎 SHA NSE V6:"
          sha256sum "$NOTIFICATION_EXECUTABLE"

          echo
          echo "🔎 SHA dylib V6:"
          sha256sum \
            "$APP_PATH/Frameworks/FacebookNotificationFix.dylib"

      - name: Repack V6 IPA
        env:
          APP_VERSION: ${{ steps.identify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          OUTPUT_NAME="Facebook-${APP_VERSION}-NotificationFix-V6-SafePassThrough-UNSIGNED.ipa"

          (
            cd baseline
            zip -qry9 "../output/$OUTPUT_NAME" Payload
          )

          unzip -tq \
            "output/$OUTPUT_NAME" \
            > /dev/null

          cat > output/facebook-notification-fix-v6-report.txt <<'REPORT'
          Facebook Notification Fix - V6 SAFE PASS-THROUGH PROBE

          OBJETIVO
          --------
          Isolar se o problema observado na V5 foi causado pelo wrapper do
          contentHandler.

          O QUE A V6 FAZ
          ---------------
          - Mantém o mesmo IPA Patch estável da V4/V5.
          - O Facebook principal NÃO recebe o fix.
          - Somente NotificationServiceExtension recebe FacebookNotificationFix.
          - O zxPluginsInject original continua presente.
          - Glow continua intacto no Facebook principal.
          - O hook intercepta somente:
              -[FBNotificationService
                 didReceiveNotificationRequest:withContentHandler:]
          - O hook chama o método original imediatamente usando:
              * o MESMO request;
              * o MESMO contentHandler.
          - Nenhum conteúdo é modificado.
          - Nenhum badge é modificado.
          - Nenhum App Group é modificado.
          - Nenhum acesso ao Keychain é modificado.
          - Nenhum CFPreferences é modificado.

          COMO INTERPRETAR
          ----------------
          1. Facebook abre + notificações visíveis voltam:
             O wrapper do contentHandler da V5 foi a causa do bloqueio das
             notificações. O próximo teste deve usar outro ponto de observação.

          2. Facebook abre + badges chegam + notificações continuam ausentes:
             O simples hook desse método já interfere. Devemos abandonar
             didReceiveNotificationRequest:withContentHandler: como ponto
             de interceptação.

          NODE 24
          -------
          - actions/upload-artifact@v6
          - actions/download-artifact@v7
          - actions/checkout@v5
          - actions/setup-python@v6

          IMPORTANTE
          ----------
          O IPA final fica sem assinatura válida após a alteração.
          Assine no Feather antes de instalar.
          REPORT

          echo "✅ IPA V6 criado"
          ls -lh "output/$OUTPUT_NAME"
          sha256sum "output/$OUTPUT_NAME"

      - name: Upload V6 test IPA
        uses: actions/upload-artifact@v6
        with:
          name: facebook-notification-fix-v6-safe-pass-through
          path: |
            output/*.ipa
            output/facebook-notification-fix-v6-report.txt
          if-no-files-found: error
          retention-days: 3
