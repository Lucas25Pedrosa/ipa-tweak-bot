name: Save TwitDate DEB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if TwitDate is already saved
        id: check
        run: |
          FILE="addons/x/debs/twitdate_0.0.1-2.deb"

          if [ -f "$FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ TwitDate já existe em $FILE"
            ls -lh "$FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "📥 TwitDate ainda não está salvo no repositório"
          fi

      - name: Download TwitDate from BigBoss
        if: ${{ steps.check.outputs.exists == 'false' }}
        run: |
          set -euo pipefail

          mkdir -p addons/x/debs

          URL="http://apt.thebigboss.org/repofiles/cydia/debs2.0/twitdate_0.0.1-2.deb"
          OUT="addons/x/debs/twitdate_0.0.1-2.deb"

          curl \
            --location \
            --fail \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            --user-agent "APT-HTTP/1.3 (1.8.2)" \
            --output "$OUT" \
            "$URL"

          if [ ! -s "$OUT" ]; then
            echo "❌ Download vazio ou inválido"
            exit 1
          fi

          echo "✅ Download concluído"
          ls -lh "$OUT"

          echo
          echo "🔐 SHA-256:"
          sha256sum "$OUT"

      - name: Commit TwitDate to repository
        if: ${{ steps.check.outputs.exists == 'false' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add addons/x/debs/twitdate_0.0.1-2.deb

          if git diff --cached --quiet; then
            echo "ℹ️ Nenhuma alteração para salvar"
            exit 0
          fi

          git commit -m "Add TwitDate 0.0.1-2 DEB"
          git push

          echo "✅ TwitDate salvo permanentemente em addons/x/debs/"
